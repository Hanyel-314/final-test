<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Three.js Test</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <script>
        console.log('THREE loaded:', typeof THREE !== 'undefined');
        if (typeof THREE !== 'undefined') {
            console.log('THREE.REVISION:', THREE.REVISION);
        }

        // Create scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);
        console.log('Scene created');

        // Create camera
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.7, 10);
        camera.lookAt(0, 3, 0);
        console.log('Camera created at:', camera.position);

        // Create renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        console.log('Renderer created');

        // Create floor
        const floorGeometry = new THREE.PlaneGeometry(15, 9);
        const floorMaterial = new THREE.MeshStandardMaterial({ color: 0xC19A6B });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);
        console.log('Floor added');

        // Create box as basket pole
        const boxGeometry = new THREE.BoxGeometry(0.2, 3, 0.2);
        const boxMaterial = new THREE.MeshStandardMaterial({ color: 0x1a1a1a });
        const box = new THREE.Mesh(boxGeometry, boxMaterial);
        box.position.set(0, 1.5, -4);
        box.castShadow = true;
        scene.add(box);
        console.log('Box added');

        // Create orange torus as basket rim
        const torusGeometry = new THREE.TorusGeometry(0.225, 0.012, 8, 32);
        const torusMaterial = new THREE.MeshStandardMaterial({ color: 0xff6600 });
        const torus = new THREE.Mesh(torusGeometry, torusMaterial);
        torus.position.set(0, 3, -3);
        torus.rotation.x = Math.PI / 2;
        scene.add(torus);
        console.log('Torus (rim) added');

        // Add lights
        const ambientLight = new THREE.AmbientLight(0x404040, 0.8);
        scene.add(ambientLight);
        console.log('Ambient light added');

        const spotlight = new THREE.SpotLight(0xffffff, 2.0);
        spotlight.position.set(0, 8, 0);
        spotlight.target.position.set(0, 0, -2);
        scene.add(spotlight);
        scene.add(spotlight.target);
        console.log('Spotlight added');

        const fillLight = new THREE.DirectionalLight(0x8899ff, 0.5);
        fillLight.position.set(2, 6, 6);
        scene.add(fillLight);
        console.log('Fill light added');

        console.log('Total scene children:', scene.children.length);

        // Render loop
        let frameCount = 0;
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);

            if (frameCount < 5) {
                console.log('Frame rendered:', frameCount++);
            }
        }

        console.log('Starting animation loop...');
        animate();

        console.log('=== Setup complete ===');
    </script>
</body>
</html>
