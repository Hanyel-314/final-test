<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画廊式电梯 - Gallery Elevator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            height: 100vh;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        canvas {
            display: block;
            cursor: crosshair;
        }
    </style>
</head>
<body>
    <canvas id="elevator"></canvas>
    <script>
        'use strict';

        // ========== 配置和常量 ==========
        const STATE = {
            IDLE: 'IDLE',
            MOVING: 'MOVING',
            DOOR_OPENING: 'DOOR_OPENING',
            DOOR_OPEN: 'DOOR_OPEN',
            DOOR_CLOSING: 'DOOR_CLOSING'
        };

        const CONFIG = {
            vanishingPoint: { x: 0.5, y: 0.5 }, // 消失点位置（屏幕比例）- 中心点
            cabinDepth: 0.6, // 电梯厢深度比例（从观察者到前墙的距离）
            doorWidthRatio: 0.28, // 门区域宽度占屏幕比例
            doorHeightRatio: 0.5 // 门区域高度占屏幕比例
        };

        // ========== 画布设置 ==========
        const canvas = document.getElementById('elevator');
        const ctx = canvas.getContext('2d');
        let W, H, VP_X, VP_Y; // 画布尺寸和消失点坐标

        function resizeCanvas() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
            VP_X = W * CONFIG.vanishingPoint.x;
            VP_Y = H * CONFIG.vanishingPoint.y;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // ========== 电梯厢几何定义 ==========
        // 定义全屏封闭式电梯厢 - 观察者站在后墙，面向前墙（门所在位置）
        function getCabinGeometry() {
            // 后墙（观察者位置）- 占满整个屏幕边缘
            const backWall = {
                topLeft: { x: 0, y: 0 },
                topRight: { x: W, y: 0 },
                bottomLeft: { x: 0, y: H },
                bottomRight: { x: W, y: H }
            };

            // 前墙（门所在墙面）- 围绕消失点的较小矩形
            const frontWallWidth = W * CONFIG.doorWidthRatio;
            const frontWallHeight = H * CONFIG.doorHeightRatio;
            const frontWall = {
                topLeft: { x: VP_X - frontWallWidth / 2, y: VP_Y - frontWallHeight / 2 },
                topRight: { x: VP_X + frontWallWidth / 2, y: VP_Y - frontWallHeight / 2 },
                bottomLeft: { x: VP_X - frontWallWidth / 2, y: VP_Y + frontWallHeight / 2 },
                bottomRight: { x: VP_X + frontWallWidth / 2, y: VP_Y + frontWallHeight / 2 }
            };

            return {
                backWall,
                frontWall,
                frontWallWidth,
                frontWallHeight
            };
        }

        // ========== 电梯状态机 ==========
        class Elevator {
            constructor() {
                this.currentFloor = 1;
                this.displayFloor = 1;
                this.targetQueue = [];
                this.state = STATE.IDLE;
                this.doorProgress = 0; // 0=关闭, 1=打开
                this.stateTimer = 0;
                this.moveTimer = 0;
                this.floorChangeTimer = 0;
                this.vibration = 0;

                // 按钮配置
                this.buttons = [
                    { floor: 5, active: false },
                    { floor: 4, active: false },
                    { floor: 3, active: false },
                    { floor: 2, active: false },
                    { floor: 1, active: false }
                ];
            }

            update(dt) {
                this.stateTimer += dt;

                switch(this.state) {
                    case STATE.IDLE:
                        this.doorProgress = 0;
                        this.vibration = 0;
                        if (this.targetQueue.length > 0) {
                            this.state = STATE.MOVING;
                            this.moveTimer = 0;
                            this.floorChangeTimer = 0;
                        }
                        break;

                    case STATE.MOVING:
                        this.moveTimer += dt;
                        // 轻微振动
                        this.vibration = Math.sin(this.moveTimer * 0.01) * 2;

                        if (this.moveTimer > 800) {
                            const target = this.targetQueue[0];

                            if (this.displayFloor < target) {
                                this.displayFloor++;
                                this.floorChangeTimer = 0;
                            } else if (this.displayFloor > target) {
                                this.displayFloor--;
                                this.floorChangeTimer = 0;
                            }

                            this.moveTimer = 0;

                            if (this.displayFloor === target) {
                                this.currentFloor = target;
                                this.targetQueue.shift();
                                this.state = STATE.DOOR_OPENING;
                                this.stateTimer = 0;
                                this.vibration = 0;

                                this.buttons.forEach(btn => {
                                    if (btn.floor === target) btn.active = false;
                                });
                            }
                        }
                        break;

                    case STATE.DOOR_OPENING:
                        this.doorProgress = Math.min(1, this.doorProgress + dt / 1000);
                        if (this.doorProgress >= 1) {
                            this.state = STATE.DOOR_OPEN;
                            this.stateTimer = 0;
                        }
                        break;

                    case STATE.DOOR_OPEN:
                        this.doorProgress = 1;
                        if (this.stateTimer > 2000) {
                            this.state = STATE.DOOR_CLOSING;
                            this.stateTimer = 0;
                        }
                        break;

                    case STATE.DOOR_CLOSING:
                        this.doorProgress = Math.max(0, this.doorProgress - dt / 1000);
                        if (this.doorProgress <= 0) {
                            this.state = STATE.IDLE;
                            this.stateTimer = 0;
                        }
                        break;
                }

                this.floorChangeTimer += dt;
            }

            addTarget(floor) {
                if (floor !== this.currentFloor && !this.targetQueue.includes(floor)) {
                    this.targetQueue.push(floor);
                    this.buttons.forEach(btn => {
                        if (btn.floor === floor) btn.active = true;
                    });
                }
            }

            getStatusText() {
                switch(this.state) {
                    case STATE.IDLE: return 'Select a floor';
                    case STATE.MOVING: return 'Moving...';
                    case STATE.DOOR_OPENING: return `Arriving floor ${this.currentFloor}`;
                    case STATE.DOOR_OPEN: return `Floor ${this.currentFloor}`;
                    case STATE.DOOR_CLOSING: return 'Closing...';
                    default: return '';
                }
            }
        }

        // ========== 场景渲染 ==========
        class Scene {
            constructor() {
                this.elevator = new Elevator();
            }

            // 绘制地板（全屏透视地板）
            drawFloor() {
                const geo = getCabinGeometry();
                ctx.save();
                ctx.translate(0, this.elevator.vibration);

                // 地板主体 - 梯形从后墙底部到前墙底部
                const floorGrad = ctx.createLinearGradient(0, geo.backWall.bottomLeft.y, 0, geo.frontWall.bottomLeft.y);
                floorGrad.addColorStop(0, '#2a2a2a'); // 后方（观察者脚下）较暗
                floorGrad.addColorStop(0.4, '#3a3a3a');
                floorGrad.addColorStop(1, '#4a4a4a'); // 前方（靠近门）较亮

                ctx.fillStyle = floorGrad;
                ctx.beginPath();
                ctx.moveTo(geo.backWall.bottomLeft.x, geo.backWall.bottomLeft.y);
                ctx.lineTo(geo.backWall.bottomRight.x, geo.backWall.bottomRight.y);
                ctx.lineTo(geo.frontWall.bottomRight.x, geo.frontWall.bottomRight.y);
                ctx.lineTo(geo.frontWall.bottomLeft.x, geo.frontWall.bottomLeft.y);
                ctx.closePath();
                ctx.fill();

                // 地板瓷砖网格线 - 横向线条（深度方向）
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.2)';
                ctx.lineWidth = 1;
                for (let i = 0; i <= 8; i++) {
                    const ratio = i / 8;
                    const y = geo.backWall.bottomLeft.y + (geo.frontWall.bottomLeft.y - geo.backWall.bottomLeft.y) * ratio;
                    const leftX = geo.backWall.bottomLeft.x + (geo.frontWall.bottomLeft.x - geo.backWall.bottomLeft.x) * ratio;
                    const rightX = geo.backWall.bottomRight.x + (geo.frontWall.bottomRight.x - geo.backWall.bottomRight.x) * ratio;
                    ctx.beginPath();
                    ctx.moveTo(leftX, y);
                    ctx.lineTo(rightX, y);
                    ctx.stroke();
                }

                // 纵向线条（宽度方向）
                for (let i = 0; i <= 6; i++) {
                    const ratio = i / 6;
                    ctx.beginPath();
                    ctx.moveTo(
                        geo.backWall.bottomLeft.x + (geo.backWall.bottomRight.x - geo.backWall.bottomLeft.x) * ratio,
                        geo.backWall.bottomLeft.y
                    );
                    ctx.lineTo(
                        geo.frontWall.bottomLeft.x + (geo.frontWall.bottomRight.x - geo.frontWall.bottomLeft.x) * ratio,
                        geo.frontWall.bottomLeft.y
                    );
                    ctx.stroke();
                }

                // 地板抛光反光（门前区域）
                const shineGrad = ctx.createRadialGradient(
                    VP_X, geo.frontWall.bottomLeft.y - 40, 0,
                    VP_X, geo.frontWall.bottomLeft.y - 40, geo.frontWallWidth * 0.6
                );
                shineGrad.addColorStop(0, 'rgba(255, 255, 255, 0.15)');
                shineGrad.addColorStop(0.6, 'rgba(255, 255, 255, 0.06)');
                shineGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.fillStyle = shineGrad;
                ctx.beginPath();
                ctx.arc(VP_X, geo.frontWall.bottomLeft.y - 40, geo.frontWallWidth * 0.6, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            // 绘制天花板（全屏透视天花板）
            drawCeiling() {
                const geo = getCabinGeometry();
                ctx.save();
                ctx.translate(0, this.elevator.vibration);

                // 天花板主体 - 梯形从后墙顶部到前墙顶部
                const ceilGrad = ctx.createLinearGradient(0, geo.backWall.topLeft.y, 0, geo.frontWall.topLeft.y);
                ceilGrad.addColorStop(0, '#2a2a2a'); // 后方较暗
                ceilGrad.addColorStop(0.5, '#3a3a3a');
                ceilGrad.addColorStop(1, '#3a3a3a'); // 前方

                ctx.fillStyle = ceilGrad;
                ctx.beginPath();
                ctx.moveTo(geo.backWall.topLeft.x, geo.backWall.topLeft.y);
                ctx.lineTo(geo.frontWall.topLeft.x, geo.frontWall.topLeft.y);
                ctx.lineTo(geo.frontWall.topRight.x, geo.frontWall.topRight.y);
                ctx.lineTo(geo.backWall.topRight.x, geo.backWall.topRight.y);
                ctx.closePath();
                ctx.fill();

                // 天花板嵌入式照明条纹（模拟现代电梯照明）
                const numStrips = 3;
                for (let i = 0; i < numStrips; i++) {
                    const ratio = (i + 1) / (numStrips + 1);
                    const backY = geo.backWall.topLeft.y + (geo.frontWall.topLeft.y - geo.backWall.topLeft.y) * ratio;
                    const backLeftX = geo.backWall.topLeft.x + (geo.frontWall.topLeft.x - geo.backWall.topLeft.x) * ratio;
                    const backRightX = geo.backWall.topRight.x + (geo.frontWall.topRight.x - geo.backWall.topRight.x) * ratio;

                    // 照明条
                    const lightGrad = ctx.createLinearGradient(backLeftX, backY, backRightX, backY);
                    lightGrad.addColorStop(0, 'rgba(255, 248, 220, 0)');
                    lightGrad.addColorStop(0.2, 'rgba(255, 248, 220, 0.12)');
                    lightGrad.addColorStop(0.5, 'rgba(255, 248, 220, 0.18)');
                    lightGrad.addColorStop(0.8, 'rgba(255, 248, 220, 0.12)');
                    lightGrad.addColorStop(1, 'rgba(255, 248, 220, 0)');

                    ctx.fillStyle = lightGrad;
                    const stripHeight = 8;
                    ctx.fillRect(backLeftX, backY - stripHeight / 2, backRightX - backLeftX, stripHeight);
                }

                // 天花板分隔线
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.lineWidth = 1;
                for (let i = 0; i <= 4; i++) {
                    const ratio = i / 4;
                    const y = geo.backWall.topLeft.y + (geo.frontWall.topLeft.y - geo.backWall.topLeft.y) * ratio;
                    const leftX = geo.backWall.topLeft.x + (geo.frontWall.topLeft.x - geo.backWall.topLeft.x) * ratio;
                    const rightX = geo.backWall.topRight.x + (geo.frontWall.topRight.x - geo.backWall.topRight.x) * ratio;
                    ctx.beginPath();
                    ctx.moveTo(leftX, y);
                    ctx.lineTo(rightX, y);
                    ctx.stroke();
                }

                ctx.restore();
            }

            // 绘制左右墙壁（全屏封闭墙面）
            drawWalls() {
                const geo = getCabinGeometry();
                ctx.save();
                ctx.translate(0, this.elevator.vibration);

                // === 左墙 - 连接后墙左侧到前墙左侧 ===
                const leftWallGrad = ctx.createLinearGradient(0, VP_Y, geo.frontWall.topLeft.x, VP_Y);
                leftWallGrad.addColorStop(0, '#1a1a1a'); // 后方（左边缘）很暗
                leftWallGrad.addColorStop(0.3, '#2d2520'); // 暗木棕色
                leftWallGrad.addColorStop(0.7, '#3a3028');
                leftWallGrad.addColorStop(1, '#2a2a2a'); // 前方（靠近门）稍亮

                ctx.fillStyle = leftWallGrad;
                ctx.beginPath();
                ctx.moveTo(geo.backWall.topLeft.x, geo.backWall.topLeft.y);
                ctx.lineTo(geo.frontWall.topLeft.x, geo.frontWall.topLeft.y);
                ctx.lineTo(geo.frontWall.bottomLeft.x, geo.frontWall.bottomLeft.y);
                ctx.lineTo(geo.backWall.bottomLeft.x, geo.backWall.bottomLeft.y);
                ctx.closePath();
                ctx.fill();

                // 左墙反光高光
                const leftHighlight = ctx.createLinearGradient(0, VP_Y, geo.frontWall.topLeft.x, VP_Y);
                leftHighlight.addColorStop(0, 'rgba(255, 255, 255, 0)');
                leftHighlight.addColorStop(0.4, 'rgba(255, 255, 255, 0.08)');
                leftHighlight.addColorStop(1, 'rgba(255, 255, 255, 0.02)');
                ctx.fillStyle = leftHighlight;
                ctx.beginPath();
                ctx.moveTo(geo.backWall.topLeft.x, geo.backWall.topLeft.y);
                ctx.lineTo(geo.frontWall.topLeft.x, geo.frontWall.topLeft.y);
                ctx.lineTo(geo.frontWall.bottomLeft.x, geo.frontWall.bottomLeft.y);
                ctx.lineTo(geo.backWall.bottomLeft.x, geo.backWall.bottomLeft.y);
                ctx.closePath();
                ctx.fill();

                // 左墙前沿装饰线
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(geo.frontWall.topLeft.x, geo.frontWall.topLeft.y);
                ctx.lineTo(geo.frontWall.bottomLeft.x, geo.frontWall.bottomLeft.y);
                ctx.stroke();

                // === 右墙 - 连接后墙右侧到前墙右侧（镜像对称）===
                const rightWallGrad = ctx.createLinearGradient(geo.frontWall.topRight.x, VP_Y, W, VP_Y);
                rightWallGrad.addColorStop(0, '#2a2a2a'); // 前方（靠近门）稍亮
                rightWallGrad.addColorStop(0.3, '#3a3028');
                rightWallGrad.addColorStop(0.7, '#2d2520');
                rightWallGrad.addColorStop(1, '#1a1a1a'); // 后方（右边缘）很暗

                ctx.fillStyle = rightWallGrad;
                ctx.beginPath();
                ctx.moveTo(geo.frontWall.topRight.x, geo.frontWall.topRight.y);
                ctx.lineTo(geo.backWall.topRight.x, geo.backWall.topRight.y);
                ctx.lineTo(geo.backWall.bottomRight.x, geo.backWall.bottomRight.y);
                ctx.lineTo(geo.frontWall.bottomRight.x, geo.frontWall.bottomRight.y);
                ctx.closePath();
                ctx.fill();

                // 右墙反光高光
                const rightHighlight = ctx.createLinearGradient(geo.frontWall.topRight.x, VP_Y, W, VP_Y);
                rightHighlight.addColorStop(0, 'rgba(255, 255, 255, 0.02)');
                rightHighlight.addColorStop(0.6, 'rgba(255, 255, 255, 0.08)');
                rightHighlight.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.fillStyle = rightHighlight;
                ctx.beginPath();
                ctx.moveTo(geo.frontWall.topRight.x, geo.frontWall.topRight.y);
                ctx.lineTo(geo.backWall.topRight.x, geo.backWall.topRight.y);
                ctx.lineTo(geo.backWall.bottomRight.x, geo.backWall.bottomRight.y);
                ctx.lineTo(geo.frontWall.bottomRight.x, geo.frontWall.bottomRight.y);
                ctx.closePath();
                ctx.fill();

                // 右墙前沿装饰线
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(geo.frontWall.topRight.x, geo.frontWall.topRight.y);
                ctx.lineTo(geo.frontWall.bottomRight.x, geo.frontWall.bottomRight.y);
                ctx.stroke();

                // 右墙装饰面板（对称于左侧按钮面板）
                this.drawRightWallDecoration(geo);

                ctx.restore();
            }

            // 右墙装饰元素（对称装饰面板）
            drawRightWallDecoration(geo) {
                // 计算右墙上的装饰面板位置（与左侧按钮面板对称）
                const wallDepth = geo.frontWall.topRight.x - geo.backWall.topRight.x;
                const panelX = geo.backWall.topRight.x + wallDepth * 0.25;
                const panelY = VP_Y - geo.frontWallHeight * 0.35;
                const panelW = geo.frontWallWidth * 0.15;
                const panelH = geo.frontWallHeight * 0.6;

                // 装饰面板阴影
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.fillRect(panelX + 4, panelY + 4, panelW, panelH);

                // 金属装饰板
                const decorGrad = ctx.createLinearGradient(panelX, panelY, panelX + panelW, panelY);
                decorGrad.addColorStop(0, '#2a2a2a');
                decorGrad.addColorStop(0.5, '#4a4a4a');
                decorGrad.addColorStop(1, '#2a2a2a');

                ctx.fillStyle = decorGrad;
                ctx.fillRect(panelX, panelY, panelW, panelH);

                // 边框
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 2;
                ctx.strokeRect(panelX, panelY, panelW, panelH);

                // 装饰线条
                ctx.strokeStyle = '#666';
                ctx.lineWidth = 1;
                for (let i = 1; i <= 3; i++) {
                    const y = panelY + (panelH / 4) * i;
                    ctx.beginPath();
                    ctx.moveTo(panelX + panelW * 0.1, y);
                    ctx.lineTo(panelX + panelW * 0.9, y);
                    ctx.stroke();
                }
            }

            // 绘制前墙背景（门所在的墙面）
            drawFrontWall() {
                const geo = getCabinGeometry();
                ctx.save();
                ctx.translate(0, this.elevator.vibration);

                // 前墙背景 - 深色金属质感
                const wallGrad = ctx.createLinearGradient(0, geo.frontWall.topLeft.y, 0, geo.frontWall.bottomLeft.y);
                wallGrad.addColorStop(0, '#2a2a2a');
                wallGrad.addColorStop(0.5, '#3a3a3a');
                wallGrad.addColorStop(1, '#2a2a2a');

                ctx.fillStyle = wallGrad;
                ctx.fillRect(
                    geo.frontWall.topLeft.x,
                    geo.frontWall.topLeft.y,
                    geo.frontWallWidth,
                    geo.frontWallHeight
                );

                // 前墙边缘装饰框
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 3;
                ctx.strokeRect(
                    geo.frontWall.topLeft.x,
                    geo.frontWall.topLeft.y,
                    geo.frontWallWidth,
                    geo.frontWallHeight
                );

                ctx.restore();
            }

            // 绘制门和门框（位于前墙内）
            drawDoors() {
                const geo = getCabinGeometry();
                ctx.save();
                ctx.translate(0, this.elevator.vibration);

                // 门区域尺寸 - 占据前墙的大部分区域
                const doorMargin = 12; // 门框厚度
                const doorAreaWidth = geo.frontWallWidth - doorMargin * 2;
                const doorAreaHeight = geo.frontWallHeight - doorMargin * 2;
                const doorAreaX = geo.frontWall.topLeft.x + doorMargin;
                const doorAreaY = geo.frontWall.topLeft.y + doorMargin;

                const singleDoorWidth = doorAreaWidth / 2; // 单扇门宽度
                const slideOffset = singleDoorWidth * this.elevator.doorProgress;

                // 门框 - 金属边框
                ctx.fillStyle = '#666';
                ctx.strokeStyle = '#888';
                ctx.lineWidth = 2;
                ctx.strokeRect(doorAreaX, doorAreaY, doorAreaWidth, doorAreaHeight);

                // 内框装饰
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 1;
                ctx.strokeRect(doorAreaX + 3, doorAreaY + 3, doorAreaWidth - 6, doorAreaHeight - 6);

                // 如果门打开，绘制外部场景
                if (this.elevator.doorProgress > 0) {
                    ctx.save();
                    const openingWidth = slideOffset * 2;
                    ctx.beginPath();
                    ctx.rect(VP_X - slideOffset, doorAreaY, openingWidth, doorAreaHeight);
                    ctx.clip();

                    // 外部走廊光线
                    const hallwayGrad = ctx.createLinearGradient(VP_X, doorAreaY, VP_X, doorAreaY + doorAreaHeight);
                    hallwayGrad.addColorStop(0, '#d5d5d5');
                    hallwayGrad.addColorStop(0.5, '#f5f5f5');
                    hallwayGrad.addColorStop(1, '#d5d5d5');
                    ctx.fillStyle = hallwayGrad;
                    ctx.fillRect(VP_X - slideOffset, doorAreaY, openingWidth, doorAreaHeight);

                    // 绘制外部场景
                    this.drawExteriorScene(this.elevator.currentFloor, doorAreaY, doorAreaHeight);

                    ctx.restore();
                }

                // 左门 - 从中心向左滑动
                const leftDoorGrad = ctx.createLinearGradient(
                    VP_X - singleDoorWidth - slideOffset, doorAreaY,
                    VP_X - slideOffset, doorAreaY
                );
                leftDoorGrad.addColorStop(0, '#4a4a4a');
                leftDoorGrad.addColorStop(0.08, '#6a6a6a');
                leftDoorGrad.addColorStop(0.5, '#5a5a5a');
                leftDoorGrad.addColorStop(0.92, '#6a6a6a');
                leftDoorGrad.addColorStop(1, '#4a4a4a');

                ctx.fillStyle = leftDoorGrad;
                ctx.fillRect(VP_X - singleDoorWidth - slideOffset, doorAreaY,
                            singleDoorWidth, doorAreaHeight);

                // 左门垂直装饰线（模拟金属拉丝）
                ctx.strokeStyle = 'rgba(160, 160, 160, 0.4)';
                ctx.lineWidth = 2;
                for (let i = 0; i < 3; i++) {
                    const x = VP_X - singleDoorWidth * (0.25 + i * 0.25) - slideOffset;
                    ctx.beginPath();
                    ctx.moveTo(x, doorAreaY + 30);
                    ctx.lineTo(x, doorAreaY + doorAreaHeight - 30);
                    ctx.stroke();
                }

                // 左门把手
                const handleWidth = singleDoorWidth * 0.15;
                const handleHeight = doorAreaHeight * 0.05;
                const handleY = doorAreaY + doorAreaHeight * 0.48;
                const handleGrad = ctx.createLinearGradient(
                    VP_X - singleDoorWidth * 0.3 - slideOffset, handleY,
                    VP_X - singleDoorWidth * 0.3 - slideOffset, handleY + handleHeight
                );
                handleGrad.addColorStop(0, '#3a3a3a');
                handleGrad.addColorStop(0.5, '#2a2a2a');
                handleGrad.addColorStop(1, '#1a1a1a');
                ctx.fillStyle = handleGrad;
                ctx.fillRect(VP_X - singleDoorWidth * 0.3 - slideOffset, handleY,
                            handleWidth, handleHeight);
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 1;
                ctx.strokeRect(VP_X - singleDoorWidth * 0.3 - slideOffset, handleY,
                              handleWidth, handleHeight);

                // 右门 - 从中心向右滑动
                const rightDoorGrad = ctx.createLinearGradient(
                    VP_X + slideOffset, doorAreaY,
                    VP_X + singleDoorWidth + slideOffset, doorAreaY
                );
                rightDoorGrad.addColorStop(0, '#4a4a4a');
                rightDoorGrad.addColorStop(0.08, '#6a6a6a');
                rightDoorGrad.addColorStop(0.5, '#5a5a5a');
                rightDoorGrad.addColorStop(0.92, '#6a6a6a');
                rightDoorGrad.addColorStop(1, '#4a4a4a');

                ctx.fillStyle = rightDoorGrad;
                ctx.fillRect(VP_X + slideOffset, doorAreaY,
                            singleDoorWidth, doorAreaHeight);

                // 右门垂直装饰线
                ctx.strokeStyle = 'rgba(160, 160, 160, 0.4)';
                ctx.lineWidth = 2;
                for (let i = 0; i < 3; i++) {
                    const x = VP_X + singleDoorWidth * (0.25 + i * 0.25) + slideOffset;
                    ctx.beginPath();
                    ctx.moveTo(x, doorAreaY + 30);
                    ctx.lineTo(x, doorAreaY + doorAreaHeight - 30);
                    ctx.stroke();
                }

                // 右门把手
                ctx.fillStyle = handleGrad;
                ctx.fillRect(VP_X + singleDoorWidth * 0.15 + slideOffset, handleY,
                            handleWidth, handleHeight);
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 1;
                ctx.strokeRect(VP_X + singleDoorWidth * 0.15 + slideOffset, handleY,
                              handleWidth, handleHeight);

                // 中间门缝
                if (this.elevator.doorProgress < 1) {
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.moveTo(VP_X - slideOffset, doorAreaY);
                    ctx.lineTo(VP_X - slideOffset, doorAreaY + doorAreaHeight);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(VP_X + slideOffset, doorAreaY);
                    ctx.lineTo(VP_X + slideOffset, doorAreaY + doorAreaHeight);
                    ctx.stroke();
                }

                ctx.restore();
            }

            // 绘制外部场景装饰
            drawExteriorScene(floor, doorY, doorHeight) {
                ctx.fillStyle = '#666';
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                switch(floor) {
                    case 1:
                        ctx.fillText('LOBBY', VP_X, doorY + doorHeight * 0.3);
                        break;
                    case 2:
                        ctx.fillText('OFFICE', VP_X, doorY + doorHeight * 0.3);
                        break;
                    case 3:
                        ctx.fillText('GALLERY', VP_X, doorY + doorHeight * 0.3);
                        break;
                    case 4:
                        ctx.fillText('NEON', VP_X, doorY + doorHeight * 0.3);
                        break;
                    case 5:
                        ctx.fillText('ROOFTOP', VP_X, doorY + doorHeight * 0.3);
                        break;
                }
            }

            // 绘制楼层显示器（在前墙上方）
            drawFloorIndicator() {
                const geo = getCabinGeometry();
                ctx.save();
                ctx.translate(0, this.elevator.vibration);

                const indW = geo.frontWallWidth * 0.3;
                const indH = geo.frontWallHeight * 0.12;
                const indX = VP_X - indW / 2;
                const indY = geo.frontWall.topLeft.y - indH - 15; // 在前墙上方

                // 显示器外壳
                ctx.fillStyle = '#2a2a2a';
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 2;
                ctx.fillRect(indX, indY, indW, indH);
                ctx.strokeRect(indX, indY, indW, indH);

                // 显示屏
                ctx.fillStyle = '#0a0a0a';
                ctx.fillRect(indX + 5, indY + 5, indW - 10, indH - 10);

                // LED数字闪烁效果
                let glowAlpha = 1;
                if (this.elevator.floorChangeTimer < 200) {
                    glowAlpha = 1 - (this.elevator.floorChangeTimer / 200) * 0.4;
                }

                ctx.fillStyle = `rgba(255, 200, 50, ${glowAlpha})`;
                ctx.font = `bold ${indH * 0.55}px monospace`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.elevator.displayFloor, VP_X, indY + indH / 2);

                // LED光晕
                const glowGrad = ctx.createRadialGradient(VP_X, indY + indH / 2, 0,
                                                         VP_X, indY + indH / 2, indH * 1.2);
                glowGrad.addColorStop(0, `rgba(255, 200, 50, ${glowAlpha * 0.25})`);
                glowGrad.addColorStop(1, 'rgba(255, 200, 50, 0)');
                ctx.fillStyle = glowGrad;
                ctx.fillRect(indX - indH, indY - indH / 2, indW + indH * 2, indH * 2);

                ctx.restore();
            }

            // 绘制按钮面板（安装在左墙上）
            drawButtonPanel() {
                const geo = getCabinGeometry();
                ctx.save();
                ctx.translate(0, this.elevator.vibration);

                // 面板位置 - 在左墙上，靠近观察者
                const wallDepth = geo.frontWall.topLeft.x - geo.backWall.topLeft.x;
                const panelX = geo.backWall.topLeft.x + wallDepth * 0.2;
                const panelY = VP_Y - geo.frontWallHeight * 0.35;
                const panelW = geo.frontWallWidth * 0.18;
                const panelH = geo.frontWallHeight * 0.7;

                // 面板阴影（给一点3D深度感）
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.fillRect(panelX + 4, panelY + 4, panelW, panelH);

                // 面板主体
                const panelGrad = ctx.createLinearGradient(panelX, panelY, panelX + panelW, panelY);
                panelGrad.addColorStop(0, '#3a3a3a');
                panelGrad.addColorStop(0.1, '#4a4a4a');
                panelGrad.addColorStop(0.9, '#3a3a3a');
                panelGrad.addColorStop(1, '#2a2a2a');

                ctx.fillStyle = panelGrad;
                ctx.fillRect(panelX, panelY, panelW, panelH);

                // 面板边框
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 3;
                ctx.strokeRect(panelX, panelY, panelW, panelH);

                // 内侧边框装饰
                ctx.strokeStyle = '#666';
                ctx.lineWidth = 1;
                ctx.strokeRect(panelX + 6, panelY + 6, panelW - 12, panelH - 12);

                // 绘制5个楼层按钮
                const buttonRadius = Math.min(panelW * 0.22, panelH * 0.075);
                const buttonSpacing = panelH * 0.155;
                const startY = panelY + panelH * 0.18;

                this.elevator.buttons.forEach((btn, i) => {
                    const bx = panelX + panelW / 2;
                    const by = startY + i * buttonSpacing;

                    const isCurrent = btn.floor === this.elevator.currentFloor;
                    const isActive = btn.active;

                    // 按钮凹槽
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                    ctx.beginPath();
                    ctx.arc(bx, by, buttonRadius * 1.15, 0, Math.PI * 2);
                    ctx.fill();

                    // 按钮阴影
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                    ctx.beginPath();
                    ctx.arc(bx + 1.5, by + 1.5, buttonRadius, 0, Math.PI * 2);
                    ctx.fill();

                    // 按钮本体
                    const btnGrad = ctx.createRadialGradient(
                        bx - buttonRadius * 0.35, by - buttonRadius * 0.35, buttonRadius * 0.1,
                        bx, by, buttonRadius
                    );

                    if (isActive) {
                        btnGrad.addColorStop(0, '#ffe44d');
                        btnGrad.addColorStop(0.6, '#ffbb00');
                        btnGrad.addColorStop(1, '#cc9900');
                    } else {
                        btnGrad.addColorStop(0, '#6a6a6a');
                        btnGrad.addColorStop(0.6, '#4a4a4a');
                        btnGrad.addColorStop(1, '#2a2a2a');
                    }

                    ctx.fillStyle = btnGrad;
                    ctx.beginPath();
                    ctx.arc(bx, by, buttonRadius, 0, Math.PI * 2);
                    ctx.fill();

                    // 当前楼层指示灯
                    if (isCurrent) {
                        ctx.strokeStyle = '#00ff00';
                        ctx.lineWidth = 2.5;
                        ctx.beginPath();
                        ctx.arc(bx, by, buttonRadius * 1.05, 0, Math.PI * 2);
                        ctx.stroke();
                    }

                    // 按钮高光
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.arc(bx - buttonRadius * 0.25, by - buttonRadius * 0.25,
                           buttonRadius * 0.4, 0, Math.PI);
                    ctx.stroke();

                    // 激活时的光晕
                    if (isActive) {
                        const glowGrad = ctx.createRadialGradient(bx, by, buttonRadius,
                                                                 bx, by, buttonRadius * 2.2);
                        glowGrad.addColorStop(0, 'rgba(255, 200, 50, 0.35)');
                        glowGrad.addColorStop(1, 'rgba(255, 200, 50, 0)');
                        ctx.fillStyle = glowGrad;
                        ctx.beginPath();
                        ctx.arc(bx, by, buttonRadius * 2.2, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // 楼层数字
                    ctx.fillStyle = isActive ? '#000' : '#e0e0e0';
                    ctx.font = `bold ${buttonRadius * 1.1}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(btn.floor, bx, by + 1);

                    // 保存按钮位置用于点击检测
                    btn.screenPos = { x: bx, y: by, radius: buttonRadius * 1.3 };
                });

                ctx.restore();
            }

            // 绘制环境光效（柔和照明）
            drawAtmosphere() {
                const geo = getCabinGeometry();

                // 中央区域（门和指示器周围）稍亮
                const centerLight = ctx.createRadialGradient(VP_X, VP_Y, 0,
                                                             VP_X, VP_Y, Math.max(W, H) * 0.5);
                centerLight.addColorStop(0, 'rgba(255, 248, 220, 0.03)');
                centerLight.addColorStop(0.5, 'rgba(255, 248, 220, 0.01)');
                centerLight.addColorStop(1, 'rgba(0, 0, 0, 0)');

                ctx.fillStyle = centerLight;
                ctx.fillRect(0, 0, W, H);

                // 四角暗角效果
                const vignette = ctx.createRadialGradient(VP_X, VP_Y, Math.min(W, H) * 0.3,
                                                          VP_X, VP_Y, Math.max(W, H) * 0.8);
                vignette.addColorStop(0, 'rgba(0, 0, 0, 0)');
                vignette.addColorStop(0.7, 'rgba(0, 0, 0, 0.1)');
                vignette.addColorStop(1, 'rgba(0, 0, 0, 0.25)');

                ctx.fillStyle = vignette;
                ctx.fillRect(0, 0, W, H);
            }

            // 绘制状态文字
            drawStatusText() {
                ctx.fillStyle = 'rgba(220, 220, 220, 0.8)';
                ctx.font = '16px Arial';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                ctx.fillText(this.elevator.getStatusText(), 20, 20);

                if (this.elevator.targetQueue.length > 0) {
                    ctx.fillStyle = 'rgba(180, 180, 180, 0.8)';
                    ctx.font = '14px Arial';
                    ctx.fillText(`Queue: ${this.elevator.targetQueue.join(', ')}`, 20, H - 40);
                }
            }

            // 主渲染函数
            render() {
                // 清屏
                ctx.fillStyle = '#0a0a0a';
                ctx.fillRect(0, 0, W, H);

                // 绘制顺序（从后到前，构建封闭电梯厢）
                this.drawCeiling();        // 天花板
                this.drawFloor();          // 地板
                this.drawWalls();          // 左右侧墙
                this.drawFrontWall();      // 前墙背景
                this.drawDoors();          // 门和门框
                this.drawFloorIndicator(); // 楼层显示器
                this.drawButtonPanel();    // 按钮面板
                this.drawAtmosphere();     // 环境光效
                this.drawStatusText();     // 状态文字
            }
        }

        // ========== 主循环 ==========
        const scene = new Scene();
        let lastTime = performance.now();

        function animate(currentTime) {
            const deltaTime = currentTime - lastTime;
            lastTime = currentTime;

            scene.elevator.update(deltaTime);
            scene.render();

            requestAnimationFrame(animate);
        }

        animate(performance.now());

        // ========== 交互事件 ==========
        function handleClick(x, y) {
            if (scene.elevator.state === STATE.IDLE ||
                scene.elevator.state === STATE.DOOR_OPEN ||
                scene.elevator.state === STATE.MOVING) {

                scene.elevator.buttons.forEach(btn => {
                    if (btn.screenPos) {
                        const dx = x - btn.screenPos.x;
                        const dy = y - btn.screenPos.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < btn.screenPos.radius) {
                            scene.elevator.addTarget(btn.floor);
                            console.log('Floor selected:', btn.floor);
                        }
                    }
                });
            }
        }

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            handleClick(e.clientX - rect.left, e.clientY - rect.top);
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            handleClick(touch.clientX - rect.left, touch.clientY - rect.top);
        }, { passive: false });
    </script>
</body>
