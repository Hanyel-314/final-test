<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画廊式电梯 - Gallery Elevator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            height: 100vh;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        canvas {
            display: block;
            cursor: crosshair;
        }
    </style>
</head>
<body>
    <canvas id="elevator"></canvas>
    <script>
        'use strict';

        // ========== 配置和常量 ==========
        const STATE = {
            IDLE: 'IDLE',
            MOVING: 'MOVING',
            DOOR_OPENING: 'DOOR_OPENING',
            DOOR_OPEN: 'DOOR_OPEN',
            DOOR_CLOSING: 'DOOR_CLOSING'
        };

        const CONFIG = {
            vanishingPoint: { x: 0.5, y: 0.45 }, // 消失点位置（屏幕比例）
            ceilingLights: 4, // 天花板灯数量
            perspectiveFactor: 0.7, // 透视强度
            floorGridSize: 12, // 地板网格线数量
            wallRailsCount: 5 // 墙面横条数量
        };

        // ========== 画布设置 ==========
        const canvas = document.getElementById('elevator');
        const ctx = canvas.getContext('2d');
        let W, H, VP_X, VP_Y; // 画布尺寸和消失点坐标

        function resizeCanvas() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
            VP_X = W * CONFIG.vanishingPoint.x;
            VP_Y = H * CONFIG.vanishingPoint.y;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // ========== 透视投影辅助函数 ==========
        // 根据深度(z: 0=近处, 1=远处)计算透视缩放
        function getPerspectiveScale(z) {
            return 1 - z * CONFIG.perspectiveFactor;
        }

        // 将3D点(x: -1到1, y: -1到1, z: 0到1)投影到屏幕
        function project3D(x, y, z) {
            const scale = getPerspectiveScale(z);
            const screenX = VP_X + (x * W * 0.5 * scale);
            const screenY = VP_Y + (y * H * 0.5 * scale);
            return { x: screenX, y: screenY, scale };
        }

        // ========== 电梯状态机 ==========
        class Elevator {
            constructor() {
                this.currentFloor = 1;
                this.displayFloor = 1;
                this.targetQueue = [];
                this.state = STATE.IDLE;
                this.doorProgress = 0; // 0=关闭, 1=打开
                this.stateTimer = 0;
                this.moveTimer = 0;
                this.floorChangeTimer = 0;
                this.vibration = 0;

                // 按钮配置
                this.buttons = [
                    { floor: 5, active: false },
                    { floor: 4, active: false },
                    { floor: 3, active: false },
                    { floor: 2, active: false },
                    { floor: 1, active: false }
                ];
            }

            update(dt) {
                this.stateTimer += dt;

                switch(this.state) {
                    case STATE.IDLE:
                        this.doorProgress = 0;
                        this.vibration = 0;
                        if (this.targetQueue.length > 0) {
                            this.state = STATE.MOVING;
                            this.moveTimer = 0;
                            this.floorChangeTimer = 0;
                        }
                        break;

                    case STATE.MOVING:
                        this.moveTimer += dt;
                        // 轻微振动
                        this.vibration = Math.sin(this.moveTimer * 0.01) * 2;

                        if (this.moveTimer > 800) {
                            const target = this.targetQueue[0];

                            if (this.displayFloor < target) {
                                this.displayFloor++;
                                this.floorChangeTimer = 0;
                            } else if (this.displayFloor > target) {
                                this.displayFloor--;
                                this.floorChangeTimer = 0;
                            }

                            this.moveTimer = 0;

                            if (this.displayFloor === target) {
                                this.currentFloor = target;
                                this.targetQueue.shift();
                                this.state = STATE.DOOR_OPENING;
                                this.stateTimer = 0;
                                this.vibration = 0;

                                this.buttons.forEach(btn => {
                                    if (btn.floor === target) btn.active = false;
                                });
                            }
                        }
                        break;

                    case STATE.DOOR_OPENING:
                        this.doorProgress = Math.min(1, this.doorProgress + dt / 1000);
                        if (this.doorProgress >= 1) {
                            this.state = STATE.DOOR_OPEN;
                            this.stateTimer = 0;
                        }
                        break;

                    case STATE.DOOR_OPEN:
                        this.doorProgress = 1;
                        if (this.stateTimer > 2000) {
                            this.state = STATE.DOOR_CLOSING;
                            this.stateTimer = 0;
                        }
                        break;

                    case STATE.DOOR_CLOSING:
                        this.doorProgress = Math.max(0, this.doorProgress - dt / 1000);
                        if (this.doorProgress <= 0) {
                            this.state = STATE.IDLE;
                            this.stateTimer = 0;
                        }
                        break;
                }

                this.floorChangeTimer += dt;
            }

            addTarget(floor) {
                if (floor !== this.currentFloor && !this.targetQueue.includes(floor)) {
                    this.targetQueue.push(floor);
                    this.buttons.forEach(btn => {
                        if (btn.floor === floor) btn.active = true;
                    });
                }
            }

            getStatusText() {
                switch(this.state) {
                    case STATE.IDLE: return 'Select a floor';
                    case STATE.MOVING: return 'Moving...';
                    case STATE.DOOR_OPENING: return `Arriving floor ${this.currentFloor}`;
                    case STATE.DOOR_OPEN: return `Floor ${this.currentFloor}`;
                    case STATE.DOOR_CLOSING: return 'Closing...';
                    default: return '';
                }
            }
        }

        // ========== 场景渲染 ==========
        class Scene {
            constructor() {
                this.elevator = new Elevator();
            }

            // 绘制地板（透视网格）
            drawFloor() {
                ctx.save();
                ctx.translate(0, this.elevator.vibration);

                // 地板梯形
                const floorBottom = H;
                const floorTop = VP_Y;

                // 地板基础填充
                const floorGrad = ctx.createLinearGradient(0, floorTop, 0, floorBottom);
                floorGrad.addColorStop(0, '#3a3a3a');
                floorGrad.addColorStop(0.6, '#2a2a2a');
                floorGrad.addColorStop(1, '#1a1a1a');

                ctx.fillStyle = floorGrad;
                ctx.beginPath();
                const floorNear = W * 0.9;
                const floorFar = W * 0.3;
                ctx.moveTo((W - floorNear) / 2, floorBottom);
                ctx.lineTo((W + floorNear) / 2, floorBottom);
                ctx.lineTo(VP_X + floorFar / 2, floorTop);
                ctx.lineTo(VP_X - floorFar / 2, floorTop);
                ctx.closePath();
                ctx.fill();

                // 透视网格线
                ctx.strokeStyle = 'rgba(80, 80, 80, 0.4)';
                ctx.lineWidth = 1;

                // 横向网格线（向消失点收束）
                for (let i = 0; i <= CONFIG.floorGridSize; i++) {
                    const ratio = i / CONFIG.floorGridSize;
                    const y = floorTop + (floorBottom - floorTop) * ratio;
                    const width = floorFar + (floorNear - floorFar) * ratio;

                    ctx.beginPath();
                    ctx.moveTo(VP_X - width / 2, y);
                    ctx.lineTo(VP_X + width / 2, y);
                    ctx.stroke();
                }

                // 纵向网格线（向消失点汇聚）
                for (let i = 0; i <= 8; i++) {
                    const xRatio = (i - 4) / 4;
                    const xNear = VP_X + (floorNear / 2) * xRatio;
                    const xFar = VP_X + (floorFar / 2) * xRatio;

                    ctx.beginPath();
                    ctx.moveTo(xNear, floorBottom);
                    ctx.lineTo(xFar, floorTop);
                    ctx.stroke();
                }

                // 地板中央反光
                const reflectGrad = ctx.createRadialGradient(VP_X, H * 0.7, 0, VP_X, H * 0.7, W * 0.3);
                reflectGrad.addColorStop(0, 'rgba(255, 255, 255, 0.08)');
                reflectGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.fillStyle = reflectGrad;
                ctx.fillRect(0, floorTop, W, floorBottom - floorTop);

                ctx.restore();
            }

            // 绘制天花板和吊灯
            drawCeiling() {
                ctx.save();
                ctx.translate(0, this.elevator.vibration);

                const ceilingTop = 0;
                const ceilingBottom = VP_Y;

                // 天花板梯形
                const ceilGrad = ctx.createLinearGradient(0, ceilingTop, 0, ceilingBottom);
                ceilGrad.addColorStop(0, '#4a4a4a');
                ceilGrad.addColorStop(1, '#3a3a3a');

                ctx.fillStyle = ceilGrad;
                ctx.beginPath();
                const ceilNear = W * 0.9;
                const ceilFar = W * 0.3;
                ctx.moveTo((W - ceilNear) / 2, ceilingTop);
                ctx.lineTo((W + ceilNear) / 2, ceilingTop);
                ctx.lineTo(VP_X + ceilFar / 2, ceilingBottom);
                ctx.lineTo(VP_X - ceilFar / 2, ceilingBottom);
                ctx.closePath();
                ctx.fill();

                // 绘制天花板吊灯（递减透视）
                for (let i = 0; i < CONFIG.ceilingLights; i++) {
                    const z = i / (CONFIG.ceilingLights - 1); // 0到1
                    const y = ceilingTop + (ceilingBottom - ceilingTop) * z * 0.8;
                    const scale = getPerspectiveScale(z);
                    const lightSize = 60 * scale;

                    // 灯体
                    ctx.fillStyle = '#f5f5dc';
                    ctx.beginPath();
                    ctx.arc(VP_X, y, lightSize * 0.3, 0, Math.PI * 2);
                    ctx.fill();

                    // 灯光光晕（多层）
                    for (let j = 0; j < 4; j++) {
                        const glowGrad = ctx.createRadialGradient(
                            VP_X, y, lightSize * (0.3 + j * 0.2),
                            VP_X, y, lightSize * (0.8 + j * 0.5)
                        );
                        glowGrad.addColorStop(0, `rgba(255, 248, 220, ${0.3 - j * 0.06})`);
                        glowGrad.addColorStop(1, 'rgba(255, 248, 220, 0)');
                        ctx.fillStyle = glowGrad;
                        ctx.fillRect(VP_X - lightSize * 2, y - lightSize * 2, lightSize * 4, lightSize * 4);
                    }
                }

                ctx.restore();
            }

            // 绘制左右墙壁
            drawWalls() {
                ctx.save();
                ctx.translate(0, this.elevator.vibration);

                const topY = 0;
                const bottomY = H;
                const midY = VP_Y;

                // 左墙
                const leftGrad = ctx.createLinearGradient(0, midY, W * 0.2, midY);
                leftGrad.addColorStop(0, '#1a1a1a');
                leftGrad.addColorStop(0.3, '#2a2a2a');
                leftGrad.addColorStop(1, '#1a1a1a');

                ctx.fillStyle = leftGrad;
                ctx.beginPath();
                ctx.moveTo(0, topY);
                ctx.lineTo(W * 0.1, topY);
                ctx.lineTo(VP_X - W * 0.15, midY);
                ctx.lineTo(VP_X - W * 0.15, midY);
                ctx.lineTo(W * 0.1, bottomY);
                ctx.lineTo(0, bottomY);
                ctx.closePath();
                ctx.fill();

                // 右墙
                const rightGrad = ctx.createLinearGradient(W * 0.8, midY, W, midY);
                rightGrad.addColorStop(0, '#1a1a1a');
                rightGrad.addColorStop(0.7, '#2a2a2a');
                rightGrad.addColorStop(1, '#1a1a1a');

                ctx.fillStyle = rightGrad;
                ctx.beginPath();
                ctx.moveTo(W, topY);
                ctx.lineTo(W * 0.9, topY);
                ctx.lineTo(VP_X + W * 0.15, midY);
                ctx.lineTo(VP_X + W * 0.15, midY);
                ctx.lineTo(W * 0.9, bottomY);
                ctx.lineTo(W, bottomY);
                ctx.closePath();
                ctx.fill();

                // 墙面横条（增强透视）
                ctx.strokeStyle = 'rgba(100, 100, 100, 0.3)';
                ctx.lineWidth = 2;

                for (let i = 1; i <= CONFIG.wallRailsCount; i++) {
                    const ratio = i / (CONFIG.wallRailsCount + 1);
                    const y = topY + (bottomY - topY) * ratio;

                    // 左墙横条
                    ctx.beginPath();
                    const leftNearX = W * 0.1 * (1 - ratio * 0.5);
                    const leftFarX = VP_X - W * 0.15;
                    ctx.moveTo(leftNearX, y);
                    ctx.lineTo(leftFarX, midY + (y - midY) * 0.3);
                    ctx.stroke();

                    // 右墙横条
                    ctx.beginPath();
                    const rightNearX = W - W * 0.1 * (1 - ratio * 0.5);
                    const rightFarX = VP_X + W * 0.15;
                    ctx.moveTo(rightNearX, y);
                    ctx.lineTo(rightFarX, midY + (y - midY) * 0.3);
                    ctx.stroke();
                }

                ctx.restore();
            }

            // 绘制背景墙（门的背景）
            drawBackWall() {
                ctx.save();
                ctx.translate(0, this.elevator.vibration);

                const wallWidth = W * 0.3;
                const wallHeight = H * 0.5;
                const wallX = VP_X - wallWidth / 2;
                const wallY = VP_Y - wallHeight / 2;

                // 背景墙
                ctx.fillStyle = '#2a2a2a';
                ctx.fillRect(wallX, wallY, wallWidth, wallHeight);

                // 墙面边缘阴影
                ctx.strokeStyle = '#1a1a1a';
                ctx.lineWidth = 3;
                ctx.strokeRect(wallX, wallY, wallWidth, wallHeight);

                ctx.restore();
            }

            // 绘制3D门
            drawDoors() {
                ctx.save();
                ctx.translate(0, this.elevator.vibration);

                const doorWidth = W * 0.13;
                const doorHeight = H * 0.45;
                const doorY = VP_Y - doorHeight / 2;
                const slideOffset = doorWidth * this.elevator.doorProgress;

                // 门框
                ctx.fillStyle = '#555';
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 4;
                const frameThick = 8;

                // 顶部门框
                ctx.fillRect(VP_X - doorWidth - frameThick, doorY - frameThick,
                            doorWidth * 2 + frameThick * 2, frameThick);
                // 底部门框
                ctx.fillRect(VP_X - doorWidth - frameThick, doorY + doorHeight,
                            doorWidth * 2 + frameThick * 2, frameThick);
                // 左侧门框
                ctx.fillRect(VP_X - doorWidth - frameThick, doorY,
                            frameThick, doorHeight);
                // 右侧门框
                ctx.fillRect(VP_X + doorWidth, doorY,
                            frameThick, doorHeight);

                // 如果门打开，绘制外部走廊
                if (this.elevator.doorProgress > 0) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.rect(VP_X - slideOffset, doorY, slideOffset * 2, doorHeight);
                    ctx.clip();

                    // 外部走廊（过曝光效果）
                    const hallwayGrad = ctx.createLinearGradient(VP_X, doorY, VP_X, doorY + doorHeight);
                    hallwayGrad.addColorStop(0, '#d0d0d0');
                    hallwayGrad.addColorStop(0.5, '#f0f0f0');
                    hallwayGrad.addColorStop(1, '#d0d0d0');
                    ctx.fillStyle = hallwayGrad;
                    ctx.fillRect(VP_X - slideOffset, doorY, slideOffset * 2, doorHeight);

                    // 外部楼层装饰
                    this.drawExteriorScene(this.elevator.currentFloor, doorY, doorHeight);

                    ctx.restore();
                }

                // 左门
                const leftDoorGrad = ctx.createLinearGradient(
                    VP_X - doorWidth - slideOffset, 0,
                    VP_X - slideOffset, 0
                );
                leftDoorGrad.addColorStop(0, '#4a4a4a');
                leftDoorGrad.addColorStop(0.05, '#6a6a6a');
                leftDoorGrad.addColorStop(0.5, '#5a5a5a');
                leftDoorGrad.addColorStop(0.95, '#6a6a6a');
                leftDoorGrad.addColorStop(1, '#4a4a4a');

                ctx.fillStyle = leftDoorGrad;
                ctx.fillRect(VP_X - doorWidth - slideOffset, doorY, doorWidth, doorHeight);

                // 左门高光线
                ctx.strokeStyle = 'rgba(150, 150, 150, 0.5)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(VP_X - doorWidth * 0.5 - slideOffset, doorY + 20);
                ctx.lineTo(VP_X - doorWidth * 0.5 - slideOffset, doorY + doorHeight - 20);
                ctx.stroke();

                // 左门把手
                ctx.fillStyle = '#333';
                ctx.fillRect(VP_X - doorWidth * 0.3 - slideOffset, doorY + doorHeight * 0.45,
                            doorWidth * 0.15, doorHeight * 0.08);

                // 右门
                const rightDoorGrad = ctx.createLinearGradient(
                    VP_X + slideOffset, 0,
                    VP_X + doorWidth + slideOffset, 0
                );
                rightDoorGrad.addColorStop(0, '#4a4a4a');
                rightDoorGrad.addColorStop(0.05, '#6a6a6a');
                rightDoorGrad.addColorStop(0.5, '#5a5a5a');
                rightDoorGrad.addColorStop(0.95, '#6a6a6a');
                rightDoorGrad.addColorStop(1, '#4a4a4a');

                ctx.fillStyle = rightDoorGrad;
                ctx.fillRect(VP_X + slideOffset, doorY, doorWidth, doorHeight);

                // 右门高光线
                ctx.strokeStyle = 'rgba(150, 150, 150, 0.5)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(VP_X + doorWidth * 0.5 + slideOffset, doorY + 20);
                ctx.lineTo(VP_X + doorWidth * 0.5 + slideOffset, doorY + doorHeight - 20);
                ctx.stroke();

                // 右门把手
                ctx.fillStyle = '#333';
                ctx.fillRect(VP_X + doorWidth * 0.15 + slideOffset, doorY + doorHeight * 0.45,
                            doorWidth * 0.15, doorHeight * 0.08);

                // 门缝
                if (this.elevator.doorProgress < 1) {
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(VP_X - slideOffset, doorY);
                    ctx.lineTo(VP_X - slideOffset, doorY + doorHeight);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(VP_X + slideOffset, doorY);
                    ctx.lineTo(VP_X + slideOffset, doorY + doorHeight);
                    ctx.stroke();
                }

                ctx.restore();
            }

            // 绘制外部场景装饰
            drawExteriorScene(floor, doorY, doorHeight) {
                ctx.fillStyle = '#666';
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                switch(floor) {
                    case 1:
                        ctx.fillText('LOBBY', VP_X, doorY + doorHeight * 0.3);
                        break;
                    case 2:
                        ctx.fillText('OFFICE', VP_X, doorY + doorHeight * 0.3);
                        break;
                    case 3:
                        ctx.fillText('GALLERY', VP_X, doorY + doorHeight * 0.3);
                        break;
                    case 4:
                        ctx.fillText('NEON', VP_X, doorY + doorHeight * 0.3);
                        break;
                    case 5:
                        ctx.fillText('ROOFTOP', VP_X, doorY + doorHeight * 0.3);
                        break;
                }
            }

            // 绘制楼层显示器
            drawFloorIndicator() {
                ctx.save();
                ctx.translate(0, this.elevator.vibration);

                const indW = W * 0.08;
                const indH = H * 0.05;
                const indX = VP_X - indW / 2;
                const indY = VP_Y - H * 0.3;

                // 显示器外壳（带透视倾斜）
                ctx.fillStyle = '#2a2a2a';
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 2;
                ctx.fillRect(indX, indY, indW, indH);
                ctx.strokeRect(indX, indY, indW, indH);

                // 显示屏
                ctx.fillStyle = '#0a0a0a';
                ctx.fillRect(indX + 4, indY + 4, indW - 8, indH - 8);

                // LED数字
                let glowAlpha = 1;
                if (this.elevator.floorChangeTimer < 200) {
                    glowAlpha = 1 - (this.elevator.floorChangeTimer / 200) * 0.4;
                }

                ctx.fillStyle = `rgba(255, 200, 50, ${glowAlpha})`;
                ctx.font = `bold ${indH * 0.6}px monospace`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.elevator.displayFloor, VP_X, indY + indH / 2);

                // LED光晕
                const glowGrad = ctx.createRadialGradient(VP_X, indY + indH / 2, 0,
                                                         VP_X, indY + indH / 2, indH);
                glowGrad.addColorStop(0, `rgba(255, 200, 50, ${glowAlpha * 0.3})`);
                glowGrad.addColorStop(1, 'rgba(255, 200, 50, 0)');
                ctx.fillStyle = glowGrad;
                ctx.fillRect(indX - indH, indY - indH / 2, indW + indH * 2, indH * 2);

                ctx.restore();
            }

            // 绘制按钮面板
            drawButtonPanel() {
                ctx.save();
                ctx.translate(0, this.elevator.vibration);

                // 面板位置（左墙上，有透视）
                const panelX = W * 0.15;
                const panelY = H * 0.35;
                const panelW = W * 0.08;
                const panelH = H * 0.45;

                // 面板阴影
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(panelX + 5, panelY + 5, panelW, panelH);

                // 面板主体（带厚度）
                const panelGrad = ctx.createLinearGradient(panelX, panelY, panelX + panelW, panelY);
                panelGrad.addColorStop(0, '#3a3a3a');
                panelGrad.addColorStop(0.1, '#4a4a4a');
                panelGrad.addColorStop(0.9, '#3a3a3a');
                panelGrad.addColorStop(1, '#2a2a2a');

                ctx.fillStyle = panelGrad;
                ctx.fillRect(panelX, panelY, panelW, panelH);

                // 面板边框
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 2;
                ctx.strokeRect(panelX, panelY, panelW, panelH);

                // 绘制按钮
                const buttonRadius = Math.min(panelW, panelH) * 0.12;
                const buttonSpacing = panelH * 0.16;
                const startY = panelY + panelH * 0.15;

                this.elevator.buttons.forEach((btn, i) => {
                    const bx = panelX + panelW / 2;
                    const by = startY + i * buttonSpacing;

                    const isCurrent = btn.floor === this.elevator.currentFloor;
                    const isActive = btn.active;

                    // 按钮阴影
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                    ctx.beginPath();
                    ctx.arc(bx + 2, by + 2, buttonRadius, 0, Math.PI * 2);
                    ctx.fill();

                    // 按钮本体（凸起效果）
                    const btnGrad = ctx.createRadialGradient(
                        bx - buttonRadius * 0.3, by - buttonRadius * 0.3, 0,
                        bx, by, buttonRadius
                    );

                    if (isActive) {
                        btnGrad.addColorStop(0, '#ffd700');
                        btnGrad.addColorStop(0.6, '#ffaa00');
                        btnGrad.addColorStop(1, '#cc8800');
                    } else {
                        btnGrad.addColorStop(0, '#666');
                        btnGrad.addColorStop(0.6, '#444');
                        btnGrad.addColorStop(1, '#222');
                    }

                    ctx.fillStyle = btnGrad;
                    ctx.beginPath();
                    ctx.arc(bx, by, buttonRadius, 0, Math.PI * 2);
                    ctx.fill();

                    // 按钮边缘
                    ctx.strokeStyle = isCurrent ? '#0f0' : '#333';
                    ctx.lineWidth = isCurrent ? 2 : 1;
                    ctx.beginPath();
                    ctx.arc(bx, by, buttonRadius, 0, Math.PI * 2);
                    ctx.stroke();

                    // 按钮光晕（激活时）
                    if (isActive) {
                        const glowGrad = ctx.createRadialGradient(bx, by, buttonRadius,
                                                                 bx, by, buttonRadius * 2);
                        glowGrad.addColorStop(0, 'rgba(255, 200, 50, 0.4)');
                        glowGrad.addColorStop(1, 'rgba(255, 200, 50, 0)');
                        ctx.fillStyle = glowGrad;
                        ctx.beginPath();
                        ctx.arc(bx, by, buttonRadius * 2, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // 数字
                    ctx.fillStyle = isActive ? '#000' : '#fff';
                    ctx.font = `bold ${buttonRadius}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(btn.floor, bx, by);

                    // 保存按钮位置用于点击检测
                    btn.screenPos = { x: bx, y: by, radius: buttonRadius };
                });

                ctx.restore();
            }

            // 绘制大气雾效果
            drawAtmosphere() {
                // 从底部到消失点的雾气渐变
                const fogGrad = ctx.createLinearGradient(0, H, 0, VP_Y);
                fogGrad.addColorStop(0, 'rgba(0, 0, 0, 0.3)');
                fogGrad.addColorStop(0.5, 'rgba(0, 0, 0, 0.1)');
                fogGrad.addColorStop(1, 'rgba(255, 248, 220, 0.1)');

                ctx.fillStyle = fogGrad;
                ctx.fillRect(0, 0, W, H);
            }

            // 绘制状态文字
            drawStatusText() {
                ctx.fillStyle = 'rgba(220, 220, 220, 0.8)';
                ctx.font = '16px Arial';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                ctx.fillText(this.elevator.getStatusText(), 20, 20);

                if (this.elevator.targetQueue.length > 0) {
                    ctx.fillStyle = 'rgba(180, 180, 180, 0.8)';
                    ctx.font = '14px Arial';
                    ctx.fillText(`Queue: ${this.elevator.targetQueue.join(', ')}`, 20, H - 40);
                }
            }

            // 主渲染函数
            render() {
                // 清屏
                ctx.fillStyle = '#0a0a0a';
                ctx.fillRect(0, 0, W, H);

                // 绘制顺序（从后到前）
                this.drawFloor();
                this.drawCeiling();
                this.drawWalls();
                this.drawBackWall();
                this.drawDoors();
                this.drawAtmosphere();
                this.drawFloorIndicator();
                this.drawButtonPanel();
                this.drawStatusText();
            }
        }

        // ========== 主循环 ==========
        const scene = new Scene();
        let lastTime = performance.now();

        function animate(currentTime) {
            const deltaTime = currentTime - lastTime;
            lastTime = currentTime;

            scene.elevator.update(deltaTime);
            scene.render();

            requestAnimationFrame(animate);
        }

        animate(performance.now());

        // ========== 交互事件 ==========
        function handleClick(x, y) {
            if (scene.elevator.state === STATE.IDLE ||
                scene.elevator.state === STATE.DOOR_OPEN ||
                scene.elevator.state === STATE.MOVING) {

                scene.elevator.buttons.forEach(btn => {
                    if (btn.screenPos) {
                        const dx = x - btn.screenPos.x;
                        const dy = y - btn.screenPos.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < btn.screenPos.radius) {
                            scene.elevator.addTarget(btn.floor);
                            console.log('Floor selected:', btn.floor);
                        }
                    }
                });
            }
        }

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            handleClick(e.clientX - rect.left, e.clientY - rect.top);
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            handleClick(touch.clientX - rect.left, touch.clientY - rect.top);
        }, { passive: false });
    </script>
</body>
</html>
