<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画廊式电梯 - Gallery Elevator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            height: 100vh;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        canvas {
            display: block;
            cursor: crosshair;
        }
    </style>
</head>
<body>
    <canvas id="elevator"></canvas>
    <script>
        'use strict';

        // ========== 配置和常量 ==========
        const STATE = {
            IDLE: 'IDLE',
            MOVING: 'MOVING',
            DOOR_OPENING: 'DOOR_OPENING',
            DOOR_OPEN: 'DOOR_OPEN',
            DOOR_CLOSING: 'DOOR_CLOSING'
        };

        const CONFIG = {
            // 全屏3D电梯厢配置
            doorWidthRatio: 0.32, // 门宽度占屏幕比例
            doorHeightRatio: 0.55, // 门高度占屏幕比例
            perspectiveDepth: 0.25, // 透视深度（墙面收束程度）
            eyeLevel: 0.52 // 视线高度（0.5 = 屏幕中央）
        };

        // ========== 画布设置 ==========
        const canvas = document.getElementById('elevator');
        const ctx = canvas.getContext('2d');
        let W, H, VP_X, VP_Y; // 画布尺寸和消失点坐标

        function resizeCanvas() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
            VP_X = W * 0.5; // 屏幕水平中心
            VP_Y = H * CONFIG.eyeLevel; // 视线高度
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // ========== 走路进度变量 Walk Progress Variables ==========
        // walkProgress: 走向电梯门的进度（0~1）Progress walking toward elevator doors (0~1)
        // 0 = 远离电梯门的原始位置 Far from doors, original position
        // 1 = 靠近电梯门 Close to doors
        let walkProgress = 0;           // 当前走路进度 Current walk progress
        let walkVelocity = 0;           // 走路速度 -1=后退, 0=停止, +1=前进 Walk velocity: -1=backward, 0=stop, +1=forward
        const WALK_SPEED = 0.35;        // 每秒移动速度 Units per second

        // 地板滚动 Floor scrolling
        // floorScroll使地面网格向后流动，而不是被缩放 floorScroll makes the ground slide backwards, not scaled
        let floorScroll = 0;            // 地板格子已经移动的距离 How much the floor grid has moved
        const FLOOR_SCROLL_SPEED = 120; // 走路时地板滚动速度（像素/秒）Floor scroll speed when walking (pixels/second)
        const TILE_SIZE = 70;           // 固定瓷砖尺寸 Constant tile size

        // FPS-style head bob 走路时的第一视角晃动
        // 非常轻微的头部移动，模拟自然走路 Very subtle head movement mimicking natural walking
        let headBobPhase = 0;           // 头部晃动相位 Head-bob phase
        let headBobOffsetX = 0;         // 水平偏移 Horizontal offset
        let headBobOffsetY = 0;         // 垂直偏移 Vertical offset
        const HEAD_BOB_MAX_X = 2;       // 最大水平晃动 2px Max horizontal bob
        const HEAD_BOB_MAX_Y = 1;       // 最大垂直晃动 1px Max vertical bob

        // 进入提示 Enter hint
        // 当玩家走到门前时显示"点击进入"提示 Show "click to enter" hint when player reaches door
        let enterHintPhase = 0;         // 提示文字淡入淡出相位 Fade in/out phase for hint text
        let readyToEnter = false;       // 玩家是否可以进入 Whether player can enter

        // ========== 场景状态 Scene State ==========
        // 'elevator' = 电梯内部场景 Elevator interior scene
        // 'corridor1' = 一层电梯外的长廊场景 Corridor on floor 1
        let sceneState = 'elevator';    // 当前场景 Current scene

        // 走廊场景的墙面和天花板滚动 Corridor wall and ceiling scrolling
        // 与地板滚动类似，但速度不同以增加深度感 Similar to floor scroll but different speeds for depth
        let wallScroll = 0;             // 墙面格子已移动距离 How much wall grid has moved
        let ceilingScroll = 0;          // 天花板格子已移动距离 How much ceiling grid has moved
        const WALL_SCROLL_SPEED = 100;  // 墙面滚动速度（略慢于地板）Wall scroll speed (slightly slower than floor)
        const CEILING_SCROLL_SPEED = 80; // 天花板滚动速度（最慢）Ceiling scroll speed (slowest)

        // "Back to Elevator" button in corridor scene (bottom-left corner)
        // 走廊场景中返回电梯的按钮（左下角）
        let backButton = { x: 20, y: 0, w: 140, h: 44 };

        // Elevator door hitbox for precise click detection (updated each frame)
        // 电梯门碰撞框用于精确点击检测（每帧更新）
        let elevatorDoorHitbox = { x: 0, y: 0, w: 0, h: 0 };

        // Monitor bounds for click detection (updated each frame in drawDeskAndComputer)
        // 显示器边界用于点击检测（每帧在drawDeskAndComputer中更新）
        let monitorBounds = { x: 0, y: 0, w: 0, h: 0 };

        // Monitor screen inner rectangle for clipping game content
        // 显示器屏幕内部矩形用于裁剪游戏内容
        let monitorScreen = { x: 0, y: 0, w: 0, h: 0 };

        // View mode in corridor: "corridor" (normal) or "monitor" (fullscreen monitor view)
        // 走廊视角模式："corridor"（正常）或"monitor"（全屏显示器视角）
        let viewMode = "corridor";

        // Monitor state: "menu" (game selection) or "game" (playing a game)
        // 显示器状态："menu"（游戏选择）或"game"（正在玩游戏）
        let monitorState = "menu";
        let activeGame = null;  // Current game: "space", "fruit", "memory", "maze", "lightning"

        // Monitor back button (bottom-left, HUD overlay)
        // 显示器返回按钮（左下角，HUD覆盖层）
        let monitorBackButton = { x: 24, y: 0, w: 120, h: 40 };

        // Floor texture image for plush gaming rug
        // 地板纹理图片（毛绒游戏地毯）
        const FLOOR_IMAGE_URL = "https://github.com/Hanyel-314/final-test/blob/claude/elevator-experience-01MKmEoFCuuVLDTWucLkXy6p/0edaf664a064dc42e771e8cccdb61da3.png?raw=true";
        const floorTexture = new Image();
        let floorTextureLoaded = false;

        floorTexture.src = FLOOR_IMAGE_URL;
        floorTexture.onload = () => {
            floorTextureLoaded = true;
            console.log('Floor texture loaded successfully');
        };
        floorTexture.onerror = () => {
            console.error('Failed to load floor texture from:', FLOOR_IMAGE_URL);
        };

        // Wall poster images for gaming room frames
        // 游戏室墙面海报图片
        const csgoImage = new Image();
        let csgoImageLoaded = false;
        csgoImage.src = 'csgo.jpg';
        csgoImage.onload = () => {
            csgoImageLoaded = true;
            console.log('CS:GO poster loaded successfully');
        };
        csgoImage.onerror = () => {
            console.error('Failed to load CS:GO poster');
        };

        const valorantImage = new Image();
        let valorantImageLoaded = false;
        valorantImage.src = 'Valorant.jpg';
        valorantImage.onload = () => {
            valorantImageLoaded = true;
            console.log('Valorant poster loaded successfully');
        };
        valorantImage.onerror = () => {
            console.error('Failed to load Valorant poster');
        };

        // Gaming room image for elevator lobby
        // 电梯大厅游戏室图片
        const gamingRoomImage = new Image();
        let gamingRoomImageLoaded = false;
        gamingRoomImage.src = 'gaming room.jpg';
        gamingRoomImage.onload = () => {
            gamingRoomImageLoaded = true;
            console.log('Gaming room image loaded successfully');
        };
        gamingRoomImage.onerror = () => {
            console.error('Failed to load gaming room image');
        };

        // Song page image for audio room screen
        // 音频室屏幕的歌曲页图片
        const songPageImage = new Image();
        let songPageImageLoaded = false;
        songPageImage.src = '歌曲页.png';
        songPageImage.onload = () => {
            songPageImageLoaded = true;
            console.log('Song page image loaded successfully');
        };
        songPageImage.onerror = () => {
            console.error('Failed to load song page image');
        };

        // ========== 游戏中心全局状态 Game Hub Global State ==========
        // Mini Game Hub state (appears in monitor view)
        // 迷你游戏中心状态（在显示器视角中显示）
        let gameHubState = 'lobby'; // 'lobby', 'unlock_X', 'game_X'
        let gameUnlockStates = [false, false, false, false, false]; // 5 games unlocked status
        let currentUnlockIndex = -1;
        let currentGameIndex = -1;

        // Game hub utility data
        let gameUnlockData = {};
        let gameData = {};

        // Mouse state for game hub
        let gameHubMouseX = 0;
        let gameHubMouseY = 0;
        let gameHubMouseDown = false;
        let gameHubMouseJustPressed = false;

        // Keyboard state for game hub
        let gameHubKeysPressed = {};

        // Game hub background stars
        const gameHubStars = [];
        for (let i = 0; i < 80; i++) {
            gameHubStars.push({
                x: Math.random() * W,
                y: Math.random() * H,
                r: Math.random() * 1.5 + 0.5,
                alpha: Math.random() * 0.5 + 0.3,
                twinkle: Math.random() * Math.PI * 2
            });
        }

        // Game icons configuration
        const gameIcons = [
            { name: '⚡ Lightning', emoji: '⚡', color: '#ffeb3b', unlockType: 'charge' },
            { name: '🍉 Fruit', emoji: '🍉', color: '#4caf50', unlockType: 'drag' },
            { name: '🚪 Maze', emoji: '🏃', color: '#2196f3', unlockType: 'slide' },
            { name: '📖 Memory', emoji: '🧠', color: '#9c27b0', unlockType: 'password' },
            { name: '🚀 Space', emoji: '🚀', color: '#ff5722', unlockType: 'rotate' }
        ];

        // Position game icons in a circle
        const centerX_hub = W / 2;
        const centerY_hub = H / 2;
        const radius_hub = 200;

        gameIcons.forEach((icon, i) => {
            const angle = (i / 5) * Math.PI * 2 - Math.PI / 2;
            icon.x = centerX_hub + Math.cos(angle) * radius_hub;
            icon.y = centerY_hub + Math.sin(angle) * radius_hub;
            icon.size = 104; // Increased from 80 (1.3×)
            icon.hoverScale = 1.0;
            icon.glowAlpha = 0.3;
        });

        // ========== 游戏中心工具函数 Game Hub Utility Functions ==========
        function dist_hub(x1, y1, x2, y2) {
            return Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
        }

        function pointInCircle_hub(px, py, cx, cy, r) {
            return dist_hub(px, py, cx, cy) <= r;
        }

        function pointInRect_hub(px, py, rx, ry, rw, rh) {
            return px >= rx && px <= rx + rw && py >= ry && py <= ry + rh;
        }

        function roundRect_hub(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.arcTo(x + w, y, x + w, y + r, r);
            ctx.lineTo(x + w, y + h - r);
            ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
            ctx.lineTo(x + r, y + h);
            ctx.arcTo(x, y + h, x, y + h - r, r);
            ctx.lineTo(x, y + r);
            ctx.arcTo(x, y, x + r, y, r);
            ctx.closePath();
        }

        function easeOutQuad_hub(t) {
            return t * (2 - t);
        }

        function lerp_hub(a, b, t) {
            return a + (b - a) * t;
        }

        // ========== 走廊几何常量 Corridor Geometry Constants ==========
        // 统一的走廊坐标框架，让左右墙和后墙的高度对齐
        // Unified corridor coordinate frame - side walls and back wall heights align
        const CORRIDOR_FRONT_CEILING_Y = H * 0.06;  // 前端天花板Y (靠近相机) - 提高，减少黑边 Front ceiling Y (raised, less black band)
        const CORRIDOR_BACK_CEILING_Y  = H * 0.09;  // 后墙顶部Y - 提高 Top of back wall (raised)
        const CORRIDOR_BACK_FLOOR_Y_FAR  = H * 0.62; // 后墙地板线（远离时）Back wall floor line (when far)
        const CORRIDOR_BACK_FLOOR_Y_NEAR = H * 0.68; // 后墙地板线（靠近时）Back wall floor line (when near)
        const CORRIDOR_FRONT_FLOOR_Y = H;            // 前端地板Y（屏幕底部）Front floor Y (screen bottom)
        const CORRIDOR_FRONT_LEFT_X  = 0;            // 前端左边缘 Front left edge
        const CORRIDOR_FRONT_RIGHT_X = W;            // 前端右边缘 Front right edge
        const CORRIDOR_BACK_LEFT_X_FAR  = W * 0.30;  // 后墙左边（远离时）Back wall left (when far)
        const CORRIDOR_BACK_RIGHT_X_FAR = W * 0.70;  // 后墙右边（远离时）Back wall right (when far)
        const CORRIDOR_BACK_LEFT_X_NEAR  = W * 0.26; // 后墙左边（靠近时）Back wall left (when near)
        const CORRIDOR_BACK_RIGHT_X_NEAR = W * 0.74; // 后墙右边（靠近时）Back wall right (when near)

        // 走廊尽头的电脑缩放范围 Computer scale range at corridor end - TWO PHASE
        // Extra close-up when walkProgress is in [0.8, 1.0]:
        // desk + monitor scale up and slide slightly down so the screen fills ~2/3 of the view.
        // 在走近的最后一段，电脑和桌子进一步放大并略微下移，让屏幕几乎占满画面
        const COMPUTER_SCALE_FAR   = 1.0;   // 远离时的大小 Size when far (t = 0)
        const COMPUTER_SCALE_MID   = 1.6;   // 正常靠近时 Normal approach (t = 0.8)
        const COMPUTER_SCALE_CLOSE = 2.4;   // 紧密特写时 Tight close-up (t = 1.0)

        // 线性插值函数 Linear interpolation function
        function lerp(a, b, t) {
            return a + (b - a) * t;
        }

        // 限制到 [0, 1] 范围 Clamp to [0, 1] range
        function clamp01(x) {
            return Math.max(0, Math.min(1, x));
        }

        // ========== 全屏3D电梯厢几何定义 ==========
        // 定义填满整个屏幕的3D封闭电梯厢
        // 使用 walkProgress 插值改变视角 - Use walkProgress to interpolate perspective
        function getCabinGeometry() {
            // 门的位置和尺寸（前墙中央）- 根据走路进度调整
            // Door position and size - adjusted by walk progress

            // 远近视角的门宽度比例 Far/near door width ratios
            const farDoorWidthRatio = CONFIG.doorWidthRatio;       // 0.32 (原始)
            const nearDoorWidthRatio = CONFIG.doorWidthRatio * 1.4; // 走近时门变大 Doors appear larger when close

            const doorWidthRatio = lerp(farDoorWidthRatio, nearDoorWidthRatio, walkProgress);
            const doorWidth = W * doorWidthRatio;
            const doorHeight = H * CONFIG.doorHeightRatio * lerp(1.0, 1.35, walkProgress); // 高度也增加

            // 门的垂直位置 - 走近时稍微下移 Door vertical position - moves down slightly when close
            const farDoorCenterY = VP_Y;
            const nearDoorCenterY = VP_Y + 40;
            const doorCenterY = lerp(farDoorCenterY, nearDoorCenterY, walkProgress);

            const doorLeft = VP_X - doorWidth / 2;
            const doorRight = VP_X + doorWidth / 2;
            const doorTop = doorCenterY - doorHeight / 2;
            const doorBottom = doorCenterY + doorHeight / 2;

            // Update elevator door hitbox for click detection
            // 更新电梯门碰撞框用于点击检测
            elevatorDoorHitbox.x = doorLeft;
            elevatorDoorHitbox.y = doorTop;
            elevatorDoorHitbox.w = doorWidth;
            elevatorDoorHitbox.h = doorHeight;

            // 门框厚度
            const frameThick = 25;

            // 地板线 - 门框底部所在的位置，这是地板和门框的连接点
            const floorLineY = doorBottom + frameThick;

            // 透视收束：前墙（门所在）比观察者位置窄
            // 走近时墙壁角度更宽，门更占据画面 When walking closer, walls angle wider
            const frontWallShrink = 1 - CONFIG.perspectiveDepth;

            // 墙壁后侧边缘的水平偏移 - 走近时墙壁向外推
            // Wall back edge horizontal offset - walls push outward when walking close
            const wallBackOffsetX = lerp(0, -60, walkProgress);

            // 左墙：从左边缘到门左侧
            const leftWall = {
                back: { x: 0 + wallBackOffsetX, y: 0 }, // 左上后（走近时向左推）
                backBottom: { x: 0 + wallBackOffsetX, y: H }, // 左下后
                frontTop: { x: doorLeft, y: doorTop }, // 左上前（门左上）
                frontBottom: { x: doorLeft, y: floorLineY } // 左下前（地板线）
            };

            // 右墙：从门右侧到右边缘
            const rightWall = {
                frontTop: { x: doorRight, y: doorTop }, // 右上前（门右上）
                frontBottom: { x: doorRight, y: floorLineY }, // 右下前（地板线）
                back: { x: W - wallBackOffsetX, y: 0 }, // 右上后（走近时向右推）
                backBottom: { x: W - wallBackOffsetX, y: H } // 右下后
            };

            // 地板：从底部边缘到地板线
            const floor = {
                backLeft: { x: 0 + wallBackOffsetX, y: H }, // 左后（与墙壁对齐）
                backRight: { x: W - wallBackOffsetX, y: H }, // 右后（与墙壁对齐）
                frontLeft: { x: doorLeft, y: floorLineY }, // 左前（地板线）
                frontRight: { x: doorRight, y: floorLineY } // 右前（地板线）
            };

            // 天花板：从顶部边缘到门顶部
            const ceiling = {
                backLeft: { x: 0 + wallBackOffsetX, y: 0 }, // 左后（与墙壁对齐）
                backRight: { x: W - wallBackOffsetX, y: 0 }, // 右后（与墙壁对齐）
                frontLeft: { x: doorLeft, y: doorTop }, // 左前（门左上）
                frontRight: { x: doorRight, y: doorTop } // 右前（门右上）
            };

            // 前墙（门的背景墙）
            const frontWall = {
                left: doorLeft,
                right: doorRight,
                top: doorTop,
                bottom: doorBottom
            };

            return {
                doorWidth,
                doorHeight,
                doorLeft,
                doorRight,
                doorTop,
                doorBottom,
                frameThick,
                floorLineY,
                leftWall,
                rightWall,
                floor,
                ceiling,
                frontWall
            };
        }

        // ========== 电梯状态机 ==========
        class Elevator {
            constructor() {
                this.currentFloor = 1;
                this.displayFloor = 1;
                this.targetQueue = [];
                this.state = STATE.IDLE;
                this.doorProgress = 0; // 0=关闭, 1=打开
                this.stateTimer = 0;
                this.moveTimer = 0;
                this.floorChangeTimer = 0;
                this.vibration = 0;

                // 门打开时间控制 Door open time control
                // 增加基础开门时间，给玩家更多时间走向电梯门
                // Increased base open time to give player more time to walk toward doors
                this.baseOpenTime = 7000; // 基础开门时间 (ms) - Base door open time (7 seconds)
                this.extraOpenTime = 0;   // 额外开门时间 (可通过按钮调整) - Extra time (adjustable via buttons)

                // 按钮配置
                this.buttons = [
                    { floor: 3, active: false },
                    { floor: 2, active: false },
                    { floor: 1, active: false }
                ];

                // 开门/关门按钮
                this.openButton = { pressed: false, screenPos: null };
                this.closeButton = { pressed: false, screenPos: null };

                // 长按检测
                this.pointerDownTime = 0;
                this.isHoldingOpenButton = false;
                this.isHoldingCloseButton = false;
                this.activePointer = null; // 'open', 'close', or null
            }

            update(dt) {
                this.stateTimer += dt;

                switch(this.state) {
                    case STATE.IDLE:
                        this.doorProgress = 0;
                        this.vibration = 0;
                        if (this.targetQueue.length > 0) {
                            this.state = STATE.MOVING;
                            this.moveTimer = 0;
                            this.floorChangeTimer = 0;
                        }
                        break;

                    case STATE.MOVING:
                        this.moveTimer += dt;
                        // 轻微振动
                        this.vibration = Math.sin(this.moveTimer * 0.01) * 2;

                        if (this.moveTimer > 800) {
                            const target = this.targetQueue[0];

                            if (this.displayFloor < target) {
                                this.displayFloor++;
                                this.floorChangeTimer = 0;
                            } else if (this.displayFloor > target) {
                                this.displayFloor--;
                                this.floorChangeTimer = 0;
                            }

                            this.moveTimer = 0;

                            if (this.displayFloor === target) {
                                this.currentFloor = target;
                                this.targetQueue.shift();
                                this.state = STATE.DOOR_OPENING;
                                this.stateTimer = 0;
                                this.vibration = 0;

                                this.buttons.forEach(btn => {
                                    if (btn.floor === target) btn.active = false;
                                });
                            }
                        }
                        break;

                    case STATE.DOOR_OPENING:
                        this.doorProgress = Math.min(1, this.doorProgress + dt / 1000);
                        if (this.doorProgress >= 1) {
                            this.state = STATE.DOOR_OPEN;
                            this.stateTimer = 0;
                        }
                        break;

                    case STATE.DOOR_OPEN:
                        this.doorProgress = 1;
                        const doorHoldTime = this.baseOpenTime + this.extraOpenTime;
                        if (this.stateTimer > doorHoldTime) {
                            this.state = STATE.DOOR_CLOSING;
                            this.stateTimer = 0;
                            // 逐渐恢复额外时间
                            this.extraOpenTime = Math.max(-1500, Math.min(6000, this.extraOpenTime * 0.7));
                        }
                        break;

                    case STATE.DOOR_CLOSING:
                        this.doorProgress = Math.max(0, this.doorProgress - dt / 1000);
                        if (this.doorProgress <= 0) {
                            this.state = STATE.IDLE;
                            this.stateTimer = 0;
                        }
                        break;
                }

                this.floorChangeTimer += dt;
            }

            addTarget(floor) {
                if (floor !== this.currentFloor && !this.targetQueue.includes(floor)) {
                    this.targetQueue.push(floor);
                    this.buttons.forEach(btn => {
                        if (btn.floor === floor) btn.active = true;
                    });
                }
            }

            getStatusText() {
                switch(this.state) {
                    case STATE.IDLE: return 'Select a floor';
                    case STATE.MOVING: return 'Moving...';
                    case STATE.DOOR_OPENING: return `Arriving floor ${this.currentFloor}`;
                    case STATE.DOOR_OPEN: return `Floor ${this.currentFloor}`;
                    case STATE.DOOR_CLOSING: return 'Closing...';
                    default: return '';
                }
            }
        }

        // ========== 场景渲染 ==========
        class Scene {
            constructor() {
                this.elevator = new Elevator();
            }

            // 绘制地板（全屏透视地板）
            drawFloor() {
                const geo = getCabinGeometry();
                ctx.save();
                ctx.translate(0, this.elevator.vibration);

                // 地板梯形平面 - 从屏幕底部到门底部
                const f = geo.floor;

                // 主地板渐变 - 近处深，远处（门附近）稍亮
                const floorGrad = ctx.createLinearGradient(0, f.frontLeft.y, 0, f.backLeft.y);
                floorGrad.addColorStop(0, '#4a4a4a');
                floorGrad.addColorStop(0.6, '#3a3a3a');
                floorGrad.addColorStop(1, '#2a2a2a');

                ctx.fillStyle = floorGrad;
                ctx.beginPath();
                ctx.moveTo(f.backLeft.x, f.backLeft.y);
                ctx.lineTo(f.backRight.x, f.backRight.y);
                ctx.lineTo(f.frontRight.x, f.frontRight.y);
                ctx.lineTo(f.frontLeft.x, f.frontLeft.y);
                ctx.closePath();
                ctx.fill();

                // 地板瓷砖接缝 - 使用floorScroll使网格向后流动
                // Floor tile grid - use floorScroll to make grid flow backwards
                // 地板格子随走路向后流动，而不是被放大压缩 Floor tiles slide backwards when walking, not scaled

                const tileSize = TILE_SIZE;  // 固定瓷砖尺寸 Constant tile size
                const offset = floorScroll % tileSize;  // 循环偏移 Wrapped offset for seamless repeat

                ctx.strokeStyle = 'rgba(0, 0, 0, 0.2)';
                ctx.lineWidth = 1;

                // 横向线（沿Y方向）- 使用offset使其滚动 Horizontal lines (along Y) - use offset to scroll
                const yStart = f.frontLeft.y;
                const yEnd = f.backLeft.y;
                const numHLines = Math.ceil((yEnd - yStart) / tileSize) + 2;

                for (let i = 0; i < numHLines; i++) {
                    const y = yStart + (i * tileSize) + offset;
                    if (y < yStart || y > yEnd) continue;

                    const t = (y - yStart) / (yEnd - yStart);
                    const leftX = f.frontLeft.x + (f.backLeft.x - f.frontLeft.x) * t;
                    const rightX = f.frontRight.x + (f.backRight.x - f.frontRight.x) * t;

                    ctx.beginPath();
                    ctx.moveTo(leftX, y);
                    ctx.lineTo(rightX, y);
                    ctx.stroke();
                }

                // 纵向线（汇聚到中心）- 固定间距不滚动 Vertical lines (converging to center) - fixed spacing, no scroll
                const numVerticalLines = 6;
                for (let i = 1; i < numVerticalLines; i++) {
                    const ratio = i / numVerticalLines;
                    const backX = f.backLeft.x + (f.backRight.x - f.backLeft.x) * ratio;
                    const frontX = f.frontLeft.x + (f.frontRight.x - f.frontLeft.x) * ratio;
                    ctx.beginPath();
                    ctx.moveTo(backX, f.backLeft.y);
                    ctx.lineTo(frontX, f.frontLeft.y);
                    ctx.stroke();
                }

                // 地板反光（门框底部下方）
                const shineGrad = ctx.createRadialGradient(
                    VP_X, geo.floorLineY, 0,
                    VP_X, geo.floorLineY, geo.doorWidth * 0.5
                );
                shineGrad.addColorStop(0, 'rgba(255, 255, 255, 0.1)');
                shineGrad.addColorStop(0.6, 'rgba(255, 255, 255, 0.03)');
                shineGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.fillStyle = shineGrad;
                ctx.beginPath();
                ctx.arc(VP_X, geo.floorLineY, geo.doorWidth * 0.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            // 绘制天花板（全屏透视天花板）
            drawCeiling() {
                const geo = getCabinGeometry();
                ctx.save();
                ctx.translate(0, this.elevator.vibration);

                // 天花板梯形平面 - 从屏幕顶部到门顶部
                const c = geo.ceiling;

                // 天花板渐变 - 后方深，前方（门附近）稍亮
                const ceilGrad = ctx.createLinearGradient(0, c.backLeft.y, 0, c.frontLeft.y);
                ceilGrad.addColorStop(0, '#2a2a2a');
                ceilGrad.addColorStop(0.6, '#3a3a3a');
                ceilGrad.addColorStop(1, '#3a3a3a');

                ctx.fillStyle = ceilGrad;
                ctx.beginPath();
                ctx.moveTo(c.backLeft.x, c.backLeft.y);
                ctx.lineTo(c.backRight.x, c.backRight.y);
                ctx.lineTo(c.frontRight.x, c.frontRight.y);
                ctx.lineTo(c.frontLeft.x, c.frontLeft.y);
                ctx.closePath();
                ctx.fill();

                // 两个小射灯（subtle downlights）
                const light1X = VP_X - geo.doorWidth * 0.25;
                const light2X = VP_X + geo.doorWidth * 0.25;
                const lightY = geo.doorTop - 25;

                [light1X, light2X].forEach(lx => {
                    // 灯外壳
                    ctx.fillStyle = '#1a1a1a';
                    ctx.beginPath();
                    ctx.arc(lx, lightY, 8, 0, Math.PI * 2);
                    ctx.fill();

                    // 灯心
                    ctx.fillStyle = '#f0e0c0';
                    ctx.beginPath();
                    ctx.arc(lx, lightY, 4, 0, Math.PI * 2);
                    ctx.fill();

                    // 柔和光晕
                    const haloGrad = ctx.createRadialGradient(lx, lightY, 0, lx, lightY, 35);
                    haloGrad.addColorStop(0, 'rgba(255, 248, 220, 0.12)');
                    haloGrad.addColorStop(0.6, 'rgba(255, 248, 220, 0.04)');
                    haloGrad.addColorStop(1, 'rgba(255, 248, 220, 0)');
                    ctx.fillStyle = haloGrad;
                    ctx.beginPath();
                    ctx.arc(lx, lightY, 35, 0, Math.PI * 2);
                    ctx.fill();
                });

                ctx.restore();
            }

            // 绘制左右墙壁（全屏包裹墙面）
            drawWalls() {
                const geo = getCabinGeometry();
                ctx.save();
                ctx.translate(0, this.elevator.vibration);

                // === 左墙 - 从左屏幕边缘到门左侧 ===
                const lw = geo.leftWall;

                // 左墙渐变 - 左边缘深，中央亮
                const leftWallGrad = ctx.createLinearGradient(lw.back.x, VP_Y, lw.frontTop.x, VP_Y);
                leftWallGrad.addColorStop(0, '#1a1a1a');
                leftWallGrad.addColorStop(0.3, '#2d2520'); // 暗木棕
                leftWallGrad.addColorStop(0.7, '#3a3028');
                leftWallGrad.addColorStop(1, '#2a2a2a');

                ctx.fillStyle = leftWallGrad;
                ctx.beginPath();
                ctx.moveTo(lw.back.x, lw.back.y);
                ctx.lineTo(lw.backBottom.x, lw.backBottom.y);
                ctx.lineTo(lw.frontBottom.x, lw.frontBottom.y);
                ctx.lineTo(lw.frontTop.x, lw.frontTop.y);
                ctx.closePath();
                ctx.fill();

                // 左墙高光（中央反光）
                const leftHighlight = ctx.createLinearGradient(lw.back.x, VP_Y, lw.frontTop.x, VP_Y);
                leftHighlight.addColorStop(0, 'rgba(255, 255, 255, 0)');
                leftHighlight.addColorStop(0.45, 'rgba(255, 255, 255, 0.08)');
                leftHighlight.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.fillStyle = leftHighlight;
                ctx.beginPath();
                ctx.moveTo(lw.back.x, lw.back.y);
                ctx.lineTo(lw.backBottom.x, lw.backBottom.y);
                ctx.lineTo(lw.frontBottom.x, lw.frontBottom.y);
                ctx.lineTo(lw.frontTop.x, lw.frontTop.y);
                ctx.closePath();
                ctx.fill();

                // 左墙前沿装饰条
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(lw.frontTop.x, lw.frontTop.y);
                ctx.lineTo(lw.frontBottom.x, lw.frontBottom.y);
                ctx.stroke();

                // === 右墙 - 从门右侧到右屏幕边缘 ===
                const rw = geo.rightWall;

                // 右墙渐变 - 右边缘深，中央亮
                const rightWallGrad = ctx.createLinearGradient(rw.frontTop.x, VP_Y, rw.back.x, VP_Y);
                rightWallGrad.addColorStop(0, '#2a2a2a');
                rightWallGrad.addColorStop(0.3, '#3a3028');
                rightWallGrad.addColorStop(0.7, '#2d2520');
                rightWallGrad.addColorStop(1, '#1a1a1a');

                ctx.fillStyle = rightWallGrad;
                ctx.beginPath();
                ctx.moveTo(rw.frontTop.x, rw.frontTop.y);
                ctx.lineTo(rw.frontBottom.x, rw.frontBottom.y);
                ctx.lineTo(rw.backBottom.x, rw.backBottom.y);
                ctx.lineTo(rw.back.x, rw.back.y);
                ctx.closePath();
                ctx.fill();

                // 右墙高光
                const rightHighlight = ctx.createLinearGradient(rw.frontTop.x, VP_Y, rw.back.x, VP_Y);
                rightHighlight.addColorStop(0, 'rgba(255, 255, 255, 0)');
                rightHighlight.addColorStop(0.55, 'rgba(255, 255, 255, 0.08)');
                rightHighlight.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.fillStyle = rightHighlight;
                ctx.beginPath();
                ctx.moveTo(rw.frontTop.x, rw.frontTop.y);
                ctx.lineTo(rw.frontBottom.x, rw.frontBottom.y);
                ctx.lineTo(rw.backBottom.x, rw.backBottom.y);
                ctx.lineTo(rw.back.x, rw.back.y);
                ctx.closePath();
                ctx.fill();

                // 右墙前沿装饰条
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(rw.frontTop.x, rw.frontTop.y);
                ctx.lineTo(rw.frontBottom.x, rw.frontBottom.y);
                ctx.stroke();

                // 右墙装饰面板
                this.drawRightWallDecoration(geo);

                ctx.restore();
            }

            // 右墙装饰元素
            drawRightWallDecoration(geo) {
                const panelX = W * 0.75;
                const panelY = VP_Y * 0.7;
                const panelW = W * 0.08;
                const panelH = H * 0.15;

                // 装饰面板阴影
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.fillRect(panelX + 3, panelY + 3, panelW, panelH);

                // 金属装饰板
                const decorGrad = ctx.createLinearGradient(panelX, panelY, panelX + panelW, panelY);
                decorGrad.addColorStop(0, '#2a2a2a');
                decorGrad.addColorStop(0.5, '#4a4a4a');
                decorGrad.addColorStop(1, '#2a2a2a');

                ctx.fillStyle = decorGrad;
                ctx.fillRect(panelX, panelY, panelW, panelH);

                // 边框
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 2;
                ctx.strokeRect(panelX, panelY, panelW, panelH);

                // 装饰线条
                ctx.strokeStyle = '#666';
                ctx.lineWidth = 1;
                for (let i = 1; i <= 3; i++) {
                    const y = panelY + (panelH / 4) * i;
                    ctx.beginPath();
                    ctx.moveTo(panelX + panelW * 0.1, y);
                    ctx.lineTo(panelX + panelW * 0.9, y);
                    ctx.stroke();
                }
            }

            // 绘制前墙背景和外部场景
            drawFrontWall() {
                const geo = getCabinGeometry();
                ctx.save();
                ctx.translate(0, this.elevator.vibration);

                // 前墙背景 - 暗金属
                const wallGrad = ctx.createLinearGradient(0, geo.doorTop, 0, geo.doorBottom);
                wallGrad.addColorStop(0, '#2a2a2a');
                wallGrad.addColorStop(0.5, '#3a3a3a');
                wallGrad.addColorStop(1, '#2a2a2a');

                ctx.fillStyle = wallGrad;
                ctx.fillRect(geo.doorLeft, geo.doorTop, geo.doorWidth, geo.doorHeight);

                // 如果门打开，先绘制外部场景（在门后面）
                if (this.elevator.doorProgress > 0) {
                    // 定义门框内部矩形（所有门内容必须在此范围内）
                    const frameInnerX = geo.doorLeft;
                    const frameInnerY = geo.doorTop;
                    const frameInnerWidth = geo.doorWidth;
                    const frameInnerHeight = geo.doorHeight;

                    // 应用裁剪区域 - 外部场景只能在框内显示
                    ctx.save();
                    ctx.beginPath();
                    ctx.rect(frameInnerX, frameInnerY, frameInnerWidth, frameInnerHeight);
                    ctx.clip();

                    // 外部走廊光线 - 填充整个门洞
                    const hallwayGrad = ctx.createLinearGradient(VP_X, geo.doorTop, VP_X, geo.doorBottom);
                    hallwayGrad.addColorStop(0, '#d5d5d5');
                    hallwayGrad.addColorStop(0.5, '#f5f5f5');
                    hallwayGrad.addColorStop(1, '#d5d5d5');
                    ctx.fillStyle = hallwayGrad;
                    ctx.fillRect(geo.doorLeft, geo.doorTop, geo.doorWidth, geo.doorHeight);

                    // 楼层标识（也会被裁剪）
                    this.drawExteriorScene(this.elevator.currentFloor, geo.doorTop, geo.doorHeight);

                    ctx.restore(); // 恢复裁剪区域
                }

                ctx.restore();
            }

            // 绘制门板（滑入墙内）
            drawDoors() {
                const geo = getCabinGeometry();
                ctx.save();
                ctx.translate(0, this.elevator.vibration);

                // 定义门框内部矩形（所有门内容必须在此范围内）
                const frameInnerX = geo.doorLeft;
                const frameInnerY = geo.doorTop;
                const frameInnerWidth = geo.doorWidth;
                const frameInnerHeight = geo.doorHeight;

                // 应用裁剪区域 - 门板只能在框内显示
                ctx.save();
                ctx.beginPath();
                ctx.rect(frameInnerX, frameInnerY, frameInnerWidth, frameInnerHeight);
                ctx.clip();

                const singleDoorWidth = geo.doorWidth * 0.5; // 单扇门宽度（各占一半）
                const maxSlide = singleDoorWidth * 1.0; // 最大滑动距离（限制在框内）

                // 使用缓动函数使门运动更平滑
                const easeInOutCubic = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
                const easedProgress = easeInOutCubic(this.elevator.doorProgress);
                const slideOffset = maxSlide * easedProgress;

                // 门板垂直渐变 - 高级拉丝金属效果
                const doorGrad = ctx.createLinearGradient(0, geo.doorTop, 0, geo.doorBottom);
                doorGrad.addColorStop(0, '#5a5a5a');
                doorGrad.addColorStop(0.2, '#6a6a6a');
                doorGrad.addColorStop(0.5, '#5f5f5f');
                doorGrad.addColorStop(0.8, '#6a6a6a');
                doorGrad.addColorStop(1, '#5a5a5a');

                // === 左门板 - 向左滑动到墙内 ===
                const leftDoorX = frameInnerX - slideOffset;

                ctx.fillStyle = doorGrad;
                ctx.fillRect(leftDoorX, frameInnerY, singleDoorWidth, frameInnerHeight);

                // 左门垂直设计线（两条细线）
                ctx.strokeStyle = 'rgba(150, 150, 150, 0.2)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(leftDoorX + singleDoorWidth * 0.3, frameInnerY + 30);
                ctx.lineTo(leftDoorX + singleDoorWidth * 0.3, frameInnerY + frameInnerHeight - 30);
                ctx.stroke();

                ctx.strokeStyle = 'rgba(100, 100, 100, 0.15)';
                ctx.beginPath();
                ctx.moveTo(leftDoorX + singleDoorWidth * 0.7, frameInnerY + 30);
                ctx.lineTo(leftDoorX + singleDoorWidth * 0.7, frameInnerY + frameInnerHeight - 30);
                ctx.stroke();

                // === 右门板 - 向右滑动到墙内 ===
                const rightDoorX = frameInnerX + singleDoorWidth + slideOffset;

                ctx.fillStyle = doorGrad;
                ctx.fillRect(rightDoorX, frameInnerY, singleDoorWidth, frameInnerHeight);

                // 右门垂直设计线（两条细线）
                ctx.strokeStyle = 'rgba(150, 150, 150, 0.2)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(rightDoorX + singleDoorWidth * 0.3, frameInnerY + 30);
                ctx.lineTo(rightDoorX + singleDoorWidth * 0.3, frameInnerY + frameInnerHeight - 30);
                ctx.stroke();

                ctx.strokeStyle = 'rgba(100, 100, 100, 0.15)';
                ctx.beginPath();
                ctx.moveTo(rightDoorX + singleDoorWidth * 0.7, frameInnerY + 30);
                ctx.lineTo(rightDoorX + singleDoorWidth * 0.7, frameInnerY + frameInnerHeight - 30);
                ctx.stroke();

                ctx.restore(); // 恢复裁剪区域
                ctx.restore();
            }

            // 绘制门框（覆盖在门上方，形成墙内效果）
            drawDoorFrame() {
                const geo = getCabinGeometry();
                ctx.save();
                ctx.translate(0, this.elevator.vibration);

                const frameThick = geo.frameThick;

                // 门框金属渐变
                const frameGrad = ctx.createLinearGradient(0, geo.doorTop, 0, geo.floorLineY);
                frameGrad.addColorStop(0, '#666');
                frameGrad.addColorStop(0.5, '#777');
                frameGrad.addColorStop(1, '#666');

                // 计算门框侧柱的高度 - 从门顶到地板线
                const sideColumnHeight = geo.floorLineY - geo.doorTop;

                // === 左侧框柱（遮盖左门滑入部分）===
                ctx.fillStyle = frameGrad;
                ctx.fillRect(geo.doorLeft - frameThick, geo.doorTop, frameThick, sideColumnHeight);

                // 左框柱内侧阴影
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.fillRect(geo.doorLeft - 3, geo.doorTop, 3, sideColumnHeight);

                // === 右侧框柱（遮盖右门滑入部分）===
                ctx.fillStyle = frameGrad;
                ctx.fillRect(geo.doorRight, geo.doorTop, frameThick, sideColumnHeight);

                // 右框柱内侧阴影
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.fillRect(geo.doorRight, geo.doorTop, 3, sideColumnHeight);

                // === 顶框 ===
                ctx.fillStyle = frameGrad;
                ctx.fillRect(geo.doorLeft - frameThick, geo.doorTop - frameThick,
                            geo.doorWidth + frameThick * 2, frameThick);
                ctx.strokeStyle = '#444';
                ctx.lineWidth = 2;
                ctx.strokeRect(geo.doorLeft - frameThick, geo.doorTop - frameThick,
                              geo.doorWidth + frameThick * 2, frameThick);

                // === 底框 ===
                ctx.fillStyle = frameGrad;
                ctx.fillRect(geo.doorLeft - frameThick, geo.doorBottom,
                            geo.doorWidth + frameThick * 2, frameThick);
                ctx.strokeStyle = '#444';
                ctx.lineWidth = 2;
                ctx.strokeRect(geo.doorLeft - frameThick, geo.doorBottom,
                              geo.doorWidth + frameThick * 2, frameThick);

                // 门框深度阴影 - 左侧
                const shadowGrad1 = ctx.createLinearGradient(geo.doorLeft - frameThick, 0, geo.doorLeft, 0);
                shadowGrad1.addColorStop(0, 'rgba(0, 0, 0, 0)');
                shadowGrad1.addColorStop(1, 'rgba(0, 0, 0, 0.3)');
                ctx.fillStyle = shadowGrad1;
                ctx.fillRect(geo.doorLeft - frameThick, geo.doorTop, frameThick, sideColumnHeight);

                // 门框深度阴影 - 右侧
                const shadowGrad2 = ctx.createLinearGradient(geo.doorRight + frameThick, 0, geo.doorRight, 0);
                shadowGrad2.addColorStop(0, 'rgba(0, 0, 0, 0)');
                shadowGrad2.addColorStop(1, 'rgba(0, 0, 0, 0.3)');
                ctx.fillStyle = shadowGrad2;
                ctx.fillRect(geo.doorRight, geo.doorTop, frameThick, sideColumnHeight);

                // 门槛线 - 门框底部与地板交接处的深色线条
                ctx.fillStyle = 'rgba(30, 30, 30, 0.8)';
                ctx.fillRect(geo.doorLeft - frameThick, geo.floorLineY - 2,
                            geo.doorWidth + frameThick * 2, 3);

                // 门框底部阴影 - 投射到地板上
                const floorShadowGrad = ctx.createLinearGradient(0, geo.floorLineY, 0, geo.floorLineY + 15);
                floorShadowGrad.addColorStop(0, 'rgba(0, 0, 0, 0.4)');
                floorShadowGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = floorShadowGrad;
                ctx.fillRect(geo.doorLeft - frameThick - 5, geo.floorLineY,
                            geo.doorWidth + frameThick * 2 + 10, 15);

                ctx.restore();
            }

            // 绘制外部场景装饰
            drawExteriorScene(floor, doorY, doorHeight) {
                switch(floor) {
                    case 1:
                        // Display gaming room image - fill entire visible area with cover behavior
                        if (gamingRoomImageLoaded) {
                            const geo = getCabinGeometry();

                            // Define the rectangular area to fill (the door opening)
                            const imgX = geo.doorLeft;
                            const imgY = doorY;
                            const imgWidth = geo.doorWidth;
                            const imgHeight = doorHeight;

                            // Calculate aspect ratios
                            const imageAspect = gamingRoomImage.width / gamingRoomImage.height;
                            const boxAspect = imgWidth / imgHeight;

                            let drawWidth, drawHeight, drawX, drawY;

                            // Use "cover" behavior - fill entire box without white borders
                            if (imageAspect > boxAspect) {
                                // Image is wider - fit to height, crop sides
                                drawHeight = imgHeight;
                                drawWidth = drawHeight * imageAspect;
                                drawY = imgY;
                                drawX = imgX - (drawWidth - imgWidth) / 2;
                            } else {
                                // Image is taller - fit to width, crop top/bottom
                                drawWidth = imgWidth;
                                drawHeight = drawWidth / imageAspect;
                                drawX = imgX;
                                drawY = imgY - (drawHeight - imgHeight) / 2;
                            }

                            // Create clipping path for the door area
                            ctx.save();
                            ctx.beginPath();
                            ctx.rect(imgX, imgY, imgWidth, imgHeight);
                            ctx.clip();

                            // Draw the image
                            ctx.drawImage(gamingRoomImage, drawX, drawY, drawWidth, drawHeight);
                            ctx.restore();
                        }
                        break;
                    case 2:
                        ctx.fillStyle = '#666';
                        ctx.font = 'bold 24px Arial';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('OFFICE', VP_X, doorY + doorHeight * 0.3);
                        break;
                    case 3:
                        ctx.fillStyle = '#666';
                        ctx.font = 'bold 24px Arial';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('ROOFTOP', VP_X, doorY + doorHeight * 0.3);
                        break;
                }
            }

            // 绘制楼层显示器（在门上方）
            drawFloorIndicator() {
                const geo = getCabinGeometry();
                ctx.save();
                ctx.translate(0, this.elevator.vibration);

                const indW = geo.doorWidth * 0.25;
                const indH = geo.doorHeight * 0.1;
                const indX = VP_X - indW / 2;
                const indY = geo.doorTop - indH - 20; // 门上方

                // 显示器外壳 - 更有质感
                const shellGrad = ctx.createLinearGradient(indX, indY, indX, indY + indH);
                shellGrad.addColorStop(0, '#3a3a3a');
                shellGrad.addColorStop(0.5, '#2a2a2a');
                shellGrad.addColorStop(1, '#3a3a3a');
                ctx.fillStyle = shellGrad;
                ctx.fillRect(indX, indY, indW, indH);

                ctx.strokeStyle = '#666';
                ctx.lineWidth = 2;
                ctx.strokeRect(indX, indY, indW, indH);

                // 显示屏 - 深黑背景
                ctx.fillStyle = '#0a0a0a';
                ctx.fillRect(indX + 5, indY + 5, indW - 10, indH - 10);

                // LED数字闪烁效果
                let glowAlpha = 1;
                if (this.elevator.floorChangeTimer < 200) {
                    glowAlpha = 1 - (this.elevator.floorChangeTimer / 200) * 0.4;
                }

                // 暖黄橙色LED数字
                ctx.fillStyle = `rgba(255, 180, 50, ${glowAlpha})`;
                ctx.font = `bold ${indH * 0.55}px monospace`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.elevator.displayFloor, VP_X, indY + indH / 2);

                // 增强型LED光晕 - 更柔和的扩散
                const innerGlow = ctx.createRadialGradient(VP_X, indY + indH / 2, 0,
                                                           VP_X, indY + indH / 2, indH * 0.6);
                innerGlow.addColorStop(0, `rgba(255, 180, 50, ${glowAlpha * 0.4})`);
                innerGlow.addColorStop(0.5, `rgba(255, 180, 50, ${glowAlpha * 0.2})`);
                innerGlow.addColorStop(1, 'rgba(255, 180, 50, 0)');
                ctx.fillStyle = innerGlow;
                ctx.fillRect(indX, indY, indW, indH);

                // 外部光晕
                const outerGlow = ctx.createRadialGradient(VP_X, indY + indH / 2, indH * 0.3,
                                                           VP_X, indY + indH / 2, indH * 1.5);
                outerGlow.addColorStop(0, `rgba(255, 180, 50, ${glowAlpha * 0.15})`);
                outerGlow.addColorStop(1, 'rgba(255, 180, 50, 0)');
                ctx.fillStyle = outerGlow;
                ctx.fillRect(indX - indH, indY - indH / 2, indW + indH * 2, indH * 2);

                ctx.restore();
            }

            // 绘制按钮面板（安装在左墙上）
            drawButtonPanel() {
                const geo = getCabinGeometry();
                ctx.save();
                ctx.translate(0, this.elevator.vibration);

                // 面板尺寸比例 - 更窄更紧凑的面板
                const PANEL_WIDTH_RATIO  = 0.11;  // 更窄的面板
                const PANEL_HEIGHT_RATIO = 0.52;  // 稍短的面板

                // 面板尺寸
                const panelW = W * PANEL_WIDTH_RATIO;
                const panelH = H * PANEL_HEIGHT_RATIO;

                // 面板位置 - 靠左墙，垂直居中
                // 走近时面板向左移动，并稍微下移 Panel shifts left and down when walking close
                const farPanelX = W * 0.06;
                const nearPanelX = W * 0.02;  // 更靠近左边缘 Closer to left edge
                const panelX = lerp(farPanelX, nearPanelX, walkProgress);

                const farPanelY = (H - panelH) / 2;
                const nearPanelY = (H - panelH) / 2 + 30;  // 稍微下移 Slightly lower
                const panelY = lerp(farPanelY, nearPanelY, walkProgress);

                // 面板阴影（给一点3D深度感）
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.fillRect(panelX + 4, panelY + 4, panelW, panelH);

                // 面板主体
                const panelGrad = ctx.createLinearGradient(panelX, panelY, panelX + panelW, panelY);
                panelGrad.addColorStop(0, '#3a3a3a');
                panelGrad.addColorStop(0.1, '#4a4a4a');
                panelGrad.addColorStop(0.9, '#3a3a3a');
                panelGrad.addColorStop(1, '#2a2a2a');

                ctx.fillStyle = panelGrad;
                ctx.fillRect(panelX, panelY, panelW, panelH);

                // 面板边框
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 3;
                ctx.strokeRect(panelX, panelY, panelW, panelH);

                // 内侧边框装饰
                ctx.strokeStyle = '#666';
                ctx.lineWidth = 1;
                ctx.strokeRect(panelX + 6, panelY + 6, panelW - 12, panelH - 12);

                // 统一按钮配置：3个楼层按钮 + 1行门控按钮
                const buttonRadius = Math.min(panelW * 0.22, panelH * 0.055);
                const panelCenterX = panelX + panelW / 2;

                // 紧凑的楼层按钮间距（约0.7倍按钮直径）
                const floorButtonSpacing = buttonRadius * 1.4; // 非常紧凑的间距

                // 计算3个楼层按钮所占的总高度
                const singleButtonHeight = buttonRadius * 2;
                const floorButtonsHeight = 3 * singleButtonHeight + 2 * floorButtonSpacing;

                // 楼层按钮到门控按钮的中等间距
                const floorToDoorGap = buttonRadius * 4.0;

                // 计算所有按钮的总高度（包括门控按钮）
                const totalButtonsHeight = floorButtonsHeight + floorToDoorGap + singleButtonHeight;

                // 垂直居中整个按钮组，确保上下padding相等
                const groupStartY = panelY + (panelH - totalButtonsHeight) / 2;

                // 楼层按钮组向下偏移量（正值向下移动）
                const floorGroupOffsetY = 40;

                // 绘制3个楼层按钮（垂直排列，紧凑间距）
                const floorButtons = [3, 2, 1];
                floorButtons.forEach((floorNum, i) => {
                    const btn = this.elevator.buttons.find(b => b.floor === floorNum);
                    const bx = panelCenterX;
                    const by = groupStartY + floorGroupOffsetY + i * (singleButtonHeight + floorButtonSpacing);
                    const isCurrent = floorNum === this.elevator.currentFloor;
                    const isActive = btn.active;

                    // 按钮凹槽
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                    ctx.beginPath();
                    ctx.arc(bx, by, buttonRadius * 1.15, 0, Math.PI * 2);
                    ctx.fill();

                    // 按钮阴影
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                    ctx.beginPath();
                    ctx.arc(bx + 1.5, by + 1.5, buttonRadius, 0, Math.PI * 2);
                    ctx.fill();

                    // 按钮本体
                    const btnGrad = ctx.createRadialGradient(
                        bx - buttonRadius * 0.35, by - buttonRadius * 0.35, buttonRadius * 0.1,
                        bx, by, buttonRadius
                    );

                    if (isActive) {
                        btnGrad.addColorStop(0, '#ffe44d');
                        btnGrad.addColorStop(0.6, '#ffbb00');
                        btnGrad.addColorStop(1, '#cc9900');
                    } else {
                        btnGrad.addColorStop(0, '#6a6a6a');
                        btnGrad.addColorStop(0.6, '#4a4a4a');
                        btnGrad.addColorStop(1, '#2a2a2a');
                    }

                    ctx.fillStyle = btnGrad;
                    ctx.beginPath();
                    ctx.arc(bx, by, buttonRadius, 0, Math.PI * 2);
                    ctx.fill();

                    // 当前楼层指示灯
                    if (isCurrent) {
                        ctx.strokeStyle = '#00ff00';
                        ctx.lineWidth = 2.5;
                        ctx.beginPath();
                        ctx.arc(bx, by, buttonRadius * 1.05, 0, Math.PI * 2);
                        ctx.stroke();
                    }

                    // 激活时的光晕
                    if (isActive) {
                        const glowGrad = ctx.createRadialGradient(bx, by, buttonRadius,
                                                                 bx, by, buttonRadius * 2.2);
                        glowGrad.addColorStop(0, 'rgba(255, 200, 50, 0.35)');
                        glowGrad.addColorStop(1, 'rgba(255, 200, 50, 0)');
                        ctx.fillStyle = glowGrad;
                        ctx.beginPath();
                        ctx.arc(bx, by, buttonRadius * 2.2, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // 楼层数字（无高光线）
                    ctx.fillStyle = isActive ? '#000' : '#e0e0e0';
                    ctx.font = `bold ${buttonRadius * 1.1}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(floorNum, bx, by + 1);

                    // 保存按钮位置用于点击检测
                    btn.screenPos = { x: bx, y: by, radius: buttonRadius * 1.3 };
                });

                // 绘制开门/关门按钮（并排在底部，保持舒适间距）
                const doorControlY = groupStartY + floorButtonsHeight + floorToDoorGap;
                const horizontalOffset = buttonRadius * 1.4;

                // OPEN 按钮（左侧）
                const openBtnX = panelCenterX - horizontalOffset;
                const openBtnY = doorControlY;
                this.drawControlButton(openBtnX, openBtnY, buttonRadius, 'open',
                                      this.elevator.openButton.pressed);
                this.elevator.openButton.screenPos = {
                    x: openBtnX,
                    y: openBtnY,
                    radius: buttonRadius * 1.3
                };

                // CLOSE 按钮（右侧）
                const closeBtnX = panelCenterX + horizontalOffset;
                const closeBtnY = doorControlY;
                this.drawControlButton(closeBtnX, closeBtnY, buttonRadius, 'close',
                                       this.elevator.closeButton.pressed);
                this.elevator.closeButton.screenPos = {
                    x: closeBtnX,
                    y: closeBtnY,
                    radius: buttonRadius * 1.3
                };

                ctx.restore();
            }

            // 绘制开门/关门控制按钮
            drawControlButton(x, y, radius, iconType, isPressed) {
                // 按钮凹槽
                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.beginPath();
                ctx.arc(x, y, radius * 1.15, 0, Math.PI * 2);
                ctx.fill();

                // 按钮阴影
                if (!isPressed) {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                    ctx.beginPath();
                    ctx.arc(x + 1, y + 1, radius, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 按钮本体
                const btnGrad = ctx.createRadialGradient(
                    x - radius * 0.3, y - radius * 0.3, radius * 0.1,
                    x, y, radius
                );

                if (isPressed) {
                    btnGrad.addColorStop(0, '#4a4a4a');
                    btnGrad.addColorStop(0.6, '#3a3a3a');
                    btnGrad.addColorStop(1, '#2a2a2a');
                } else {
                    btnGrad.addColorStop(0, '#6a6a6a');
                    btnGrad.addColorStop(0.6, '#4a4a4a');
                    btnGrad.addColorStop(1, '#2a2a2a');
                }

                ctx.fillStyle = btnGrad;
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();

                // 绘制电梯图标 - 清晰简洁的设计
                ctx.save();
                ctx.translate(x, y);

                const iconColor = isPressed ? 'rgba(200, 200, 200, 0.9)' : 'rgba(255, 255, 255, 0.95)';
                const s = radius * 0.5; // 图标缩放比例

                if (iconType === 'open') {
                    // OPEN 图标: ◀ ○││○ ▶ (展开状态)
                    ctx.strokeStyle = iconColor;
                    ctx.fillStyle = iconColor;
                    ctx.lineWidth = 2.5;

                    // 中央两条竖线
                    ctx.beginPath();
                    ctx.moveTo(-s * 0.12, -s * 0.75);
                    ctx.lineTo(-s * 0.12, s * 0.75);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(s * 0.12, -s * 0.75);
                    ctx.lineTo(s * 0.12, s * 0.75);
                    ctx.stroke();

                    // 左侧箭头（向外）
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(-s * 0.75, 0);
                    ctx.lineTo(-s * 0.45, -s * 0.35);
                    ctx.lineTo(-s * 0.45, s * 0.35);
                    ctx.closePath();
                    ctx.fill();

                    // 右侧箭头（向外）
                    ctx.beginPath();
                    ctx.moveTo(s * 0.75, 0);
                    ctx.lineTo(s * 0.45, -s * 0.35);
                    ctx.lineTo(s * 0.45, s * 0.35);
                    ctx.closePath();
                    ctx.fill();

                } else if (iconType === 'close') {
                    // CLOSE 图标: ▶ ○││○ ◀ (合拢状态)
                    ctx.strokeStyle = iconColor;
                    ctx.fillStyle = iconColor;
                    ctx.lineWidth = 2.5;

                    // 中央两条竖线
                    ctx.beginPath();
                    ctx.moveTo(-s * 0.12, -s * 0.75);
                    ctx.lineTo(-s * 0.12, s * 0.75);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(s * 0.12, -s * 0.75);
                    ctx.lineTo(s * 0.12, s * 0.75);
                    ctx.stroke();

                    // 左侧箭头（向内）
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(-s * 0.3, 0);
                    ctx.lineTo(-s * 0.6, -s * 0.35);
                    ctx.lineTo(-s * 0.6, s * 0.35);
                    ctx.closePath();
                    ctx.fill();

                    // 右侧箭头（向内）
                    ctx.beginPath();
                    ctx.moveTo(s * 0.3, 0);
                    ctx.lineTo(s * 0.6, -s * 0.35);
                    ctx.lineTo(s * 0.6, s * 0.35);
                    ctx.closePath();
                    ctx.fill();
                }

                ctx.restore();
            }

            // 绘制环境光效（柔和照明）
            drawAtmosphere() {
                const geo = getCabinGeometry();

                // 中央区域（门和指示器周围）稍亮
                const centerLight = ctx.createRadialGradient(VP_X, VP_Y, 0,
                                                             VP_X, VP_Y, Math.max(W, H) * 0.5);
                centerLight.addColorStop(0, 'rgba(255, 248, 220, 0.03)');
                centerLight.addColorStop(0.5, 'rgba(255, 248, 220, 0.01)');
                centerLight.addColorStop(1, 'rgba(0, 0, 0, 0)');

                ctx.fillStyle = centerLight;
                ctx.fillRect(0, 0, W, H);

                // 四角暗角效果
                const vignette = ctx.createRadialGradient(VP_X, VP_Y, Math.min(W, H) * 0.3,
                                                          VP_X, VP_Y, Math.max(W, H) * 0.8);
                vignette.addColorStop(0, 'rgba(0, 0, 0, 0)');
                vignette.addColorStop(0.7, 'rgba(0, 0, 0, 0.1)');
                vignette.addColorStop(1, 'rgba(0, 0, 0, 0.25)');

                ctx.fillStyle = vignette;
                ctx.fillRect(0, 0, W, H);
            }

            // 绘制状态文字
            drawStatusText() {
                ctx.fillStyle = 'rgba(220, 220, 220, 0.8)';
                ctx.font = '16px Arial';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                ctx.fillText(this.elevator.getStatusText(), 20, 20);

                if (this.elevator.targetQueue.length > 0) {
                    ctx.fillStyle = 'rgba(180, 180, 180, 0.8)';
                    ctx.font = '14px Arial';
                    ctx.fillText(`Queue: ${this.elevator.targetQueue.join(', ')}`, 20, H - 40);
                }
            }

            // 绘制电梯场景 Draw elevator scene
            drawElevatorScene() {
                // 绘制顺序（从后到前，构建封闭电梯厢）
                // 所有元素现在使用 walkProgress 插值调整位置和尺寸
                // All elements now use walkProgress interpolation to adjust position and size
                this.drawCeiling();        // 天花板
                this.drawFloor();          // 地板
                this.drawWalls();          // 左右侧墙
                this.drawFrontWall();      // 前墙背景 + 外部场景（门后）
                this.drawDoors();          // 门板（滑动）
                this.drawDoorFrame();      // 门框（覆盖在门上，形成滑入效果）
                this.drawFloorIndicator(); // 楼层显示器
                this.drawButtonPanel();    // 按钮面板
                this.drawAtmosphere();     // 环境光效
                this.drawStatusText();     // 状态文字

                // 绘制进入提示 Draw enter hint
                // 只在玩家走到门前且门完全打开时显示淡入淡出的"点击进入"提示
                // Only show "click to enter" hint with breathing effect when player is at door AND doors are open
                const doorsFullyOpen = this.elevator.doorProgress >= 0.99;

                if (walkProgress >= 1 && doorsFullyOpen) {
                    const geo = getCabinGeometry();

                    // 计算呼吸不透明度 0.6 - 0.9（更明显）Breathing opacity 0.6 - 0.9 (more visible)
                    const enterHintOpacity = 0.75 + Math.sin(enterHintPhase) * 0.15;

                    ctx.save();
                    ctx.globalAlpha = enterHintOpacity;

                    ctx.fillStyle = 'rgba(255, 255, 255, 1.0)';  // 更亮的白色 Brighter white
                    ctx.font = 'bold 48px sans-serif';  // 更大的字体 Larger font
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';

                    // 在门的正中央显示提示 Show hint in center of door
                    const hintY = geo.doorTop + geo.doorHeight * 0.5;
                    ctx.fillText('Click to Enter', VP_X, hintY);

                    ctx.restore();
                }
            }

            // 主渲染函数 Main render function
            render() {
                // 清屏 Clear screen
                ctx.fillStyle = '#0a0a0a';
                ctx.fillRect(0, 0, W, H);

                // 根据场景状态绘制不同场景 Branch rendering by scene state
                if (sceneState === 'elevator') {
                    // 应用FPS头部晃动到电梯场景 Apply FPS head-bob to elevator scene
                    ctx.save();
                    ctx.translate(headBobOffsetX, headBobOffsetY);
                    this.drawElevatorScene();
                    ctx.restore();
                } else if (sceneState === 'corridor1') {
                    if (viewMode === 'corridor') {
                        // 应用FPS头部晃动到走廊场景 Apply FPS head-bob to corridor scene
                        ctx.save();
                        ctx.translate(headBobOffsetX, headBobOffsetY);
                        drawCorridor1Scene();
                        ctx.restore();

                        // Draw "Back to Elevator" button (no head-bob for UI)
                        drawBackToElevatorButton(ctx);
                    } else if (viewMode === 'monitor') {
                        // Draw fullscreen monitor view (no head-bob)
                        drawMonitorViewFullscreen(ctx);
                    }
                } else if (sceneState === 'audioroom') {
                    if (viewMode === 'corridor') {
                        // 应用FPS头部晃动到音频室场景 Apply FPS head-bob to audio room scene
                        ctx.save();
                        ctx.translate(headBobOffsetX, headBobOffsetY);
                        drawAudioRoomScene();
                        ctx.restore();

                        // Draw "Back to Elevator" button (no head-bob for UI)
                        drawBackToElevatorButton(ctx);
                    }
                }
            }
        }

        // ========== 走廊场景绘制 Corridor Scene Drawing ==========
        // Corridor1: long hallway on floor 1
        // 一层电梯外的长廊场景，走路效果与电梯一致
        function drawCorridor1Scene() {
            // ========== 走廊坐标定义 Corridor coordinates ==========
            // Small changes at the far end + scrolling textures + head-bob create the walk feeling
            // 通过远端区域轻微变化 + 纹理滑动 + 头部晃动来表达走向电脑，而不是整屏缩放
            // Side walls and back wall share the same top/bottom Y -> consistent corridor height
            // 左右墙和后墙顶部/地面高度对齐，透视保持统一

            const t = walkProgress;

            // Back wall horizontal: slightly wider when closer
            // 后墙水平范围：靠近时略微变宽
            const backLeftX  = lerp(CORRIDOR_BACK_LEFT_X_FAR,  CORRIDOR_BACK_LEFT_X_NEAR,  t);
            const backRightX = lerp(CORRIDOR_BACK_RIGHT_X_FAR, CORRIDOR_BACK_RIGHT_X_NEAR, t);

            // Back wall vertical: floor line moves down a bit when closer
            // 后墙垂直范围：靠近时地板线略微下移
            const backFloorY   = lerp(CORRIDOR_BACK_FLOOR_Y_FAR, CORRIDOR_BACK_FLOOR_Y_NEAR, t);
            const backCeilingY = CORRIDOR_BACK_CEILING_Y; // keep constant

            // Front edges of side walls: FIXED, no movement with walkProgress
            // 侧墙前端边缘：固定，不随walkProgress变化
            const frontLeftX    = CORRIDOR_FRONT_LEFT_X;
            const frontRightX   = CORRIDOR_FRONT_RIGHT_X;
            const frontCeilingY = CORRIDOR_FRONT_CEILING_Y;
            const frontFloorY   = CORRIDOR_FRONT_FLOOR_Y;


            // === 绘制地板 Draw floor ===
            // 地板梯形 Floor trapezoid - gaming room dark blue
            ctx.fillStyle = '#050716';
            ctx.beginPath();
            ctx.moveTo(frontLeftX, frontFloorY);  // 前左 Front left
            ctx.lineTo(frontRightX, frontFloorY); // 前右 Front right
            ctx.lineTo(backRightX, backFloorY);   // 后右 Back right
            ctx.lineTo(backLeftX, backFloorY);    // 后左 Back left
            ctx.closePath();
            ctx.fill();

            // 地板网格滚动 Floor grid scrolling
            // 使用与电梯相同的 TILE_SIZE 和 floorScroll 逻辑
            const tileSize = TILE_SIZE;
            const offset = floorScroll % tileSize;  // 循环偏移 Wrapped offset for seamless repeat

            ctx.save();
            ctx.strokeStyle = 'rgba(79, 212, 255, 0.12)';  // Cyan grid lines for gaming feel
            ctx.lineWidth = 1;

            // 横向线（沿深度方向）- 随floorScroll滚动 Horizontal lines - scroll with floorScroll
            const numHLines = Math.ceil((frontFloorY - backFloorY) / tileSize) + 2;
            for (let i = 0; i < numHLines; i++) {
                const y = backFloorY + (i * tileSize) + offset;
                if (y < backFloorY || y > frontFloorY) continue;

                const tLine = (y - backFloorY) / (frontFloorY - backFloorY);
                const leftX = lerp(backLeftX, frontLeftX, tLine);
                const rightX = lerp(backRightX, frontRightX, tLine);

                ctx.beginPath();
                ctx.moveTo(leftX, y);
                ctx.lineTo(rightX, y);
                ctx.stroke();
            }

            // 纵向线（汇聚到中心）- 固定间距不滚动 Vertical lines - fixed spacing, no scroll
            const numVLines = 8;
            for (let i = 0; i <= numVLines; i++) {
                const tLine = i / numVLines;
                const frontX = lerp(frontLeftX, frontRightX, tLine);
                const backX = lerp(backLeftX, backRightX, tLine);

                ctx.beginPath();
                ctx.moveTo(frontX, frontFloorY);
                ctx.lineTo(backX, backFloorY);
                ctx.stroke();
            }

            ctx.restore();

            // === 绘制左墙 Draw left wall ===
            // Side wall polygon shares same top/bottom Y as back wall
            // 侧墙多边形与后墙共用相同的顶部/底部Y坐标 - Gaming room blue-violet
            const leftWallGrad = ctx.createLinearGradient(frontLeftX, 0, backLeftX, 0);
            leftWallGrad.addColorStop(0, '#101427');
            leftWallGrad.addColorStop(0.5, '#1a1e3a');
            leftWallGrad.addColorStop(1, '#101427');

            ctx.fillStyle = leftWallGrad;
            ctx.beginPath();
            ctx.moveTo(frontLeftX, frontCeilingY);  // 前顶 Front top
            ctx.lineTo(backLeftX, backCeilingY);    // 后顶 Back top (aligned with back wall)
            ctx.lineTo(backLeftX, backFloorY);      // 后底 Back bottom (aligned with back wall)
            ctx.lineTo(frontLeftX, frontFloorY);    // 前底 Front bottom
            ctx.closePath();
            ctx.fill();

            // 左墙装饰线（可选滚动效果）Left wall decoration lines (optional scrolling)
            ctx.save();
            ctx.strokeStyle = 'rgba(100, 100, 110, 0.08)';
            ctx.lineWidth = 1;
            const wallOffset = wallScroll % 100;
            const numWallLines = 8;
            for (let i = 0; i < numWallLines; i++) {
                const y = backCeilingY + (i * 100) + wallOffset - 100;
                if (y < backCeilingY || y > backFloorY) continue;

                const tWall = (y - backCeilingY) / (backFloorY - backCeilingY);
                const xLeft = lerp(backLeftX, frontLeftX, tWall);

                ctx.beginPath();
                ctx.moveTo(xLeft, y);
                ctx.lineTo(xLeft + 40, y);
                ctx.stroke();
            }
            ctx.restore();

            // === 绘制右墙 Draw right wall ===
            // Side wall polygon shares same top/bottom Y as back wall
            // 侧墙多边形与后墙共用相同的顶部/底部Y坐标 - Gaming room blue-violet
            const rightWallGrad = ctx.createLinearGradient(backRightX, 0, frontRightX, 0);
            rightWallGrad.addColorStop(0, '#101427');
            rightWallGrad.addColorStop(0.5, '#1a1e3a');
            rightWallGrad.addColorStop(1, '#101427');

            ctx.fillStyle = rightWallGrad;
            ctx.beginPath();
            ctx.moveTo(frontRightX, frontCeilingY);  // 前顶 Front top
            ctx.lineTo(backRightX, backCeilingY);    // 后顶 Back top (aligned with back wall)
            ctx.lineTo(backRightX, backFloorY);      // 后底 Back bottom (aligned with back wall)
            ctx.lineTo(frontRightX, frontFloorY);    // 前底 Front bottom
            ctx.closePath();
            ctx.fill();

            // 右墙装饰线 Right wall decoration lines
            ctx.save();
            ctx.strokeStyle = 'rgba(100, 100, 110, 0.08)';
            ctx.lineWidth = 1;
            for (let i = 0; i < numWallLines; i++) {
                const y = backCeilingY + (i * 100) + wallOffset - 100;
                if (y < backCeilingY || y > backFloorY) continue;

                const tWall = (y - backCeilingY) / (backFloorY - backCeilingY);
                const xRight = lerp(backRightX, frontRightX, tWall);

                ctx.beginPath();
                ctx.moveTo(xRight - 40, y);
                ctx.lineTo(xRight, y);
                ctx.stroke();
            }
            ctx.restore();

            // === 绘制天花板 Draw ceiling ===
            ctx.fillStyle = '#050716';  // Gaming room dark blue ceiling
            ctx.beginPath();
            ctx.moveTo(frontLeftX, frontCeilingY);   // 前左 Front left
            ctx.lineTo(frontRightX, frontCeilingY);  // 前右 Front right
            ctx.lineTo(backRightX, backCeilingY);    // 后右 Back right
            ctx.lineTo(backLeftX, backCeilingY);     // 后左 Back left
            ctx.closePath();
            ctx.fill();

            // 天花板网格（轻微滚动）Ceiling grid (subtle scrolling) - purple accent
            ctx.save();
            ctx.strokeStyle = 'rgba(197, 84, 255, 0.08)';  // Subtle purple grid
            ctx.lineWidth = 1;
            const ceilingOffset = ceilingScroll % 80;
            const numCLines = Math.ceil((backCeilingY - frontCeilingY) / 80) + 2;
            for (let i = 0; i < numCLines; i++) {
                const y = frontCeilingY + (i * 80) + ceilingOffset - 80;
                if (y < frontCeilingY || y > backCeilingY) continue;

                const tLine = (y - frontCeilingY) / (backCeilingY - frontCeilingY);
                const leftX = lerp(frontLeftX, backLeftX, tLine);
                const rightX = lerp(frontRightX, backRightX, tLine);

                ctx.beginPath();
                ctx.moveTo(leftX, y);
                ctx.lineTo(rightX, y);
                ctx.stroke();
            }
            ctx.restore();

            // === 调用环境和物体绘制函数 Call environment and object drawing functions ===
            // 绘制霓虹环境（后墙、光板、LED灯条）Draw neon environment (back wall, panels, LED strips)
            drawCorridorEnvironment(backLeftX, backRightX, backCeilingY, backFloorY);

            // 绘制游戏室霓虹灯条 Draw gaming room neon strips (ceiling + wall edges)
            drawGamingRoomNeon(
                frontLeftX, frontRightX, backLeftX, backRightX,
                frontCeilingY, backCeilingY, frontFloorY, backFloorY
            );

            // 绘制侧墙装饰 Draw side wall decorations (shelves, posters)
            drawSideWallDecor(
                frontLeftX, frontRightX, backLeftX, backRightX,
                frontCeilingY, backCeilingY, frontFloorY, backFloorY
            );

            // 绘制侧墙霓虹相框 Draw neon wall frames on side walls
            drawWallFrames(
                ctx, frontLeftX, frontRightX, backLeftX, backRightX,
                frontCeilingY, backCeilingY, frontFloorY, backFloorY
            );

            // 绘制地板纹理 Draw floor texture (plush gaming rug)
            drawFloorTexture(frontLeftX, frontRightX, backLeftX, backRightX, frontFloorY, backFloorY);

            // 绘制柔软毛绒地毯覆盖层 Draw soft plush rug overlay (subtle fuzzy texture)
            drawRugSoftPlushOverlay(ctx, frontLeftX, frontRightX, backLeftX, backRightX, frontFloorY, backFloorY);

            // 绘制科技模拟时钟 Draw large analog clock above monitor
            drawTechAnalogClock(backLeftX, backRightX, backCeilingY, backFloorY);

            // 绘制桌子和电脑 Draw desk and computer
            drawDeskAndComputer(backLeftX, backRightX, backFloorY, t);

            // Update "Back to Elevator" button position (will be drawn in render() method)
            // 更新"返回电梯"按钮位置（将在render()方法中绘制）
            backButton.y = H - backButton.h - 20;
        }

        // ========== 走廊环境绘制 Corridor Environment Drawing ==========
        // Gaming room inspired neon environment
        // 游戏室风格的霓虹环境
        function drawCorridorEnvironment(backLeftX, backRightX, backCeilingY, backFloorY) {
            // 后墙 Back wall - gaming room blue-violet gradient
            const wallGrad = ctx.createLinearGradient(0, backCeilingY, 0, backFloorY);
            wallGrad.addColorStop(0, '#101427');  // Brighter blue-violet
            wallGrad.addColorStop(1, '#050716');  // Dark blue base
            ctx.fillStyle = wallGrad;
            ctx.fillRect(backLeftX, backCeilingY, backRightX - backLeftX, backFloorY - backCeilingY);

            // REMOVED: Blue square panels on back wall (left and right of computer)
            // User requested removal of the two decorative panels

            // LED灯条 - 沿后墙底部 Single LED strip at base of back wall (where floor meets wall)
            ctx.save();
            ctx.shadowColor = 'rgba(70, 120, 255, 0.8)';
            ctx.shadowBlur = 18;
            ctx.strokeStyle = '#4f7aff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(backLeftX, backFloorY + 1);
            ctx.lineTo(backRightX, backFloorY + 1);
            ctx.stroke();
            ctx.restore();
        }

        // ========== 游戏室霓虹灯条 Gaming Room Neon Strips ==========
        // Cyan and purple neon strips on ceiling and wall edges
        // 天花板和墙边的青色和紫色霓虹灯条
        function drawGamingRoomNeon(frontLeftX, frontRightX, backLeftX, backRightX,
                                     frontCeilingY, backCeilingY, frontFloorY, backFloorY) {
            // --- CEILING NEON following the inner top edges of the corridor ---
            ctx.save();
            ctx.shadowColor = "rgba(120, 120, 255, 0.9)";
            ctx.shadowBlur  = 26;
            ctx.strokeStyle = "#7fddff";
            ctx.lineWidth   = 3;

            const offset = 6; // small offset away from exact wall edges

            // left ceiling edge: from front-left top to back-left top
            ctx.beginPath();
            ctx.moveTo(frontLeftX + offset,  frontCeilingY + offset);
            ctx.lineTo(backLeftX  + offset,  backCeilingY  + offset);
            ctx.stroke();

            // right ceiling edge: from front-right top to back-right top
            ctx.beginPath();
            ctx.moveTo(frontRightX - offset, frontCeilingY + offset);
            ctx.lineTo(backRightX - offset,  backCeilingY  + offset);
            ctx.stroke();

            ctx.restore();

            // keep the base neon along the back floor as before
            ctx.save();
            ctx.shadowColor = "rgba(80, 140, 255, 0.9)";
            ctx.shadowBlur  = 22;
            ctx.strokeStyle = "#4f8dff";
            ctx.lineWidth   = 3;
            ctx.beginPath();
            ctx.moveTo(backLeftX,  backFloorY + 1);
            ctx.lineTo(backRightX, backFloorY + 1);
            ctx.stroke();
            ctx.restore();

            // --- Back wall neon frame (top + two vertical sides) ---
            ctx.save();
            ctx.shadowColor = "rgba(120, 180, 255, 0.9)";
            ctx.shadowBlur  = 26;
            ctx.strokeStyle = "#6fd8ff";
            ctx.lineWidth   = 3;

            const backWallOffset = 3; // small inward offset so it sits just inside the room

            // left vertical edge
            ctx.beginPath();
            ctx.moveTo(backLeftX + backWallOffset, backCeilingY + backWallOffset);
            ctx.lineTo(backLeftX + backWallOffset, backFloorY - backWallOffset);
            ctx.stroke();

            // right vertical edge
            ctx.beginPath();
