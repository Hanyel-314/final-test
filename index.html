            ctx.shadowBlur  = 45;

            // soft outer halo
            const haloGrad = ctx.createRadialGradient(cx, cy, innerRadius * 0.4, cx, cy, outerRadius * 1.4);
            haloGrad.addColorStop(0.0, "rgba(10, 30, 70, 0.8)");
            haloGrad.addColorStop(1.0, "rgba(0, 0, 0, 0.0)");
            ctx.fillStyle = haloGrad;
            ctx.beginPath();
            ctx.arc(cx, cy, outerRadius * 1.4, 0, Math.PI * 2);
            ctx.fill();

            // outer neon ring
            ctx.strokeStyle = "#6fd8ff";
            ctx.lineWidth   = 5;
            ctx.beginPath();
            ctx.arc(cx, cy, outerRadius, 0, Math.PI * 2);
            ctx.stroke();

            // inner ring
            ctx.strokeStyle = "#c554ff";
            ctx.lineWidth   = 3;
            ctx.beginPath();
            ctx.arc(cx, cy, innerRadius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();

            // ===========================
            // TICK MARKS (TECH RING)
            // ===========================
            ctx.save();
            ctx.strokeStyle = "rgba(180, 210, 255, 0.85)";
            ctx.lineWidth   = 2;
            ctx.lineCap     = "round";

            for (let i = 0; i < 60; i++) {
                const a = -Math.PI / 2 + (i / 60) * Math.PI * 2;
                const cos = Math.cos(a);
                const sin = Math.sin(a);

                const isMajor = (i % 5 === 0);
                const rOuter  = outerRadius - 4;
                const rInner  = isMajor ? innerRadius - 10 : innerRadius - 5;

                ctx.beginPath();
                ctx.moveTo(cx + cos * rInner, cy + sin * rInner);
                ctx.lineTo(cx + cos * rOuter, cy + sin * rOuter);
                ctx.stroke();
            }
            ctx.restore();

            // ===========================
            // NEON SECOND ARC (sci-fi feeling)
            // ===========================
            ctx.save();
            ctx.shadowColor = "rgba(197, 84, 255, 0.9)";
            ctx.shadowBlur  = 30;
            ctx.strokeStyle = "#c554ff";
            ctx.lineWidth   = 4;

            const secSweep = (sec / 60) * Math.PI * 2;
            ctx.beginPath();
            ctx.arc(cx, cy, innerRadius + 6, -Math.PI / 2, -Math.PI / 2 + secSweep);
            ctx.stroke();
            ctx.restore();

            // ===========================
            // HOUR, MINUTE AND SECOND HANDS
            // ===========================
            ctx.save();
            ctx.lineCap = "round";

            // hour hand
            ctx.strokeStyle = "rgba(220, 235, 255, 0.95)";
            ctx.lineWidth   = 4;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(
                cx + Math.cos(hrAngle) * (innerRadius - 18),
                cy + Math.sin(hrAngle) * (innerRadius - 18)
            );
            ctx.stroke();

            // minute hand
            ctx.strokeStyle = "#6fd8ff";
            ctx.lineWidth   = 3;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(
                cx + Math.cos(minAngle) * (innerRadius - 10),
                cy + Math.sin(minAngle) * (innerRadius - 10)
            );
            ctx.stroke();

            // second hand (thin, bright, slightly longer)
            ctx.strokeStyle = "#ff5df5";
            ctx.lineWidth   = 2;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(
                cx + Math.cos(secAngle) * (innerRadius + 6),
                cy + Math.sin(secAngle) * (innerRadius + 6)
            );
            ctx.stroke();

            // center node
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(cx, cy, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();

            // ===========================
            // NUMERIC LABEL UNDER THE CLOCK (OPTIONAL)
            // ===========================
            const hhStr = String(now.getHours()).padStart(2, "0");
            const mmStr = String(now.getMinutes()).padStart(2, "0");
            const ssStr = String(now.getSeconds()).padStart(2, "0");
            const timeLabel = `${hhStr}:${mmStr}:${ssStr}`;

            ctx.save();
            ctx.fillStyle   = "rgba(210, 230, 255, 0.75)";
            ctx.font        = "14px monospace";
            ctx.textAlign   = "center";
            ctx.textBaseline = "top";
            ctx.fillText(timeLabel, cx, cy + outerRadius + 10);
            ctx.restore();
        }

        // ========== 桌子和电脑绘制 Desk and Computer Drawing ==========
        // Clean, symmetric desk with large monitor - standing on the floor
        // 干净对称的桌子和大显示器 - 站立在地板上
        function drawDeskAndComputer(backLeftX, backRightX, backFloorY, t) {
            // TWO-PHASE SCALING: normal approach (0→0.8) + extra close-up (0.8→1.0)
            // 两阶段缩放：正常接近（0→0.8）+ 额外特写（0.8→1.0）
            const tClamped = clamp01(t);

            // Phase 1: base approach (0 to 0.8)
            const basePhase = Math.min(tClamped, 0.8) / 0.8;  // 0..1 from 0 to 0.8

            // Phase 2: close-up zoom (0.8 to 1.0)
            const closePhase = clamp01((tClamped - 0.8) / 0.2);  // 0..1 from 0.8 to 1.0

            // Ease the close-up phase for smooth feeling (smoothstep)
            const closePhaseEased = closePhase * closePhase * (3 - 2 * closePhase);

            // Compute final scale: base approach + extra close-up zoom
            let computerScale = lerp(COMPUTER_SCALE_FAR, COMPUTER_SCALE_MID, basePhase);
            computerScale = lerp(computerScale, COMPUTER_SCALE_CLOSE, closePhaseEased);

            const floorY = backFloorY;  // Desk legs touch the back wall floor line
            const cx = (backLeftX + backRightX) / 2;

            // Vertical offset for close-up: slide desk+monitor down so monitor stays visible
            // 特写时的垂直偏移：将桌子+显示器整体下移，使显示器保持在画面内
            const MAX_DOWN_OFFSET = 40 * computerScale;
            const downOffset = lerp(0, MAX_DOWN_OFFSET, closePhaseEased);

            // ========== 桌子尺寸 Desk dimensions ==========
            const deskWidth     = 360 * computerScale;
            const deskThickness = 14  * computerScale;
            const legWidth      = 24  * computerScale;

            // 桌面前边缘位置 Front edge of desktop - adjusted by downOffset
            const deskFrontY = floorY - 32 * computerScale + downOffset;
            const deskTopY   = deskFrontY - deskThickness;
            const deskLeftX  = cx - deskWidth / 2;
            const deskRightX = cx + deskWidth / 2;

            // ========== 绘制桌面 Draw desk top (full rectangle, symmetric) ==========
            ctx.fillStyle = '#4b4e59';
            ctx.fillRect(deskLeftX, deskTopY, deskWidth, deskThickness);

            // 桌面前边缘厚度 Slight front face for thickness
            ctx.fillStyle = '#3d3f48';
            ctx.fillRect(deskLeftX, deskFrontY, deskWidth, 4 * computerScale);

            // ========== 绘制桌腿 Draw desk legs (two straight legs down to floor) ==========
            const legTopY = deskFrontY + 4 * computerScale;
            const legBottomY = floorY;  // Legs touch floor

            ctx.fillStyle = '#343640';

            // 左桌腿 Left leg
            const leftLegX = cx - deskWidth * 0.22 - legWidth / 2;
            ctx.fillRect(leftLegX, legTopY, legWidth, legBottomY - legTopY);

            // 右桌腿 Right leg
            const rightLegX = cx + deskWidth * 0.22 - legWidth / 2;
            ctx.fillRect(rightLegX, legTopY, legWidth, legBottomY - legTopY);

            // ========== 显示器和支架 Monitor + Stand ==========
            // Increased sizes so desk + monitor occupy ~2/3 screen height when close
            // 增大尺寸，使得靠近时桌子+显示器占据约2/3屏幕高度
            const monitorWidth  = 220 * computerScale;
            const monitorHeight = 140 * computerScale;
            const monitorBorder = 5   * computerScale;

            const standHeight = 32 * computerScale;
            const standWidth  = 32 * computerScale;

            const basePlateWidth  = 110 * computerScale;
            const basePlateHeight = 10  * computerScale;

            // 底座板在桌面上 Base plate on top of desk
            const basePlateBottomY = deskTopY;
            const basePlateTopY    = basePlateBottomY - basePlateHeight;

            ctx.fillStyle = '#3b3e49';
            ctx.fillRect(
                cx - basePlateWidth / 2,
                basePlateTopY,
                basePlateWidth,
                basePlateHeight
            );

            // 支架 Stand
            const standBottomY = basePlateTopY;
            const standTopY    = standBottomY - standHeight;

            ctx.fillStyle = '#505361';
            ctx.fillRect(
                cx - standWidth / 2,
                standTopY,
                standWidth,
                standHeight
            );

            // 显示器外框 Monitor frame
            const monitorBottomY = standTopY - 8 * computerScale;
            const monitorTopY    = monitorBottomY - monitorHeight;
            const monitorLeftX   = cx - monitorWidth / 2;

            ctx.fillStyle = '#050711';
            ctx.fillRect(
                monitorLeftX,
                monitorTopY,
                monitorWidth,
                monitorHeight
            );

            ctx.strokeStyle = 'rgba(220, 230, 255, 0.95)';
            ctx.lineWidth = monitorBorder;
            ctx.strokeRect(
                monitorLeftX,
                monitorTopY,
                monitorWidth,
                monitorHeight
            );

            // 屏幕内部蓝色发光 Inner blue screen glow
            ctx.save();
            ctx.shadowColor = 'rgba(90, 150, 255, 0.9)';
            ctx.shadowBlur = 28 * computerScale;
            ctx.fillStyle = '#2c74ff';

            const padding = 9 * computerScale;
            ctx.fillRect(
                monitorLeftX + padding,
                monitorTopY + padding,
                monitorWidth  - padding * 2,
                monitorHeight - padding * 2
            );
            ctx.restore();

            // Update monitor bounds for click detection
            // 更新显示器边界用于点击检测
            monitorBounds.x = monitorLeftX;
            monitorBounds.y = monitorTopY;
            monitorBounds.w = monitorWidth;
            monitorBounds.h = monitorHeight;

            // When player is at the front, show "Click Screen" hint on the monitor
            // 到达走廊最前时，在屏幕上显示"Click Screen"提示
            const isAtFront = (tClamped >= 0.98) && (viewMode === 'corridor');
            if (isAtFront) {
                const now = performance.now() / 1000;
                const blink = 0.5 + 0.5 * Math.sin(now * 3.0); // 0..1 pulsing

                ctx.save();
                ctx.font = `bold ${18 * computerScale}px 'Segoe UI', Arial, sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                // Subtle glow effect
                ctx.shadowColor = 'rgba(79, 212, 255, ' + blink + ')';
                ctx.shadowBlur = 15 * computerScale;
                ctx.fillStyle = 'rgba(79, 212, 255, ' + blink + ')';

                const hintX = cx;
                const hintY = monitorTopY + monitorHeight / 2;
                ctx.fillText('Click Screen', hintX, hintY);

                ctx.restore();
            }

            // Removed: Soft floor shadow under desk (per user request)
            // 移除：桌子下方地板阴影（根据用户要求）
        }

        // ========== "Back to Elevator" 按钮绘制 Button Drawing ==========
        // Appears only in corridor scene, bottom-left corner
        // 仅在走廊场景中出现，位于左下角
        function drawBackToElevatorButton(ctx) {
            const w = backButton.w;
            const h = backButton.h;
            const x = backButton.x;
            const y = backButton.y;

            ctx.save();

            // Background - dark rounded rectangle with subtle glow
            ctx.fillStyle = "#222832";
            ctx.strokeStyle = "rgba(120, 160, 255, 0.7)";
            ctx.lineWidth = 2;
            ctx.shadowColor = "rgba(120, 160, 255, 0.4)";
            ctx.shadowBlur = 8;

            ctx.beginPath();
            ctx.roundRect(x, y, w, h, 10);
            ctx.fill();
            ctx.stroke();

            // Text - white, centered
            ctx.shadowBlur = 0;  // Reset shadow for text
            ctx.fillStyle = "white";
            ctx.font = "16px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("Back to Elevator", x + w / 2, y + h / 2);

            ctx.restore();
        }

        // ========== 全屏显示器视角 Monitor View Fullscreen ==========
        // When player clicks monitor, show fullscreen monitor view
        // 当玩家点击显示器时，显示全屏显示器视角
        function drawMonitorViewFullscreen(ctx) {
            // Black background
            ctx.fillStyle = "#050716";
            ctx.fillRect(0, 0, W, H);

            // Monitor frame (centered, large)
            const frameW = W * 0.8;
            const frameH = H * 0.7;
            const frameX = (W - frameW) / 2;
            const frameY = (H - frameH) / 2;

            // Monitor outer frame
            ctx.fillStyle = '#050711';
            ctx.fillRect(frameX, frameY, frameW, frameH);

            const border = 8;
            ctx.strokeStyle = 'rgba(220, 230, 255, 0.95)';
            ctx.lineWidth = border;
            ctx.strokeRect(frameX, frameY, frameW, frameH);

            // Screen inner glow (blue)
            ctx.save();
            ctx.shadowColor = 'rgba(90, 150, 255, 0.9)';
            ctx.shadowBlur = 40;
            ctx.fillStyle = '#2c74ff';

            const padding = 15;
            ctx.fillRect(
                frameX + padding,
                frameY + padding,
                frameW - padding * 2,
                frameH - padding * 2
            );
            ctx.restore();

            // "Click anywhere to return" hint
            ctx.save();
            const now = performance.now() / 1000;
            const blink = 0.5 + 0.5 * Math.sin(now * 2.0);

            ctx.font = 'bold 24px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(255, 255, 255, ' + blink + ')';
            ctx.shadowBlur = 20;
            ctx.fillStyle = 'rgba(255, 255, 255, ' + blink + ')';

            ctx.fillText('Click anywhere to return', W / 2, H - 60);
            ctx.restore();
        }

        // ========== 主循环 ==========
        const scene = new Scene();
        let lastTime = performance.now();

        function animate(currentTime) {
            const deltaTime = currentTime - lastTime;
            lastTime = currentTime;
            const dt = deltaTime / 1000;  // 转换为秒 Convert to seconds

            // 连续的FPS风格走路 - 基于速度和时间 Continuous FPS-style walk based on velocity and time
            // 按住按键=持续移动 Hold key = continuous movement
            // Only advance walkProgress in corridor view (not in monitor view)
            // 只在走廊视角中更新walkProgress（监视器视角中不更新）
            if (sceneState === 'corridor1' && viewMode === 'corridor') {
                walkProgress += walkVelocity * WALK_SPEED * dt;
                walkProgress = Math.max(0, Math.min(1, walkProgress));  // 限制在0-1之间 Clamp between 0-1

                // 更新地板滚动 - 地面网格向后流动 Update floor scroll - ground grid flows backward
                // Stop floor/wall/ceiling scrolling at movement limits
                // 到达走廊最前或最后时，继续按键地板不会再滑动
                const atFrontLimit = (walkProgress >= 1 && walkVelocity > 0);  // 到达最前端且继续前进 At front and still pressing forward
                const atBackLimit  = (walkProgress <= 0 && walkVelocity < 0);  // 到达最后端且继续后退 At back and still pressing backward

                // 只在允许范围内滚动地板 Only scroll when within allowed range
                if (!atFrontLimit && !atBackLimit) {
                    floorScroll += walkVelocity * FLOOR_SCROLL_SPEED * dt;

                    // 更新墙面和天花板滚动（走廊场景使用）Update wall and ceiling scroll (for corridor scene)
                    // 不同的速度创造深度感 Different speeds create depth perception
                    // ⚠️ In corridor1, geometry stays fixed. Walk feeling comes from scrolling textures + head-bob only.
                    // 走廊场景里，墙/地板/桌子/电脑都不缩放不变形，靠纹理滑动和轻微晃动来表达走路
                    wallScroll += walkVelocity * WALL_SCROLL_SPEED * dt;
                    ceilingScroll += walkVelocity * CEILING_SCROLL_SPEED * dt;
                }
            } else if (sceneState === 'elevator') {
                // Elevator walking logic (unchanged)
                walkProgress += walkVelocity * WALK_SPEED * dt;
                walkProgress = Math.max(0, Math.min(1, walkProgress));

                const atFrontLimit = (walkProgress >= 1 && walkVelocity > 0);
                const atBackLimit  = (walkProgress <= 0 && walkVelocity < 0);

                if (!atFrontLimit && !atBackLimit) {
                    floorScroll += walkVelocity * FLOOR_SCROLL_SPEED * dt;
                }
            }

            // When in monitor view, ensure walkVelocity stays 0
            // 在监视器视角中，确保walkVelocity保持为0
            if (sceneState === 'corridor1' && viewMode === 'monitor') {
                walkVelocity = 0;
            }

            // 更新进入提示动画 Update enter hint animation
            // 只在走到门前时显示淡入淡出的提示 Only show breathing hint when at door
            if (walkProgress >= 1) {
                enterHintPhase += dt * 2.0;  // 控制呼吸速度 Control breathing speed
                if (!readyToEnter) {
                    readyToEnter = true;  // 标记玩家可以进入 Mark player ready to enter
                }
            } else {
                enterHintPhase = 0;  // 离开时重置 Reset when walking away
                readyToEnter = false;
            }

            // 计算FPS头部晃动 Calculate FPS-style head bob
            // 只有在移动中才晃动 Only bob when actually moving
            const isMoving = Math.abs(walkVelocity) > 0.01;

            if (isMoving) {
                // 基于时间的平滑晃动 - 更慢更平稳 Time-based smooth bob - slower and calmer
                headBobPhase += 5 * dt;  // 5弧度/秒，比之前慢 5 radians per second, slower than before
                // 非常轻微的正弦晃动 Very soft sinusoidal offsets
                headBobOffsetX = Math.sin(headBobPhase) * HEAD_BOB_MAX_X;
                // Y轴使用不同频率避免抖动 Use different frequency for Y to avoid jitter
                headBobOffsetY = Math.cos(headBobPhase * 2.0) * HEAD_BOB_MAX_Y;
            } else {
                // 停下后慢慢回正 When not moving, smoothly return to center
                headBobOffsetX *= 0.85;
                headBobOffsetY *= 0.85;
                if (Math.abs(headBobOffsetX) < 0.01) headBobOffsetX = 0;
                if (Math.abs(headBobOffsetY) < 0.01) headBobOffsetY = 0;
            }

            scene.elevator.update(deltaTime);
            scene.render();

            requestAnimationFrame(animate);
        }

        animate(performance.now());

        // ========== 交互事件 ==========

        // 检测点击位置是否在某个按钮内
        function isPointInButton(x, y, buttonPos) {
            if (!buttonPos) return false;
            const dx = x - buttonPos.x;
            const dy = y - buttonPos.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            return dist < buttonPos.radius;
        }

        // 处理指针按下（记录开始时间）
        function handlePointerDown(x, y) {
            scene.elevator.pointerDownTime = performance.now();
            scene.elevator.activePointer = null;

            // 检测是否按下开门按钮
            if (isPointInButton(x, y, scene.elevator.openButton.screenPos)) {
                scene.elevator.isHoldingOpenButton = true;
                scene.elevator.activePointer = 'open';
                scene.elevator.openButton.pressed = true;
            }
            // 检测是否按下关门按钮
            else if (isPointInButton(x, y, scene.elevator.closeButton.screenPos)) {
                scene.elevator.isHoldingCloseButton = true;
                scene.elevator.activePointer = 'close';
                scene.elevator.closeButton.pressed = true;
            }
        }

        // 处理指针抬起（计算按压时长并执行操作）
        function handlePointerUp(x, y) {
            const pressDuration = performance.now() - scene.elevator.pointerDownTime;
            const isLongPress = pressDuration >= 600; // 600ms 阈值

            // === 处理开门按钮 ===
            if (scene.elevator.isHoldingOpenButton &&
                isPointInButton(x, y, scene.elevator.openButton.screenPos)) {

                if (isLongPress) {
                    // 长按：增加开门时间
                    scene.elevator.extraOpenTime += 4000;
                    scene.elevator.extraOpenTime = Math.min(6000, scene.elevator.extraOpenTime);
                    console.log('OPEN long press: extraOpenTime =', scene.elevator.extraOpenTime);
                } else {
                    // 短按：开门或重置计时器
                    if (scene.elevator.state === STATE.IDLE) {
                        // 如果空闲，触发开门循环（当前楼层）
                        scene.elevator.state = STATE.DOOR_OPENING;
                        scene.elevator.stateTimer = 0;
                        console.log('OPEN short tap: triggering door open');
                    } else if (scene.elevator.state === STATE.DOOR_OPEN) {
                        // 如果已开门，重置计时器（延长开门）
                        scene.elevator.stateTimer = 0;
                        console.log('OPEN short tap: resetting door timer');
                    }
                }

                scene.elevator.openButton.pressed = false;
            }

            // === 处理关门按钮 ===
            if (scene.elevator.isHoldingCloseButton &&
                isPointInButton(x, y, scene.elevator.closeButton.screenPos)) {

                if (isLongPress) {
                    // 长按：减少开门时间
                    scene.elevator.extraOpenTime -= 1000;
                    scene.elevator.extraOpenTime = Math.max(-1500, scene.elevator.extraOpenTime);
                    console.log('CLOSE long press: extraOpenTime =', scene.elevator.extraOpenTime);
                } else {
                    // 短按：立即关门
                    if (scene.elevator.state === STATE.DOOR_OPEN) {
                        scene.elevator.state = STATE.DOOR_CLOSING;
                        scene.elevator.stateTimer = 0;
                        console.log('CLOSE short tap: closing doors now');
                    }
                }

                scene.elevator.closeButton.pressed = false;
            }

            // === 处理楼层按钮（原有逻辑）===
            if (scene.elevator.state === STATE.IDLE ||
                scene.elevator.state === STATE.DOOR_OPEN ||
                scene.elevator.state === STATE.MOVING) {

                scene.elevator.buttons.forEach(btn => {
                    if (isPointInButton(x, y, btn.screenPos)) {
                        scene.elevator.addTarget(btn.floor);
                        console.log('Floor selected:', btn.floor);
                    }
                });
            }

            // 重置状态
            scene.elevator.isHoldingOpenButton = false;
            scene.elevator.isHoldingCloseButton = false;
            scene.elevator.activePointer = null;
        }

        // 处理指针离开按钮（取消按下状态）
        function handlePointerCancel() {
            scene.elevator.openButton.pressed = false;
            scene.elevator.closeButton.pressed = false;
            scene.elevator.isHoldingOpenButton = false;
            scene.elevator.isHoldingCloseButton = false;
            scene.elevator.activePointer = null;
        }

        // === 鼠标事件 ===
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            handlePointerDown(e.clientX - rect.left, e.clientY - rect.top);
        });

        canvas.addEventListener('mouseup', (e) => {
            const rect = canvas.getBoundingClientRect();
            handlePointerUp(e.clientX - rect.left, e.clientY - rect.top);
        });

        canvas.addEventListener('mouseleave', () => {
            handlePointerCancel();
        });

        // === 触摸事件 ===
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            handlePointerDown(touch.clientX - rect.left, touch.clientY - rect.top);
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.changedTouches[0];
            handlePointerUp(touch.clientX - rect.left, touch.clientY - rect.top);
        }, { passive: false });

        canvas.addEventListener('touchcancel', () => {
            handlePointerCancel();
        });

        // === 进入走廊函数 Enter Corridor Function ===
        // Corridor1: long hallway on floor 1
        // 一层电梯外的长廊场景，走路效果与电梯一致
        function enterCorridor1() {
            sceneState = 'corridor1';
            viewMode = 'corridor';  // Reset to corridor view mode

            // 重置走路状态 Reset walking for corridor
            walkProgress = 0;
            walkVelocity = 0;
            floorScroll = 0;
            wallScroll = 0;
            ceilingScroll = 0;

            // 重置头部晃动 Reset head-bob
            headBobPhase = 0;
            headBobOffsetX = 0;
            headBobOffsetY = 0;

            readyToEnter = false;
            enterHintPhase = 0;

            console.log('Entered Corridor 1 scene');
        }

        // === 点击进入事件 Click to Enter Event ===
        // 当玩家走到门前并点击时，触发进入下一场景的动画
        // When player is at door and clicks, trigger entering next scene animation
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;

            if (sceneState === 'elevator') {
                // 只有在1层才能进入走廊 Only enter corridor on floor 1
                if (readyToEnter && scene.elevator.currentFloor === 1) {
                    enterCorridor1();
                }
            } else if (sceneState === 'corridor1') {
                const t = Math.max(0, Math.min(1, walkProgress));

                if (viewMode === 'corridor') {
                    // Check if "Back to Elevator" button was clicked
                    // 检查是否点击了"返回电梯"按钮
                    if (
                        mx >= backButton.x &&
                        mx <= backButton.x + backButton.w &&
                        my >= backButton.y &&
                        my <= backButton.y + backButton.h
                    ) {
                        // Return to elevator scene
                        // 返回电梯场景
                        sceneState = 'elevator';
                        walkProgress = 0;
                        walkVelocity = 0;
                        floorScroll = 0;
                        wallScroll = 0;
                        ceilingScroll = 0;
                        readyToEnter = false;
                        enterHintPhase = 0;
                        viewMode = 'corridor';  // Reset view mode
                    } else {
                        // Check if clicking monitor to enter monitor view
                        // 检查是否点击显示器以进入显示器视角
                        const isAtFront = (t >= 0.98);

                        if (
                            isAtFront &&
                            mx >= monitorBounds.x &&
                            mx <= monitorBounds.x + monitorBounds.w &&
                            my >= monitorBounds.y &&
                            my <= monitorBounds.y + monitorBounds.h
                        ) {
                            viewMode = 'monitor';
                            walkVelocity = 0;  // Stop walking when entering monitor view
                            console.log('Switched to monitor view');
                        }
                    }
                } else if (viewMode === 'monitor') {
                    // Click anywhere in monitor view to return to corridor view
                    // 在监视器视角中点击任何地方返回走廊视角
                    viewMode = 'corridor';
                    console.log('Returned to corridor view');
                }
                // Future: add computer interaction when player is at the end
                // 未来：当玩家到达尽头时添加电脑交互
            }
        });

        // === 键盘事件 - 走路移动 Keyboard Events - Walk Movement ===
        // 按住按键=持续走路 Hold key = continuous walk (FPS style)
        // 松开按键=停止 Release key = stop
        window.addEventListener('keydown', (e) => {
            const key = e.key;

            // 向前走 Walk forward (hold to walk)
            if (key === 'ArrowUp' || key === 'w' || key === 'W') {
                if (sceneState === 'elevator') {
                    // 电梯内：只有门完全打开时才能走 Elevator: only allow walking when doors are fully open
                    const doorsFullyOpen = scene.elevator.doorProgress >= 0.99;
                    if (doorsFullyOpen) {
                        walkVelocity = 1;  // 持续向前 Continuous forward
                    }
                } else if (sceneState === 'corridor1' && viewMode === 'corridor') {
                    // 走廊内：只在正常走廊视角时可以走 Corridor: only allow walking in corridor view
                    walkVelocity = 1;
                }
            }

            // 向后走 Walk backward (hold to walk back)
            if (key === 'ArrowDown' || key === 's' || key === 'S') {
                if (sceneState === 'corridor1' && viewMode === 'corridor') {
                    walkVelocity = -1;  // 持续向后 Continuous backward (only in corridor view)
                } else if (sceneState === 'elevator') {
                    walkVelocity = -1;  // 电梯内也可以后退 Also allow backward in elevator
                }
            }
        });

        // 松开按键停止走路 Release key to stop walking
        window.addEventListener('keyup', (e) => {
            const key = e.key;

            if (key === 'ArrowUp' || key === 'w' || key === 'W') {
                if (sceneState === 'corridor1' && viewMode === 'corridor') {
                    if (walkVelocity > 0) walkVelocity = 0;  // 停止前进 Stop forward
                } else if (sceneState === 'elevator') {
                    if (walkVelocity > 0) walkVelocity = 0;  // 停止前进 Stop forward
                }
            }

            if (key === 'ArrowDown' || key === 's' || key === 'S') {
                if (sceneState === 'corridor1' && viewMode === 'corridor') {
                    if (walkVelocity < 0) walkVelocity = 0;  // 停止后退 Stop backward
                } else if (sceneState === 'elevator') {
                    if (walkVelocity < 0) walkVelocity = 0;  // 停止后退 Stop backward
                }
            }
        });
    </script>
