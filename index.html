<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画廊式电梯 - Gallery Elevator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            height: 100vh;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        canvas {
            display: block;
            cursor: crosshair;
        }
    </style>
</head>
<body>
    <canvas id="elevator"></canvas>
    <script>
        'use strict';

        // ========== 配置和常量 ==========
        const STATE = {
            IDLE: 'IDLE',
            MOVING: 'MOVING',
            DOOR_OPENING: 'DOOR_OPENING',
            DOOR_OPEN: 'DOOR_OPEN',
            DOOR_CLOSING: 'DOOR_CLOSING'
        };

        const CONFIG = {
            vanishingPoint: { x: 0.5, y: 0.5 }, // 消失点位置（屏幕比例）
            eyeHeight: 0.5, // 视线高度（屏幕比例）
            cabinDepth: 0.15, // 电梯厢深度（短浅箱体，非走廊）
            doorWidthRatio: 0.38, // 门宽度占屏幕比例（双门总宽）
            floorVisible: 0.22, // 地板可见高度比例
            ceilingVisible: 0.15 // 天花板可见高度比例
        };

        // ========== 画布设置 ==========
        const canvas = document.getElementById('elevator');
        const ctx = canvas.getContext('2d');
        let W, H, VP_X, VP_Y; // 画布尺寸和消失点坐标

        function resizeCanvas() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
            VP_X = W * CONFIG.vanishingPoint.x;
            VP_Y = H * CONFIG.vanishingPoint.y;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // ========== 电梯厢几何定义 ==========
        // 定义短浅封闭式电梯厢（非走廊）
        function getCabinGeometry() {
            // 地板和天花板的屏幕位置
            const floorY = H * (1 - CONFIG.floorVisible);
            const ceilingY = H * CONFIG.ceilingVisible;
            const cabinHeight = floorY - ceilingY;

            // 前墙（门所在墙面）宽度
            const frontWallWidth = W * CONFIG.doorWidthRatio;
            const frontWallLeft = VP_X - frontWallWidth / 2;
            const frontWallRight = VP_X + frontWallWidth / 2;

            // 观察者位置（后方）的宽度 - 仅略宽于前墙，形成短箱体
            const viewerWallWidth = frontWallWidth * (1 + CONFIG.cabinDepth);
            const viewerWallLeft = VP_X - viewerWallWidth / 2;
            const viewerWallRight = VP_X + viewerWallWidth / 2;

            return {
                floorY,
                ceilingY,
                cabinHeight,
                frontWallWidth,
                frontWallLeft,
                frontWallRight,
                viewerWallWidth,
                viewerWallLeft,
                viewerWallRight
            };
        }

        // ========== 电梯状态机 ==========
        class Elevator {
            constructor() {
                this.currentFloor = 1;
                this.displayFloor = 1;
                this.targetQueue = [];
                this.state = STATE.IDLE;
                this.doorProgress = 0; // 0=关闭, 1=打开
                this.stateTimer = 0;
                this.moveTimer = 0;
                this.floorChangeTimer = 0;
                this.vibration = 0;

                // 按钮配置
                this.buttons = [
                    { floor: 5, active: false },
                    { floor: 4, active: false },
                    { floor: 3, active: false },
                    { floor: 2, active: false },
                    { floor: 1, active: false }
                ];
            }

            update(dt) {
                this.stateTimer += dt;

                switch(this.state) {
                    case STATE.IDLE:
                        this.doorProgress = 0;
                        this.vibration = 0;
                        if (this.targetQueue.length > 0) {
                            this.state = STATE.MOVING;
                            this.moveTimer = 0;
                            this.floorChangeTimer = 0;
                        }
                        break;

                    case STATE.MOVING:
                        this.moveTimer += dt;
                        // 轻微振动
                        this.vibration = Math.sin(this.moveTimer * 0.01) * 2;

                        if (this.moveTimer > 800) {
                            const target = this.targetQueue[0];

                            if (this.displayFloor < target) {
                                this.displayFloor++;
                                this.floorChangeTimer = 0;
                            } else if (this.displayFloor > target) {
                                this.displayFloor--;
                                this.floorChangeTimer = 0;
                            }

                            this.moveTimer = 0;

                            if (this.displayFloor === target) {
                                this.currentFloor = target;
                                this.targetQueue.shift();
                                this.state = STATE.DOOR_OPENING;
                                this.stateTimer = 0;
                                this.vibration = 0;

                                this.buttons.forEach(btn => {
                                    if (btn.floor === target) btn.active = false;
                                });
                            }
                        }
                        break;

                    case STATE.DOOR_OPENING:
                        this.doorProgress = Math.min(1, this.doorProgress + dt / 1000);
                        if (this.doorProgress >= 1) {
                            this.state = STATE.DOOR_OPEN;
                            this.stateTimer = 0;
                        }
                        break;

                    case STATE.DOOR_OPEN:
                        this.doorProgress = 1;
                        if (this.stateTimer > 2000) {
                            this.state = STATE.DOOR_CLOSING;
                            this.stateTimer = 0;
                        }
                        break;

                    case STATE.DOOR_CLOSING:
                        this.doorProgress = Math.max(0, this.doorProgress - dt / 1000);
                        if (this.doorProgress <= 0) {
                            this.state = STATE.IDLE;
                            this.stateTimer = 0;
                        }
                        break;
                }

                this.floorChangeTimer += dt;
            }

            addTarget(floor) {
                if (floor !== this.currentFloor && !this.targetQueue.includes(floor)) {
                    this.targetQueue.push(floor);
                    this.buttons.forEach(btn => {
                        if (btn.floor === floor) btn.active = true;
                    });
                }
            }

            getStatusText() {
                switch(this.state) {
                    case STATE.IDLE: return 'Select a floor';
                    case STATE.MOVING: return 'Moving...';
                    case STATE.DOOR_OPENING: return `Arriving floor ${this.currentFloor}`;
                    case STATE.DOOR_OPEN: return `Floor ${this.currentFloor}`;
                    case STATE.DOOR_CLOSING: return 'Closing...';
                    default: return '';
                }
            }
        }

        // ========== 场景渲染 ==========
        class Scene {
            constructor() {
                this.elevator = new Elevator();
            }

            // 绘制地板（短浅抛光瓷砖）
            drawFloor() {
                const geo = getCabinGeometry();
                ctx.save();
                ctx.translate(0, this.elevator.vibration);

                // 地板梯形 - 短浅透视
                const floorTopY = geo.floorY - geo.cabinHeight * 0.05; // 地板前沿（靠近门）
                const floorBottomY = H; // 地板后沿（屏幕底部）

                // 主地板 - 浅灰色瓷砖
                const floorGrad = ctx.createLinearGradient(0, floorTopY, 0, floorBottomY);
                floorGrad.addColorStop(0, '#4a4a4a');
                floorGrad.addColorStop(0.5, '#3a3a3a');
                floorGrad.addColorStop(1, '#2a2a2a');

                ctx.fillStyle = floorGrad;
                ctx.beginPath();
                ctx.moveTo(geo.viewerWallLeft, floorBottomY);
                ctx.lineTo(geo.viewerWallRight, floorBottomY);
                ctx.lineTo(geo.frontWallRight, floorTopY);
                ctx.lineTo(geo.frontWallLeft, floorTopY);
                ctx.closePath();
                ctx.fill();

                // 地板边缘深色装饰条（左右两侧）
                const borderWidth = geo.frontWallWidth * 0.08;

                // 左侧边条
                ctx.fillStyle = '#1a1a1a';
                ctx.beginPath();
                ctx.moveTo(geo.viewerWallLeft, floorBottomY);
                ctx.lineTo(geo.viewerWallLeft + borderWidth, floorBottomY);
                ctx.lineTo(geo.frontWallLeft + borderWidth * 0.7, floorTopY);
                ctx.lineTo(geo.frontWallLeft, floorTopY);
                ctx.closePath();
                ctx.fill();

                // 右侧边条
                ctx.beginPath();
                ctx.moveTo(geo.viewerWallRight, floorBottomY);
                ctx.lineTo(geo.viewerWallRight - borderWidth, floorBottomY);
                ctx.lineTo(geo.frontWallRight - borderWidth * 0.7, floorTopY);
                ctx.lineTo(geo.frontWallRight, floorTopY);
                ctx.closePath();
                ctx.fill();

                // 地板抛光反光（门下方区域）
                const shineGrad = ctx.createRadialGradient(
                    VP_X, floorTopY + 30, 0,
                    VP_X, floorTopY + 30, geo.frontWallWidth * 0.4
                );
                shineGrad.addColorStop(0, 'rgba(255, 255, 255, 0.12)');
                shineGrad.addColorStop(0.7, 'rgba(255, 255, 255, 0.04)');
                shineGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.fillStyle = shineGrad;
                ctx.beginPath();
                ctx.arc(VP_X, floorTopY + 30, geo.frontWallWidth * 0.4, 0, Math.PI * 2);
                ctx.fill();

                // 地板细微纹理线（简单的几何分割）
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.15)';
                ctx.lineWidth = 1;
                // 中央纵向分割线
                ctx.beginPath();
                ctx.moveTo(VP_X, floorTopY);
                ctx.lineTo(VP_X, floorBottomY);
                ctx.stroke();

                ctx.restore();
            }

            // 绘制天花板（平面无大灯）
            drawCeiling() {
                const geo = getCabinGeometry();
                ctx.save();
                ctx.translate(0, this.elevator.vibration);

                // 天花板梯形 - 短浅透视
                const ceilTopY = 0; // 屏幕顶部
                const ceilBottomY = geo.ceilingY + geo.cabinHeight * 0.05; // 天花板前沿

                // 天花板主体 - 深灰色，中央稍亮
                const ceilGrad = ctx.createLinearGradient(0, ceilTopY, 0, ceilBottomY);
                ceilGrad.addColorStop(0, '#2a2a2a');
                ceilGrad.addColorStop(0.6, '#3a3a3a');
                ceilGrad.addColorStop(1, '#2a2a2a');

                ctx.fillStyle = ceilGrad;
                ctx.beginPath();
                ctx.moveTo(geo.viewerWallLeft, ceilTopY);
                ctx.lineTo(geo.viewerWallRight, ceilTopY);
                ctx.lineTo(geo.frontWallRight, ceilBottomY);
                ctx.lineTo(geo.frontWallLeft, ceilBottomY);
                ctx.closePath();
                ctx.fill();

                // 可选：两个小射灯（非大顶灯）
                const spotPositions = [
                    { x: geo.frontWallLeft + geo.frontWallWidth * 0.25, y: ceilBottomY - 20 },
                    { x: geo.frontWallRight - geo.frontWallWidth * 0.25, y: ceilBottomY - 20 }
                ];

                spotPositions.forEach(spot => {
                    // 小射灯外壳
                    ctx.fillStyle = '#1a1a1a';
                    ctx.beginPath();
                    ctx.arc(spot.x, spot.y, 8, 0, Math.PI * 2);
                    ctx.fill();

                    // 灯光中心
                    ctx.fillStyle = '#f5f5dc';
                    ctx.beginPath();
                    ctx.arc(spot.x, spot.y, 4, 0, Math.PI * 2);
                    ctx.fill();

                    // 小光晕
                    const haloGrad = ctx.createRadialGradient(spot.x, spot.y, 0, spot.x, spot.y, 30);
                    haloGrad.addColorStop(0, 'rgba(255, 248, 220, 0.15)');
                    haloGrad.addColorStop(0.5, 'rgba(255, 248, 220, 0.05)');
                    haloGrad.addColorStop(1, 'rgba(255, 248, 220, 0)');
                    ctx.fillStyle = haloGrad;
                    ctx.beginPath();
                    ctx.arc(spot.x, spot.y, 30, 0, Math.PI * 2);
                    ctx.fill();
                });

                // 天花板边缘装饰条
                ctx.strokeStyle = '#444';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(geo.frontWallLeft, ceilBottomY);
                ctx.lineTo(geo.frontWallRight, ceilBottomY);
                ctx.stroke();

                ctx.restore();
            }

            // 绘制左右墙壁（垂直封闭墙面）
            drawWalls() {
                const geo = getCabinGeometry();
                ctx.save();
                ctx.translate(0, this.elevator.vibration);

                const ceilTopY = 0;
                const ceilBottomY = geo.ceilingY + geo.cabinHeight * 0.05;
                const floorTopY = geo.floorY - geo.cabinHeight * 0.05;
                const floorBottomY = H;

                // === 左墙 - 暗木纹饰面 ===
                const leftWallGrad = ctx.createLinearGradient(0, VP_Y, geo.frontWallLeft, VP_Y);
                leftWallGrad.addColorStop(0, '#1a1a1a');
                leftWallGrad.addColorStop(0.35, '#2d2520'); // 暗木棕色
                leftWallGrad.addColorStop(0.65, '#3a3028');
                leftWallGrad.addColorStop(1, '#1a1a1a');

                ctx.fillStyle = leftWallGrad;
                ctx.beginPath();
                ctx.moveTo(geo.viewerWallLeft, ceilTopY);
                ctx.lineTo(geo.frontWallLeft, ceilBottomY);
                ctx.lineTo(geo.frontWallLeft, floorTopY);
                ctx.lineTo(geo.viewerWallLeft, floorBottomY);
                ctx.closePath();
                ctx.fill();

                // 左墙中央高光（暗示反光材质）
                const leftHighlight = ctx.createLinearGradient(
                    geo.viewerWallLeft, VP_Y,
                    geo.frontWallLeft, VP_Y
                );
                leftHighlight.addColorStop(0, 'rgba(255, 255, 255, 0)');
                leftHighlight.addColorStop(0.5, 'rgba(255, 255, 255, 0.06)');
                leftHighlight.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.fillStyle = leftHighlight;
                ctx.beginPath();
                ctx.moveTo(geo.viewerWallLeft, ceilTopY);
                ctx.lineTo(geo.frontWallLeft, ceilBottomY);
                ctx.lineTo(geo.frontWallLeft, floorTopY);
                ctx.lineTo(geo.viewerWallLeft, floorBottomY);
                ctx.closePath();
                ctx.fill();

                // 左墙前沿金属装饰条
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(geo.frontWallLeft, ceilBottomY);
                ctx.lineTo(geo.frontWallLeft, floorTopY);
                ctx.stroke();

                // === 右墙 - 对称设计 ===
                const rightWallGrad = ctx.createLinearGradient(geo.frontWallRight, VP_Y, W, VP_Y);
                rightWallGrad.addColorStop(0, '#1a1a1a');
                rightWallGrad.addColorStop(0.35, '#2d2520');
                rightWallGrad.addColorStop(0.65, '#3a3028');
                rightWallGrad.addColorStop(1, '#1a1a1a');

                ctx.fillStyle = rightWallGrad;
                ctx.beginPath();
                ctx.moveTo(geo.frontWallRight, ceilBottomY);
                ctx.lineTo(geo.viewerWallRight, ceilTopY);
                ctx.lineTo(geo.viewerWallRight, floorBottomY);
                ctx.lineTo(geo.frontWallRight, floorTopY);
                ctx.closePath();
                ctx.fill();

                // 右墙中央高光
                const rightHighlight = ctx.createLinearGradient(
                    geo.frontWallRight, VP_Y,
                    W, VP_Y
                );
                rightHighlight.addColorStop(0, 'rgba(255, 255, 255, 0)');
                rightHighlight.addColorStop(0.5, 'rgba(255, 255, 255, 0.06)');
                rightHighlight.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.fillStyle = rightHighlight;
                ctx.beginPath();
                ctx.moveTo(geo.frontWallRight, ceilBottomY);
                ctx.lineTo(geo.viewerWallRight, ceilTopY);
                ctx.lineTo(geo.viewerWallRight, floorBottomY);
                ctx.lineTo(geo.frontWallRight, floorTopY);
                ctx.closePath();
                ctx.fill();

                // 右墙前沿金属装饰条
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(geo.frontWallRight, ceilBottomY);
                ctx.lineTo(geo.frontWallRight, floorTopY);
                ctx.stroke();

                // 右墙装饰面板（对称于左侧按钮面板）
                this.drawRightWallDecoration(geo);

                ctx.restore();
            }

            // 右墙装饰元素（镜面或信息板）
            drawRightWallDecoration(geo) {
                const panelX = geo.viewerWallRight - (geo.viewerWallRight - geo.frontWallRight) * 0.25;
                const panelY = VP_Y - geo.cabinHeight * 0.15;
                const panelW = geo.frontWallWidth * 0.12;
                const panelH = geo.cabinHeight * 0.25;

                // 装饰面板阴影
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.fillRect(panelX + 3, panelY + 3, panelW, panelH);

                // 金属装饰板
                const decorGrad = ctx.createLinearGradient(panelX, panelY, panelX + panelW, panelY);
                decorGrad.addColorStop(0, '#2a2a2a');
                decorGrad.addColorStop(0.5, '#4a4a4a');
                decorGrad.addColorStop(1, '#2a2a2a');

                ctx.fillStyle = decorGrad;
                ctx.fillRect(panelX, panelY, panelW, panelH);

                // 边框
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 2;
                ctx.strokeRect(panelX, panelY, panelW, panelH);

                // 假装的装饰线条
                ctx.strokeStyle = '#666';
                ctx.lineWidth = 1;
                for (let i = 1; i <= 3; i++) {
                    const y = panelY + (panelH / 4) * i;
                    ctx.beginPath();
                    ctx.moveTo(panelX + panelW * 0.1, y);
                    ctx.lineTo(panelX + panelW * 0.9, y);
                    ctx.stroke();
                }
            }

            // 绘制前墙背景（门所在的墙面）
            drawFrontWall() {
                const geo = getCabinGeometry();
                ctx.save();
                ctx.translate(0, this.elevator.vibration);

                const ceilBottomY = geo.ceilingY + geo.cabinHeight * 0.05;
                const floorTopY = geo.floorY - geo.cabinHeight * 0.05;

                // 前墙背景 - 暗灰金属质感
                const wallGrad = ctx.createLinearGradient(0, ceilBottomY, 0, floorTopY);
                wallGrad.addColorStop(0, '#2a2a2a');
                wallGrad.addColorStop(0.5, '#3a3a3a');
                wallGrad.addColorStop(1, '#2a2a2a');

                ctx.fillStyle = wallGrad;
                ctx.fillRect(geo.frontWallLeft, ceilBottomY,
                            geo.frontWallWidth, floorTopY - ceilBottomY);

                // 前墙边缘暗线
                ctx.strokeStyle = '#1a1a1a';
                ctx.lineWidth = 2;
                ctx.strokeRect(geo.frontWallLeft, ceilBottomY,
                              geo.frontWallWidth, floorTopY - ceilBottomY);

                ctx.restore();
            }

            // 绘制门和门框（从地板到天花板）
            drawDoors() {
                const geo = getCabinGeometry();
                ctx.save();
                ctx.translate(0, this.elevator.vibration);

                // 门的尺寸 - 从消失点（地板/天花板相交处）延伸
                const singleDoorWidth = geo.frontWallWidth * 0.48; // 单扇门宽度
                const doorTop = VP_Y;
                const doorBottom = VP_Y;
                const doorHeight = geo.cabinHeight * 0.76; // 门高度

                const doorY = VP_Y - doorHeight / 2; // 门的顶部Y坐标
                const slideOffset = singleDoorWidth * this.elevator.doorProgress;

                const frameThick = 10;

                // 绘制门框（固定的，从接近地板到接近天花板）
                ctx.fillStyle = '#555';
                const frameDoorTop = VP_Y - doorHeight / 2 - frameThick;
                const frameDoorBottom = VP_Y + doorHeight / 2 + frameThick;

                // 顶部门框
                ctx.fillRect(geo.frontWallLeft - frameThick, frameDoorTop,
                            geo.frontWallWidth + frameThick * 2, frameThick);
                // 底部门框
                ctx.fillRect(geo.frontWallLeft - frameThick, frameDoorBottom - frameThick,
                            geo.frontWallWidth + frameThick * 2, frameThick);
                // 左侧门框
                ctx.fillRect(geo.frontWallLeft - frameThick, frameDoorTop,
                            frameThick, frameDoorBottom - frameDoorTop);
                // 右侧门框
                ctx.fillRect(geo.frontWallRight, frameDoorTop,
                            frameThick, frameDoorBottom - frameDoorTop);

                // 如果门打开，绘制外部场景
                if (this.elevator.doorProgress > 0) {
                    ctx.save();
                    const openingWidth = slideOffset * 2;
                    ctx.beginPath();
                    ctx.rect(VP_X - slideOffset, doorY, openingWidth, doorHeight);
                    ctx.clip();

                    // 外部走廊光线
                    const hallwayGrad = ctx.createLinearGradient(VP_X, doorY, VP_X, doorY + doorHeight);
                    hallwayGrad.addColorStop(0, '#d5d5d5');
                    hallwayGrad.addColorStop(0.5, '#f5f5f5');
                    hallwayGrad.addColorStop(1, '#d5d5d5');
                    ctx.fillStyle = hallwayGrad;
                    ctx.fillRect(VP_X - slideOffset, doorY, openingWidth, doorHeight);

                    // 绘制外部场景
                    this.drawExteriorScene(this.elevator.currentFloor, doorY, doorHeight);

                    ctx.restore();
                }

                // 左门 - 从中心向左滑动
                const leftDoorGrad = ctx.createLinearGradient(
                    VP_X - singleDoorWidth - slideOffset, doorY,
                    VP_X - slideOffset, doorY
                );
                leftDoorGrad.addColorStop(0, '#4a4a4a');
                leftDoorGrad.addColorStop(0.08, '#6a6a6a');
                leftDoorGrad.addColorStop(0.5, '#5a5a5a');
                leftDoorGrad.addColorStop(0.92, '#6a6a6a');
                leftDoorGrad.addColorStop(1, '#4a4a4a');

                ctx.fillStyle = leftDoorGrad;
                ctx.fillRect(VP_X - singleDoorWidth - slideOffset, doorY,
                            singleDoorWidth, doorHeight);

                // 左门装饰线
                ctx.strokeStyle = 'rgba(160, 160, 160, 0.4)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(VP_X - singleDoorWidth * 0.5 - slideOffset, doorY + 30);
                ctx.lineTo(VP_X - singleDoorWidth * 0.5 - slideOffset, doorY + doorHeight - 30);
                ctx.stroke();

                // 左门把手
                const handleWidth = singleDoorWidth * 0.12;
                const handleHeight = doorHeight * 0.06;
                const handleY = doorY + doorHeight * 0.48;
                ctx.fillStyle = '#2a2a2a';
                ctx.fillRect(VP_X - singleDoorWidth * 0.25 - slideOffset, handleY,
                            handleWidth, handleHeight);
                ctx.strokeStyle = '#444';
                ctx.lineWidth = 1;
                ctx.strokeRect(VP_X - singleDoorWidth * 0.25 - slideOffset, handleY,
                              handleWidth, handleHeight);

                // 右门 - 从中心向右滑动
                const rightDoorGrad = ctx.createLinearGradient(
                    VP_X + slideOffset, doorY,
                    VP_X + singleDoorWidth + slideOffset, doorY
                );
                rightDoorGrad.addColorStop(0, '#4a4a4a');
                rightDoorGrad.addColorStop(0.08, '#6a6a6a');
                rightDoorGrad.addColorStop(0.5, '#5a5a5a');
                rightDoorGrad.addColorStop(0.92, '#6a6a6a');
                rightDoorGrad.addColorStop(1, '#4a4a4a');

                ctx.fillStyle = rightDoorGrad;
                ctx.fillRect(VP_X + slideOffset, doorY,
                            singleDoorWidth, doorHeight);

                // 右门装饰线
                ctx.strokeStyle = 'rgba(160, 160, 160, 0.4)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(VP_X + singleDoorWidth * 0.5 + slideOffset, doorY + 30);
                ctx.lineTo(VP_X + singleDoorWidth * 0.5 + slideOffset, doorY + doorHeight - 30);
                ctx.stroke();

                // 右门把手
                ctx.fillStyle = '#2a2a2a';
                ctx.fillRect(VP_X + singleDoorWidth * 0.13 + slideOffset, handleY,
                            handleWidth, handleHeight);
                ctx.strokeStyle = '#444';
                ctx.lineWidth = 1;
                ctx.strokeRect(VP_X + singleDoorWidth * 0.13 + slideOffset, handleY,
                              handleWidth, handleHeight);

                // 中间门缝
                if (this.elevator.doorProgress < 1) {
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.moveTo(VP_X - slideOffset, doorY);
                    ctx.lineTo(VP_X - slideOffset, doorY + doorHeight);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(VP_X + slideOffset, doorY);
                    ctx.lineTo(VP_X + slideOffset, doorY + doorHeight);
                    ctx.stroke();
                }

                ctx.restore();
            }

            // 绘制外部场景装饰
            drawExteriorScene(floor, doorY, doorHeight) {
                ctx.fillStyle = '#666';
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                switch(floor) {
                    case 1:
                        ctx.fillText('LOBBY', VP_X, doorY + doorHeight * 0.3);
                        break;
                    case 2:
                        ctx.fillText('OFFICE', VP_X, doorY + doorHeight * 0.3);
                        break;
                    case 3:
                        ctx.fillText('GALLERY', VP_X, doorY + doorHeight * 0.3);
                        break;
                    case 4:
                        ctx.fillText('NEON', VP_X, doorY + doorHeight * 0.3);
                        break;
                    case 5:
                        ctx.fillText('ROOFTOP', VP_X, doorY + doorHeight * 0.3);
                        break;
                }
            }

            // 绘制楼层显示器（在门上方）
            drawFloorIndicator() {
                const geo = getCabinGeometry();
                ctx.save();
                ctx.translate(0, this.elevator.vibration);

                const indW = geo.frontWallWidth * 0.25;
                const indH = geo.cabinHeight * 0.08;
                const indX = VP_X - indW / 2;
                const indY = VP_Y - geo.cabinHeight * 0.48; // 在门上方

                // 显示器外壳
                ctx.fillStyle = '#2a2a2a';
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 2;
                ctx.fillRect(indX, indY, indW, indH);
                ctx.strokeRect(indX, indY, indW, indH);

                // 显示屏
                ctx.fillStyle = '#0a0a0a';
                ctx.fillRect(indX + 5, indY + 5, indW - 10, indH - 10);

                // LED数字闪烁效果
                let glowAlpha = 1;
                if (this.elevator.floorChangeTimer < 200) {
                    glowAlpha = 1 - (this.elevator.floorChangeTimer / 200) * 0.4;
                }

                ctx.fillStyle = `rgba(255, 200, 50, ${glowAlpha})`;
                ctx.font = `bold ${indH * 0.55}px monospace`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.elevator.displayFloor, VP_X, indY + indH / 2);

                // LED光晕
                const glowGrad = ctx.createRadialGradient(VP_X, indY + indH / 2, 0,
                                                         VP_X, indY + indH / 2, indH * 1.2);
                glowGrad.addColorStop(0, `rgba(255, 200, 50, ${glowAlpha * 0.25})`);
                glowGrad.addColorStop(1, 'rgba(255, 200, 50, 0)');
                ctx.fillStyle = glowGrad;
                ctx.fillRect(indX - indH, indY - indH / 2, indW + indH * 2, indH * 2);

                ctx.restore();
            }

            // 绘制按钮面板（安装在左墙上）
            drawButtonPanel() {
                const geo = getCabinGeometry();
                ctx.save();
                ctx.translate(0, this.elevator.vibration);

                // 面板位置 - 在左墙上，靠近观察者
                const panelX = geo.viewerWallLeft + (geo.frontWallLeft - geo.viewerWallLeft) * 0.25;
                const panelY = VP_Y - geo.cabinHeight * 0.25;
                const panelW = geo.frontWallWidth * 0.18;
                const panelH = geo.cabinHeight * 0.5;

                // 面板阴影（给一点3D深度感）
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.fillRect(panelX + 4, panelY + 4, panelW, panelH);

                // 面板主体
                const panelGrad = ctx.createLinearGradient(panelX, panelY, panelX + panelW, panelY);
                panelGrad.addColorStop(0, '#3a3a3a');
                panelGrad.addColorStop(0.1, '#4a4a4a');
                panelGrad.addColorStop(0.9, '#3a3a3a');
                panelGrad.addColorStop(1, '#2a2a2a');

                ctx.fillStyle = panelGrad;
                ctx.fillRect(panelX, panelY, panelW, panelH);

                // 面板边框
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 3;
                ctx.strokeRect(panelX, panelY, panelW, panelH);

                // 内侧边框装饰
                ctx.strokeStyle = '#666';
                ctx.lineWidth = 1;
                ctx.strokeRect(panelX + 6, panelY + 6, panelW - 12, panelH - 12);

                // 绘制5个楼层按钮
                const buttonRadius = Math.min(panelW * 0.22, panelH * 0.075);
                const buttonSpacing = panelH * 0.155;
                const startY = panelY + panelH * 0.18;

                this.elevator.buttons.forEach((btn, i) => {
                    const bx = panelX + panelW / 2;
                    const by = startY + i * buttonSpacing;

                    const isCurrent = btn.floor === this.elevator.currentFloor;
                    const isActive = btn.active;

                    // 按钮凹槽
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                    ctx.beginPath();
                    ctx.arc(bx, by, buttonRadius * 1.15, 0, Math.PI * 2);
                    ctx.fill();

                    // 按钮阴影
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                    ctx.beginPath();
                    ctx.arc(bx + 1.5, by + 1.5, buttonRadius, 0, Math.PI * 2);
                    ctx.fill();

                    // 按钮本体
                    const btnGrad = ctx.createRadialGradient(
                        bx - buttonRadius * 0.35, by - buttonRadius * 0.35, buttonRadius * 0.1,
                        bx, by, buttonRadius
                    );

                    if (isActive) {
                        btnGrad.addColorStop(0, '#ffe44d');
                        btnGrad.addColorStop(0.6, '#ffbb00');
                        btnGrad.addColorStop(1, '#cc9900');
                    } else {
                        btnGrad.addColorStop(0, '#6a6a6a');
                        btnGrad.addColorStop(0.6, '#4a4a4a');
                        btnGrad.addColorStop(1, '#2a2a2a');
                    }

                    ctx.fillStyle = btnGrad;
                    ctx.beginPath();
                    ctx.arc(bx, by, buttonRadius, 0, Math.PI * 2);
                    ctx.fill();

                    // 当前楼层指示灯
                    if (isCurrent) {
                        ctx.strokeStyle = '#00ff00';
                        ctx.lineWidth = 2.5;
                        ctx.beginPath();
                        ctx.arc(bx, by, buttonRadius * 1.05, 0, Math.PI * 2);
                        ctx.stroke();
                    }

                    // 按钮高光
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.arc(bx - buttonRadius * 0.25, by - buttonRadius * 0.25,
                           buttonRadius * 0.4, 0, Math.PI);
                    ctx.stroke();

                    // 激活时的光晕
                    if (isActive) {
                        const glowGrad = ctx.createRadialGradient(bx, by, buttonRadius,
                                                                 bx, by, buttonRadius * 2.2);
                        glowGrad.addColorStop(0, 'rgba(255, 200, 50, 0.35)');
                        glowGrad.addColorStop(1, 'rgba(255, 200, 50, 0)');
                        ctx.fillStyle = glowGrad;
                        ctx.beginPath();
                        ctx.arc(bx, by, buttonRadius * 2.2, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // 楼层数字
                    ctx.fillStyle = isActive ? '#000' : '#e0e0e0';
                    ctx.font = `bold ${buttonRadius * 1.1}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(btn.floor, bx, by + 1);

                    // 保存按钮位置用于点击检测
                    btn.screenPos = { x: bx, y: by, radius: buttonRadius * 1.3 };
                });

                ctx.restore();
            }

            // 绘制环境光效（柔和照明）
            drawAtmosphere() {
                const geo = getCabinGeometry();

                // 中央区域（门和指示器周围）稍亮
                const centerLight = ctx.createRadialGradient(VP_X, VP_Y, 0,
                                                             VP_X, VP_Y, Math.max(W, H) * 0.5);
                centerLight.addColorStop(0, 'rgba(255, 248, 220, 0.03)');
                centerLight.addColorStop(0.5, 'rgba(255, 248, 220, 0.01)');
                centerLight.addColorStop(1, 'rgba(0, 0, 0, 0)');

                ctx.fillStyle = centerLight;
                ctx.fillRect(0, 0, W, H);

                // 四角暗角效果
                const vignette = ctx.createRadialGradient(VP_X, VP_Y, Math.min(W, H) * 0.3,
                                                          VP_X, VP_Y, Math.max(W, H) * 0.8);
                vignette.addColorStop(0, 'rgba(0, 0, 0, 0)');
                vignette.addColorStop(0.7, 'rgba(0, 0, 0, 0.1)');
                vignette.addColorStop(1, 'rgba(0, 0, 0, 0.25)');

                ctx.fillStyle = vignette;
                ctx.fillRect(0, 0, W, H);
            }

            // 绘制状态文字
            drawStatusText() {
                ctx.fillStyle = 'rgba(220, 220, 220, 0.8)';
                ctx.font = '16px Arial';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                ctx.fillText(this.elevator.getStatusText(), 20, 20);

                if (this.elevator.targetQueue.length > 0) {
                    ctx.fillStyle = 'rgba(180, 180, 180, 0.8)';
                    ctx.font = '14px Arial';
                    ctx.fillText(`Queue: ${this.elevator.targetQueue.join(', ')}`, 20, H - 40);
                }
            }

            // 主渲染函数
            render() {
                // 清屏
                ctx.fillStyle = '#0a0a0a';
                ctx.fillRect(0, 0, W, H);

                // 绘制顺序（从后到前，构建封闭电梯厢）
                this.drawCeiling();        // 天花板
                this.drawFloor();          // 地板
                this.drawWalls();          // 左右侧墙
                this.drawFrontWall();      // 前墙背景
                this.drawDoors();          // 门和门框
                this.drawFloorIndicator(); // 楼层显示器
                this.drawButtonPanel();    // 按钮面板
                this.drawAtmosphere();     // 环境光效
                this.drawStatusText();     // 状态文字
            }
        }

        // ========== 主循环 ==========
        const scene = new Scene();
        let lastTime = performance.now();

        function animate(currentTime) {
            const deltaTime = currentTime - lastTime;
            lastTime = currentTime;

            scene.elevator.update(deltaTime);
            scene.render();

            requestAnimationFrame(animate);
        }

        animate(performance.now());

        // ========== 交互事件 ==========
        function handleClick(x, y) {
            if (scene.elevator.state === STATE.IDLE ||
                scene.elevator.state === STATE.DOOR_OPEN ||
                scene.elevator.state === STATE.MOVING) {

                scene.elevator.buttons.forEach(btn => {
                    if (btn.screenPos) {
                        const dx = x - btn.screenPos.x;
                        const dy = y - btn.screenPos.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < btn.screenPos.radius) {
                            scene.elevator.addTarget(btn.floor);
                            console.log('Floor selected:', btn.floor);
                        }
                    }
                });
            }
        }

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            handleClick(e.clientX - rect.left, e.clientY - rect.top);
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            handleClick(touch.clientX - rect.left, touch.clientY - rect.top);
        }, { passive: false });
    </script>
</body>
