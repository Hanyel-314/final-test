<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电梯体验 - Elevator Experience</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
        }
        body {
            width: 100vw;
            height: 100vh;
            background: #0a0a0a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        canvas {
            display: block;
        }
        #errorMsg {
            position: fixed;
            top: 10px;
            left: 10px;
            color: red;
            background: white;
            padding: 10px;
            display: none;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="errorMsg">检查控制台...</div>
    <script>
        console.log('Script started');

        // 电梯状态常量
        const STATE = {
            IDLE: 'IDLE',
            MOVING: 'MOVING',
            DOOR_OPENING: 'DOOR_OPENING',
            DOOR_OPEN: 'DOOR_OPEN',
            DOOR_CLOSING: 'DOOR_CLOSING'
        };

        // 电梯类
        class Elevator {
            constructor() {
                this.currentFloor = 1;
                this.displayFloor = 1;
                this.targetQueue = [];
                this.state = STATE.IDLE;
                this.doorProgress = 0;
                this.stateTimer = 0;
                this.movingTimer = 0;
                this.shakeOffset = 0;
                this.floorChangeTimer = 0;

                this.updateButtonPositions();
            }

            updateButtonPositions() {
                // 按钮位置 - 响应式（左侧，垂直居中）
                const panelX = width * 0.08;
                const startY = height * 0.25;
                const spacing = height * 0.08;

                this.buttons = [
                    { floor: 5, x: panelX, y: startY, active: false },
                    { floor: 4, x: panelX, y: startY + spacing, active: false },
                    { floor: 3, x: panelX, y: startY + spacing * 2, active: false },
                    { floor: 2, x: panelX, y: startY + spacing * 3, active: false },
                    { floor: 1, x: panelX, y: startY + spacing * 4, active: false }
                ];
            }

            update(dt) {
                this.stateTimer += dt;

                switch(this.state) {
                    case STATE.IDLE:
                        this.doorProgress = 0;
                        if (this.targetQueue.length > 0) {
                            this.state = STATE.MOVING;
                            this.movingTimer = 0;
                            this.floorChangeTimer = 0;
                        }
                        break;

                    case STATE.MOVING:
                        this.movingTimer += dt;
                        this.shakeOffset = Math.sin(this.movingTimer * 0.01) * 1.5;

                        if (this.movingTimer > 800) {
                            const target = this.targetQueue[0];

                            if (this.displayFloor < target) {
                                this.displayFloor++;
                                this.floorChangeTimer = 0;
                            } else if (this.displayFloor > target) {
                                this.displayFloor--;
                                this.floorChangeTimer = 0;
                            }

                            this.movingTimer = 0;

                            if (this.displayFloor === target) {
                                this.currentFloor = target;
                                this.targetQueue.shift();
                                this.state = STATE.DOOR_OPENING;
                                this.stateTimer = 0;
                                this.shakeOffset = 0;

                                this.buttons.forEach(btn => {
                                    if (btn.floor === target) {
                                        btn.active = false;
                                    }
                                });
                            }
                        }
                        break;

                    case STATE.DOOR_OPENING:
                        this.doorProgress = Math.min(1, this.doorProgress + dt / 800);
                        if (this.doorProgress >= 1) {
                            this.state = STATE.DOOR_OPEN;
                            this.stateTimer = 0;
                        }
                        break;

                    case STATE.DOOR_OPEN:
                        this.doorProgress = 1;
                        if (this.stateTimer > 1500) {
                            this.state = STATE.DOOR_CLOSING;
                            this.stateTimer = 0;
                        }
                        break;

                    case STATE.DOOR_CLOSING:
                        this.doorProgress = Math.max(0, this.doorProgress - dt / 800);
                        if (this.doorProgress <= 0) {
                            this.state = STATE.IDLE;
                            this.stateTimer = 0;
                        }
                        break;
                }

                this.floorChangeTimer += dt;
            }

            addTarget(floor) {
                if (floor !== this.currentFloor && !this.targetQueue.includes(floor)) {
                    this.targetQueue.push(floor);
                    this.buttons.forEach(btn => {
                        if (btn.floor === floor) {
                            btn.active = true;
                        }
                    });
                }
            }

            getStatusText() {
                switch(this.state) {
                    case STATE.IDLE:
                        return '点击左侧按钮选择楼层';
                    case STATE.MOVING:
                        return '电梯运行中...';
                    case STATE.DOOR_OPENING:
                    case STATE.DOOR_OPEN:
                        return `已到达 ${this.currentFloor} 层`;
                    case STATE.DOOR_CLOSING:
                        return '关门中...';
                    default:
                        return '';
                }
            }
        }

        // 全局变量
        let elevator;
        let lastTime = 0;

        function setup() {
            console.log('Setup called');
            try {
                // 全屏画布
                let canvas = createCanvas(windowWidth, windowHeight);
                console.log('Canvas created:', windowWidth, 'x', windowHeight);
                canvas.parent(document.body);
                elevator = new Elevator();
                textAlign(CENTER, CENTER);
                lastTime = millis();
                console.log('Setup complete');
            } catch(e) {
                console.error('Setup error:', e);
                document.getElementById('errorMsg').style.display = 'block';
                document.getElementById('errorMsg').textContent = 'Error: ' + e.message;
            }
        }

        // 窗口大小改变时重新调整
        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
            if (elevator) {
                elevator.updateButtonPositions();
            }
            console.log('Window resized:', windowWidth, 'x', windowHeight);
        }

        function draw() {
            try {
                const currentTime = millis();
                const deltaTime = currentTime - lastTime;
                lastTime = currentTime;

                if (!elevator) return;

                elevator.update(deltaTime);

                // 清除画布 - 深灰色背景
                background(30, 35, 40);

                // 绘制电梯内部
                drawCabin();

                // 绘制门和外部场景
                drawDoors();

                // 绘制按钮面板
                drawPanel();

                // 绘制楼层显示器
                drawFloorIndicator();

                // 绘制状态文字
                drawStatusText();

            } catch(e) {
                console.error('Draw error:', e);
                fill(255, 0, 0);
                text('Error: ' + e.message, width/2, height/2);
            }
        }

        function drawCabin() {
            push();

            // 响应式尺寸
            const centerX = width / 2;
            const topY = height * 0.05;
            const floorY = height * 0.75;

            // 顶灯
            fill(240, 240, 200, 200);
            noStroke();
            const lampW = width * 0.3;
            const lampH = height * 0.05;
            rect(centerX - lampW/2, topY, lampW, lampH, 5);

            // 顶部光源
            for (let i = 0; i < 5; i++) {
                let alpha = map(i, 0, 5, 80, 0);
                fill(255, 255, 220, alpha);
                ellipse(centerX, topY + lampH * 2, width * 0.8 - i * 50, height * 0.5 - i * 50);
            }

            // 左墙（响应式宽度）
            const leftWallW = width * 0.2;
            for (let x = 0; x < leftWallW; x += 3) {
                let c = 35;
                if (x > leftWallW * 0.3 && x < leftWallW * 0.7) c = 45;
                stroke(c, c + 5, c + 10);
                line(x, topY + lampH * 3, x, height);
            }

            // 右墙
            const rightWallStart = width - leftWallW;
            for (let x = rightWallStart; x < width; x += 3) {
                let c = 35;
                let relX = x - rightWallStart;
                if (relX > leftWallW * 0.3 && relX < leftWallW * 0.7) c = 45;
                stroke(c, c + 5, c + 10);
                line(x, topY + lampH * 3, x, height);
            }

            // 地板网格
            stroke(50, 55, 60);
            strokeWeight(1);
            const gridStartY = floorY;
            const gridLines = 10;
            for (let i = 0; i < gridLines; i++) {
                let y = gridStartY + (height - gridStartY) * i / gridLines;
                line(0, y, width, y);
            }
            for (let i = 0; i < 12; i++) {
                let x = width * i / 12;
                line(x, gridStartY, x, height);
            }

            pop();
        }

        function drawDoors() {
            push();
            translate(0, elevator.shakeOffset);

            const centerX = width / 2;
            const doorWidth = width * 0.22;
            const doorHeight = height * 0.55;
            const doorY = height * 0.15;
            const slideOffset = doorWidth * elevator.doorProgress;

            // 绘制外部场景（如果门打开）
            if (elevator.doorProgress > 0) {
                push();
                // 使用clip裁剪
                let ctx = drawingContext;
                ctx.save();
                ctx.beginPath();
                ctx.rect(centerX - slideOffset, doorY, slideOffset * 2, doorHeight);
                ctx.clip();

                // 绘制场景
                drawExteriorScene(elevator.currentFloor);

                ctx.restore();
                pop();
            }

            // 左门
            for (let x = 0; x < doorWidth; x += 2) {
                let c = 70;
                if (x > 10 && x < doorWidth - 10) c = 80;
                stroke(c, c + 5, c + 10);
                line(centerX - doorWidth - slideOffset + x, doorY,
                     centerX - doorWidth - slideOffset + x, doorY + doorHeight);
            }

            // 右门
            for (let x = 0; x < doorWidth; x += 2) {
                let c = 70;
                if (x > 10 && x < doorWidth - 10) c = 80;
                stroke(c, c + 5, c + 10);
                line(centerX + slideOffset + x, doorY,
                     centerX + slideOffset + x, doorY + doorHeight);
            }

            // 门缝
            if (elevator.doorProgress < 1) {
                stroke(10, 15, 20);
                strokeWeight(3);
                line(centerX - slideOffset, doorY, centerX - slideOffset, doorY + doorHeight);
                line(centerX + slideOffset, doorY, centerX + slideOffset, doorY + doorHeight);
            }

            pop();
        }

        function drawExteriorScene(floor) {
            switch(floor) {
                case 1: drawLobby(); break;
                case 2: drawOffice(); break;
                case 3: drawGallery(); break;
                case 4: drawNeon(); break;
                case 5: drawRooftop(); break;
            }
        }

        function drawLobby() {
            const centerX = width / 2;
            const sceneW = width * 0.5;
            const sceneLeft = centerX - sceneW / 2;

            background(45, 40, 35);

            // 简化的大堂场景
            fill(30, 25, 20);
            rect(sceneLeft, height * 0.2, sceneW * 0.3, height * 0.5);
            rect(sceneLeft + sceneW * 0.7, height * 0.2, sceneW * 0.3, height * 0.5);

            fill(40, 80, 40);
            ellipse(sceneLeft + sceneW * 0.15, height * 0.6, width * 0.05, height * 0.1);

            fill(200, 180, 150);
            textSize(height * 0.03);
            text('RECEPTION', centerX, height * 0.4);
        }

        function drawOffice() {
            const centerX = width / 2;
            const sceneW = width * 0.5;
            const sceneLeft = centerX - sceneW / 2;

            background(220, 225, 230);

            fill(180, 170, 160);
            rect(sceneLeft + sceneW * 0.1, height * 0.25, sceneW * 0.25, height * 0.3, 3);
            rect(sceneLeft + sceneW * 0.65, height * 0.25, sceneW * 0.25, height * 0.3, 3);

            fill(150, 180, 200, 100);
            rect(sceneLeft + sceneW * 0.13, height * 0.28, sceneW * 0.19, height * 0.1, 2);
            rect(sceneLeft + sceneW * 0.68, height * 0.28, sceneW * 0.19, height * 0.1, 2);
        }

        function drawGallery() {
            const centerX = width / 2;
            const sceneW = width * 0.5;
            const sceneLeft = centerX - sceneW / 2;

            background(35, 30, 40);

            // 左侧画框
            fill(20, 15, 25);
            rect(sceneLeft + sceneW * 0.1, height * 0.25, sceneW * 0.3, height * 0.2, 3);
            fill(180, 120, 80);
            rect(sceneLeft + sceneW * 0.13, height * 0.27, sceneW * 0.24, height * 0.16);

            // 右侧画框
            fill(20, 15, 25);
            rect(sceneLeft + sceneW * 0.6, height * 0.35, sceneW * 0.3, height * 0.2, 3);
            fill(80, 120, 180);
            rect(sceneLeft + sceneW * 0.63, height * 0.37, sceneW * 0.24, height * 0.16);
        }

        function drawNeon() {
            background(10, 5, 20);

            const centerX = width / 2;
            const sceneW = width * 0.5;
            const sceneLeft = centerX - sceneW / 2;

            strokeWeight(4);

            // 左侧蓝色光条
            stroke(100, 150, 255, 200);
            line(sceneLeft + sceneW * 0.1, height * 0.2, sceneLeft + sceneW * 0.1, height * 0.7);
            stroke(100, 150, 255, 100);
            strokeWeight(8);
            line(sceneLeft + sceneW * 0.1, height * 0.2, sceneLeft + sceneW * 0.1, height * 0.7);

            // 右侧紫色光条
            strokeWeight(4);
            stroke(200, 100, 255, 200);
            line(sceneLeft + sceneW * 0.9, height * 0.2, sceneLeft + sceneW * 0.9, height * 0.7);
            stroke(200, 100, 255, 100);
            strokeWeight(8);
            line(sceneLeft + sceneW * 0.9, height * 0.2, sceneLeft + sceneW * 0.9, height * 0.7);

            // 水平光条
            strokeWeight(3);
            stroke(150, 200, 255, 180);
            line(sceneLeft + sceneW * 0.2, height * 0.4, sceneLeft + sceneW * 0.8, height * 0.4);
        }

        function drawRooftop() {
            const centerX = width / 2;
            const sceneW = width * 0.5;
            const sceneLeft = centerX - sceneW / 2;

            // 天空渐变
            for (let y = height * 0.15; y < height * 0.7; y += 5) {
                let c = map(y, height * 0.15, height * 0.7, 30, 60);
                stroke(c, c, c + 20);
                line(sceneLeft, y, sceneLeft + sceneW, y);
            }

            // 星星
            for (let i = 0; i < 15; i++) {
                let x = sceneLeft + (i * 23) % sceneW;
                let y = height * 0.2 + (i * 37) % (height * 0.25);
                fill(255, 255, 220, 200);
                noStroke();
                ellipse(x, y, 2, 2);
            }

            // 建筑剪影
            fill(10, 10, 20, 180);
            rect(sceneLeft + sceneW * 0.05, height * 0.5, sceneW * 0.15, height * 0.2);
            rect(sceneLeft + sceneW * 0.25, height * 0.53, sceneW * 0.12, height * 0.17);
            rect(sceneLeft + sceneW * 0.45, height * 0.48, sceneW * 0.18, height * 0.22);
            rect(sceneLeft + sceneW * 0.7, height * 0.52, sceneW * 0.13, height * 0.18);
        }

        function drawPanel() {
            push();

            // 响应式面板
            const panelX = width * 0.04;
            const panelY = height * 0.2;
            const panelW = width * 0.1;
            const panelH = height * 0.5;

            // 面板背景
            fill(40, 45, 50);
            stroke(60, 65, 70);
            strokeWeight(2);
            rect(panelX, panelY, panelW, panelH, 8);

            // 绘制按钮
            const buttonSize = Math.min(width * 0.06, height * 0.06);

            elevator.buttons.forEach(btn => {
                const isCurrent = btn.floor === elevator.currentFloor;
                const isActive = btn.active;

                // 按钮
                if (isActive) {
                    fill(255, 200, 50);
                    stroke(255, 220, 100);
                    strokeWeight(2);
                } else if (isCurrent) {
                    fill(60, 65, 70);
                    stroke(100, 200, 100);
                    strokeWeight(2);
                } else {
                    fill(60, 65, 70);
                    stroke(80, 85, 90);
                    strokeWeight(1);
                }

                ellipse(btn.x, btn.y, buttonSize, buttonSize);

                // 发光
                if (isActive) {
                    noStroke();
                    fill(255, 200, 50, 50);
                    ellipse(btn.x, btn.y, buttonSize * 1.2, buttonSize * 1.2);
                }

                // 数字
                noStroke();
                fill(isActive ? 40 : 220);
                textSize(buttonSize * 0.5);
                text(btn.floor, btn.x, btn.y);

                // 当前楼层指示
                if (isCurrent && !isActive) {
                    fill(100, 255, 100);
                    ellipse(btn.x + buttonSize * 0.45, btn.y - buttonSize * 0.45, buttonSize * 0.12, buttonSize * 0.12);
                }
            });

            pop();
        }

        function drawFloorIndicator() {
            push();
            translate(0, elevator.shakeOffset);

            const centerX = width / 2;
            const indicatorW = width * 0.12;
            const indicatorH = height * 0.06;
            const indicatorY = height * 0.08;

            // 外框
            fill(20, 25, 30);
            stroke(60, 65, 70);
            strokeWeight(3);
            rect(centerX - indicatorW/2, indicatorY, indicatorW, indicatorH, 5);

            // 屏幕
            fill(10, 15, 20);
            noStroke();
            rect(centerX - indicatorW/2 + indicatorW * 0.05, indicatorY + indicatorH * 0.1,
                 indicatorW * 0.9, indicatorH * 0.8, 3);

            // 数字
            let glowAlpha = 255;
            if (elevator.floorChangeTimer < 200) {
                glowAlpha = 255 - (elevator.floorChangeTimer / 200) * 100;
            }

            const fontSize = indicatorH * 0.7;

            fill(255, 210, 90, glowAlpha * 0.3);
            textSize(fontSize * 1.2);
            text(elevator.displayFloor, centerX, indicatorY + indicatorH/2);

            fill(255, 210, 90, glowAlpha * 0.6);
            textSize(fontSize * 1.1);
            text(elevator.displayFloor, centerX, indicatorY + indicatorH/2);

            fill(255, 210, 90, glowAlpha);
            textSize(fontSize);
            text(elevator.displayFloor, centerX, indicatorY + indicatorH/2);

            pop();
        }

        function drawStatusText() {
            push();

            fill(180, 185, 190);
            textSize(Math.min(width * 0.018, height * 0.022));
            textAlign(LEFT, TOP);
            noStroke();
            text(elevator.getStatusText(), width * 0.02, height * 0.02);

            if (elevator.targetQueue.length > 0) {
                textSize(Math.min(width * 0.015, height * 0.018));
                fill(150, 155, 160);
                text(`队列: ${elevator.targetQueue.join(', ')}`, width * 0.02, height * 0.95);
            }

            pop();
        }

        function mousePressed() {
            handleClick(mouseX, mouseY);
        }

        function touchStarted() {
            if (touches.length > 0) {
                handleClick(touches[0].x, touches[0].y);
            }
            return false;
        }

        function handleClick(x, y) {
            if (elevator.state === STATE.IDLE ||
                elevator.state === STATE.DOOR_OPEN ||
                elevator.state === STATE.MOVING) {

                const buttonSize = Math.min(width * 0.06, height * 0.06);

                elevator.buttons.forEach(btn => {
                    const d = dist(x, y, btn.x, btn.y);
                    if (d < buttonSize / 2) {
                        elevator.addTarget(btn.floor);
                        console.log('Button clicked:', btn.floor);
                    }
                });
            }
        }

        // 错误处理
        window.addEventListener('error', function(e) {
            console.error('Global error:', e.error);
            document.getElementById('errorMsg').style.display = 'block';
            document.getElementById('errorMsg').textContent = 'Error: ' + e.message;
        });
    </script>
</body>
</html>
