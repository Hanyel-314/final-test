<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D电梯体验 - 3D Elevator Experience</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
        }
        body {
            width: 100vw;
            height: 100vh;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            cursor: crosshair;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <script>
        console.log('3D Elevator started');

        // ========== 状态常量 ==========
        const STATE = {
            IDLE: 'IDLE',
            MOVING: 'MOVING',
            DOOR_OPENING: 'DOOR_OPENING',
            DOOR_OPEN: 'DOOR_OPEN',
            DOOR_CLOSING: 'DOOR_CLOSING'
        };

        // ========== 3D相机和投影 ==========
        class Camera {
            constructor() {
                this.pos = { x: 0, y: 0, z: -2.5 }; // 相机位置（电梯内部后方）
                this.yaw = 0;   // 左右旋转（鼠标x）
                this.pitch = 0; // 上下旋转（鼠标y）
                this.fov = 60;  // 视场角
                this.near = 0.1;
                this.far = 100;
            }

            // 3D点投影到2D屏幕
            project(x, y, z) {
                // 应用相机旋转
                let dx = x - this.pos.x;
                let dy = y - this.pos.y;
                let dz = z - this.pos.z;

                // 简单旋转（yaw和pitch）
                let cosYaw = Math.cos(this.yaw);
                let sinYaw = Math.sin(this.yaw);
                let cosPitch = Math.cos(this.pitch);
                let sinPitch = Math.sin(this.pitch);

                // 先绕Y轴旋转（yaw）
                let tx = dx * cosYaw + dz * sinYaw;
                let tz = -dx * sinYaw + dz * cosYaw;
                dx = tx;
                dz = tz;

                // 再绕X轴旋转（pitch）
                let ty = dy * cosPitch - dz * sinPitch;
                tz = dy * sinPitch + dz * cosPitch;
                dy = ty;
                dz = tz;

                // 透视投影
                if (dz <= this.near) dz = this.near + 0.01;

                let scale = (width / 2) / Math.tan((this.fov * Math.PI / 180) / 2);
                let screenX = (dx * scale / dz) + width / 2;
                let screenY = (-dy * scale / dz) + height / 2;

                return { x: screenX, y: screenY, z: dz };
            }

            updateFromMouse(mx, my) {
                // 鼠标位置映射到角度（±5度）
                let maxAngle = 0.087; // 约5度
                this.yaw = ((mx / width) - 0.5) * 2 * maxAngle;
                this.pitch = ((my / height) - 0.5) * 2 * maxAngle;
            }

            addVibration(amount) {
                this.pos.y += amount;
            }
        }

        // ========== 电梯类（保持原有逻辑）==========
        class Elevator {
            constructor() {
                this.currentFloor = 1;
                this.displayFloor = 1;
                this.targetQueue = [];
                this.state = STATE.IDLE;
                this.doorProgress = 0;
                this.stateTimer = 0;
                this.movingTimer = 0;
                this.shakeOffset = 0;
                this.floorChangeTimer = 0;

                this.buttons = [
                    { floor: 5, active: false },
                    { floor: 4, active: false },
                    { floor: 3, active: false },
                    { floor: 2, active: false },
                    { floor: 1, active: false }
                ];
            }

            update(dt) {
                this.stateTimer += dt;

                switch(this.state) {
                    case STATE.IDLE:
                        this.doorProgress = 0;
                        if (this.targetQueue.length > 0) {
                            this.state = STATE.MOVING;
                            this.movingTimer = 0;
                            this.floorChangeTimer = 0;
                        }
                        break;

                    case STATE.MOVING:
                        this.movingTimer += dt;
                        this.shakeOffset = Math.sin(this.movingTimer * 0.01) * 0.02;

                        if (this.movingTimer > 800) {
                            const target = this.targetQueue[0];

                            if (this.displayFloor < target) {
                                this.displayFloor++;
                                this.floorChangeTimer = 0;
                            } else if (this.displayFloor > target) {
                                this.displayFloor--;
                                this.floorChangeTimer = 0;
                            }

                            this.movingTimer = 0;

                            if (this.displayFloor === target) {
                                this.currentFloor = target;
                                this.targetQueue.shift();
                                this.state = STATE.DOOR_OPENING;
                                this.stateTimer = 0;
                                this.shakeOffset = 0;

                                this.buttons.forEach(btn => {
                                    if (btn.floor === target) btn.active = false;
                                });
                            }
                        }
                        break;

                    case STATE.DOOR_OPENING:
                        this.doorProgress = Math.min(1, this.doorProgress + dt / 800);
                        if (this.doorProgress >= 1) {
                            this.state = STATE.DOOR_OPEN;
                            this.stateTimer = 0;
                        }
                        break;

                    case STATE.DOOR_OPEN:
                        this.doorProgress = 1;
                        if (this.stateTimer > 1500) {
                            this.state = STATE.DOOR_CLOSING;
                            this.stateTimer = 0;
                        }
                        break;

                    case STATE.DOOR_CLOSING:
                        this.doorProgress = Math.max(0, this.doorProgress - dt / 800);
                        if (this.doorProgress <= 0) {
                            this.state = STATE.IDLE;
                            this.stateTimer = 0;
                        }
                        break;
                }

                this.floorChangeTimer += dt;
            }

            addTarget(floor) {
                if (floor !== this.currentFloor && !this.targetQueue.includes(floor)) {
                    this.targetQueue.push(floor);
                    this.buttons.forEach(btn => {
                        if (btn.floor === floor) btn.active = true;
                    });
                }
            }

            getStatusText() {
                switch(this.state) {
                    case STATE.IDLE: return '点击左侧按钮选择楼层';
                    case STATE.MOVING: return '电梯运行中...';
                    case STATE.DOOR_OPENING:
                    case STATE.DOOR_OPEN: return `已到达 ${this.currentFloor} 层`;
                    case STATE.DOOR_CLOSING: return '关门中...';
                    default: return '';
                }
            }
        }

        // ========== 3D绘制辅助函数 ==========
        function drawQuad3D(cam, v1, v2, v3, v4, color, doStroke = false) {
            let p1 = cam.project(v1.x, v1.y, v1.z);
            let p2 = cam.project(v2.x, v2.y, v2.z);
            let p3 = cam.project(v3.x, v3.y, v3.z);
            let p4 = cam.project(v4.x, v4.y, v4.z);

            fill(color);
            if (doStroke) {
                stroke(0, 0, 0, 100);
                strokeWeight(1);
            } else {
                noStroke();
            }

            beginShape();
            vertex(p1.x, p1.y);
            vertex(p2.x, p2.y);
            vertex(p3.x, p3.y);
            vertex(p4.x, p4.y);
            endShape(CLOSE);
        }

        function drawLine3D(cam, v1, v2, col, weight = 1) {
            let p1 = cam.project(v1.x, v1.y, v1.z);
            let p2 = cam.project(v2.x, v2.y, v2.z);
            stroke(col);
            strokeWeight(weight);
            line(p1.x, p1.y, p2.x, p2.y);
        }

        // 简单Lambert着色（法向量dot光源方向）
        function getLambertColor(normal, lightDir, baseColor) {
            let dot = Math.max(0, normal.x * lightDir.x + normal.y * lightDir.y + normal.z * lightDir.z);
            let brightness = 0.3 + dot * 0.7; // 环境光0.3 + 漫反射0.7
            return color(
                red(baseColor) * brightness,
                green(baseColor) * brightness,
                blue(baseColor) * brightness
            );
        }

        // ========== 全局变量 ==========
        let elevator;
        let camera;
        let lastTime = 0;
        let mouseXSmooth = 0;
        let mouseYSmooth = 0;

        // 光源方向（从上方照射）
        const lightDir = { x: 0, y: -1, z: 0 };

        function setup() {
            createCanvas(windowWidth, windowHeight);
            elevator = new Elevator();
            camera = new Camera();
            textAlign(CENTER, CENTER);
            lastTime = millis();

            mouseXSmooth = width / 2;
            mouseYSmooth = height / 2;
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }

        function draw() {
            const currentTime = millis();
            const deltaTime = currentTime - lastTime;
            lastTime = currentTime;

            if (!elevator) return;

            elevator.update(deltaTime);

            // 平滑鼠标移动
            mouseXSmooth = lerp(mouseXSmooth, mouseX, 0.1);
            mouseYSmooth = lerp(mouseYSmooth, mouseY, 0.1);
            camera.updateFromMouse(mouseXSmooth, mouseYSmooth);

            // 电梯运行时的振动
            if (elevator.state === STATE.MOVING) {
                camera.addVibration(elevator.shakeOffset);
            }

            // 清屏
            background(5, 8, 12);

            // 绘制3D场景
            draw3DCabin();
            draw3DDoors();
            draw3DButtonPanel();
            drawFloorIndicator();
            drawStatusText();

            // 恢复相机振动
            if (elevator.state === STATE.MOVING) {
                camera.pos.y -= elevator.shakeOffset;
            }
        }

        // ========== 绘制3D电梯舱 ==========
        function draw3DCabin() {
            // 电梯舱尺寸（3D坐标）
            const w = 2;    // 宽度
            const h = 3;    // 高度
            const d = 4;    // 深度

            const left = -w;
            const right = w;
            const bottom = -h/2;
            const top = h/2;
            const back = d;
            const front = 0;

            // === 地板（带透视网格）===
            push();
            let floorNormal = { x: 0, y: 1, z: 0 };
            let floorColor = getLambertColor(floorNormal, lightDir, color(30, 35, 40));

            // 地板主体
            drawQuad3D(camera,
                { x: left, y: bottom, z: front },
                { x: right, y: bottom, z: front },
                { x: right, y: bottom, z: back },
                { x: left, y: bottom, z: back },
                floorColor
            );

            // 地板网格
            stroke(50, 55, 60, 150);
            strokeWeight(1);
            for (let i = 0; i <= 10; i++) {
                let zPos = front + (back - front) * i / 10;
                drawLine3D(camera,
                    { x: left, y: bottom, z: zPos },
                    { x: right, y: bottom, z: zPos },
                    color(50, 55, 60, 150)
                );
            }
            for (let i = 0; i <= 8; i++) {
                let xPos = left + (right - left) * i / 8;
                drawLine3D(camera,
                    { x: xPos, y: bottom, z: front },
                    { x: xPos, y: bottom, z: back },
                    color(50, 55, 60, 150)
                );
            }
            pop();

            // === 天花板（带灯光面板）===
            push();
            let ceilNormal = { x: 0, y: -1, z: 0 };
            let ceilColor = getLambertColor(ceilNormal, lightDir, color(40, 45, 50));

            drawQuad3D(camera,
                { x: left, y: top, z: back },
                { x: right, y: top, z: back },
                { x: right, y: top, z: front },
                { x: left, y: top, z: front },
                ceilColor
            );

            // 天花板灯光面板（发光）
            let lightPanel = {
                x1: -0.6, x2: 0.6,
                y: top - 0.05,
                z1: 1.5, z2: 2.5
            };

            drawQuad3D(camera,
                { x: lightPanel.x1, y: lightPanel.y, z: lightPanel.z1 },
                { x: lightPanel.x2, y: lightPanel.y, z: lightPanel.z1 },
                { x: lightPanel.x2, y: lightPanel.y, z: lightPanel.z2 },
                { x: lightPanel.x1, y: lightPanel.y, z: lightPanel.z2 },
                color(240, 240, 220, 200)
            );

            // 灯光光晕
            noStroke();
            let centerX = (lightPanel.x1 + lightPanel.x2) / 2;
            let centerZ = (lightPanel.z1 + lightPanel.z2) / 2;
            let pc = camera.project(centerX, lightPanel.y, centerZ);
            for (let i = 0; i < 5; i++) {
                fill(255, 250, 220, 60 - i * 10);
                ellipse(pc.x, pc.y, 300 - i * 40, 200 - i * 30);
            }
            pop();

            // === 左墙 ===
            push();
            let leftNormal = { x: 1, y: 0, z: 0 };
            let leftColor = getLambertColor(leftNormal, lightDir, color(35, 40, 45));

            drawQuad3D(camera,
                { x: left, y: bottom, z: back },
                { x: left, y: bottom, z: front },
                { x: left, y: top, z: front },
                { x: left, y: top, z: back },
                leftColor
            );

            // 左墙金属条纹
            stroke(55, 60, 65, 100);
            strokeWeight(2);
            for (let i = 0; i < 5; i++) {
                let zPos = front + (back - front) * (0.2 + i * 0.15);
                drawLine3D(camera,
                    { x: left, y: bottom + 0.2, z: zPos },
                    { x: left, y: top - 0.2, z: zPos },
                    color(55, 60, 65, 100), 2
                );
            }
            pop();

            // === 右墙 ===
            push();
            let rightNormal = { x: -1, y: 0, z: 0 };
            let rightColor = getLambertColor(rightNormal, lightDir, color(35, 40, 45));

            drawQuad3D(camera,
                { x: right, y: bottom, z: front },
                { x: right, y: bottom, z: back },
                { x: right, y: top, z: back },
                { x: right, y: top, z: front },
                rightColor
            );

            // 右墙金属条纹
            stroke(55, 60, 65, 100);
            strokeWeight(2);
            for (let i = 0; i < 5; i++) {
                let zPos = front + (back - front) * (0.2 + i * 0.15);
                drawLine3D(camera,
                    { x: right, y: bottom + 0.2, z: zPos },
                    { x: right, y: top - 0.2, z: zPos },
                    color(55, 60, 65, 100), 2
                );
            }
            pop();

            // === 背墙 ===
            push();
            let backNormal = { x: 0, y: 0, z: -1 };
            let backColor = getLambertColor(backNormal, lightDir, color(25, 28, 32));

            drawQuad3D(camera,
                { x: left, y: bottom, z: back },
                { x: right, y: bottom, z: back },
                { x: right, y: top, z: back },
                { x: left, y: top, z: back },
                backColor
            );
            pop();
        }

        // ========== 绘制3D门 ==========
        function draw3DDoors() {
            const doorW = 0.8;
            const doorH = 2.2;
            const doorY = -1.1;
            const doorZ = 0.01;

            const slideOffset = doorW * elevator.doorProgress;

            // 门框
            push();
            noStroke();
            fill(60, 65, 70);

            let frameThick = 0.1;
            // 顶部门框
            drawQuad3D(camera,
                { x: -doorW - 0.1, y: doorY + doorH, z: doorZ - 0.05 },
                { x: doorW + 0.1, y: doorY + doorH, z: doorZ - 0.05 },
                { x: doorW + 0.1, y: doorY + doorH + frameThick, z: doorZ - 0.05 },
                { x: -doorW - 0.1, y: doorY + doorH + frameThick, z: doorZ - 0.05 },
                color(60, 65, 70)
            );

            // 左侧门框
            drawQuad3D(camera,
                { x: -doorW - 0.1, y: doorY, z: doorZ - 0.05 },
                { x: -doorW - 0.1 + frameThick, y: doorY, z: doorZ - 0.05 },
                { x: -doorW - 0.1 + frameThick, y: doorY + doorH, z: doorZ - 0.05 },
                { x: -doorW - 0.1, y: doorY + doorH, z: doorZ - 0.05 },
                color(60, 65, 70)
            );

            // 右侧门框
            drawQuad3D(camera,
                { x: doorW + 0.1 - frameThick, y: doorY, z: doorZ - 0.05 },
                { x: doorW + 0.1, y: doorY, z: doorZ - 0.05 },
                { x: doorW + 0.1, y: doorY + doorH, z: doorZ - 0.05 },
                { x: doorW + 0.1 - frameThick, y: doorY + doorH, z: doorZ - 0.05 },
                color(60, 65, 70)
            );
            pop();

            // 如果门打开，绘制外部场景
            if (elevator.doorProgress > 0) {
                push();
                draw3DExteriorScene(elevator.currentFloor, slideOffset);
                pop();
            }

            // === 左门 ===
            push();
            let doorNormal = { x: 0, y: 0, z: -1 };
            let doorBaseColor = color(70, 75, 80);
            let leftDoorColor = getLambertColor(doorNormal, lightDir, doorBaseColor);

            // 门的阴影
            fill(0, 0, 0, 40);
            drawQuad3D(camera,
                { x: -doorW - slideOffset - 0.02, y: doorY, z: doorZ },
                { x: -slideOffset, y: doorY, z: doorZ },
                { x: -slideOffset, y: doorY + doorH, z: doorZ },
                { x: -doorW - slideOffset - 0.02, y: doorY + doorH, z: doorZ },
                color(0, 0, 0, 40)
            );

            // 门本体
            drawQuad3D(camera,
                { x: -doorW - slideOffset, y: doorY, z: doorZ },
                { x: -slideOffset, y: doorY, z: doorZ },
                { x: -slideOffset, y: doorY + doorH, z: doorZ },
                { x: -doorW - slideOffset, y: doorY + doorH, z: doorZ },
                leftDoorColor
            );

            // 门的高光线
            stroke(100, 110, 120, 180);
            strokeWeight(3);
            let midX = -doorW/2 - slideOffset;
            drawLine3D(camera,
                { x: midX, y: doorY + 0.1, z: doorZ },
                { x: midX, y: doorY + doorH - 0.1, z: doorZ },
                color(100, 110, 120, 180), 3
            );

            // 门把手
            fill(40, 45, 50);
            let p1 = camera.project(-doorW * 0.2 - slideOffset, doorY + doorH * 0.5, doorZ);
            rect(p1.x - 10, p1.y - 15, 20, 30, 3);
            pop();

            // === 右门 ===
            push();
            let rightDoorColor = getLambertColor(doorNormal, lightDir, doorBaseColor);

            // 门的阴影
            fill(0, 0, 0, 40);
            drawQuad3D(camera,
                { x: slideOffset, y: doorY, z: doorZ },
                { x: doorW + slideOffset + 0.02, y: doorY, z: doorZ },
                { x: doorW + slideOffset + 0.02, y: doorY + doorH, z: doorZ },
                { x: slideOffset, y: doorY + doorH, z: doorZ },
                color(0, 0, 0, 40)
            );

            // 门本体
            drawQuad3D(camera,
                { x: slideOffset, y: doorY, z: doorZ },
                { x: doorW + slideOffset, y: doorY, z: doorZ },
                { x: doorW + slideOffset, y: doorY + doorH, z: doorZ },
                { x: slideOffset, y: doorY + doorH, z: doorZ },
                rightDoorColor
            );

            // 门的高光线
            stroke(100, 110, 120, 180);
            strokeWeight(3);
            midX = doorW/2 + slideOffset;
            drawLine3D(camera,
                { x: midX, y: doorY + 0.1, z: doorZ },
                { x: midX, y: doorY + doorH - 0.1, z: doorZ },
                color(100, 110, 120, 180), 3
            );

            // 门把手
            fill(40, 45, 50);
            let p2 = camera.project(doorW * 0.2 + slideOffset, doorY + doorH * 0.5, doorZ);
            rect(p2.x - 10, p2.y - 15, 20, 30, 3);
            pop();

            // 门缝
            if (elevator.doorProgress < 1) {
                stroke(5, 8, 12);
                strokeWeight(4);
                drawLine3D(camera,
                    { x: -slideOffset, y: doorY - 0.1, z: doorZ },
                    { x: -slideOffset, y: doorY + doorH + 0.1, z: doorZ },
                    color(5, 8, 12), 4
                );
                drawLine3D(camera,
                    { x: slideOffset, y: doorY - 0.1, z: doorZ },
                    { x: slideOffset, y: doorY + doorH + 0.1, z: doorZ },
                    color(5, 8, 12), 4
                );
            }
        }

        // ========== 绘制3D外部场景（走廊）==========
        function draw3DExteriorScene(floor, doorOpenWidth) {
            const corridorDepth = 6;
            const corridorWidth = 3;
            const corridorHeight = 3;

            // 走廊地板
            push();
            let floorCol = color(50, 45, 40);
            if (floor === 2) floorCol = color(200, 205, 210);
            if (floor === 3) floorCol = color(30, 25, 35);
            if (floor === 4) floorCol = color(10, 5, 20);
            if (floor === 5) floorCol = color(20, 25, 35);

            drawQuad3D(camera,
                { x: -corridorWidth, y: -1.5, z: 0.1 },
                { x: corridorWidth, y: -1.5, z: 0.1 },
                { x: corridorWidth, y: -1.5, z: corridorDepth },
                { x: -corridorWidth, y: -1.5, z: corridorDepth },
                floorCol
            );
            pop();

            // 走廊天花板
            push();
            drawQuad3D(camera,
                { x: -corridorWidth, y: 1.5, z: corridorDepth },
                { x: corridorWidth, y: 1.5, z: corridorDepth },
                { x: corridorWidth, y: 1.5, z: 0.1 },
                { x: -corridorWidth, y: 1.5, z: 0.1 },
                color(60, 65, 70)
            );
            pop();

            // 走廊左墙
            push();
            let wallCol = color(40, 35, 30);
            if (floor === 2) wallCol = color(180, 175, 170);
            if (floor === 3) wallCol = color(25, 20, 30);
            if (floor === 4) wallCol = color(15, 10, 25);

            drawQuad3D(camera,
                { x: -corridorWidth, y: -1.5, z: 0.1 },
                { x: -corridorWidth, y: -1.5, z: corridorDepth },
                { x: -corridorWidth, y: 1.5, z: corridorDepth },
                { x: -corridorWidth, y: 1.5, z: 0.1 },
                wallCol
            );
            pop();

            // 走廊右墙
            push();
            drawQuad3D(camera,
                { x: corridorWidth, y: -1.5, z: corridorDepth },
                { x: corridorWidth, y: -1.5, z: 0.1 },
                { x: corridorWidth, y: 1.5, z: 0.1 },
                { x: corridorWidth, y: 1.5, z: corridorDepth },
                wallCol
            );
            pop();

            // 楼层特色装饰
            drawFloorDecoration(floor);
        }

        function drawFloorDecoration(floor) {
            push();
            switch(floor) {
                case 1: // Lobby
                    // 植物
                    fill(40, 80, 40);
                    let pp = camera.project(-1.5, -0.5, 3);
                    ellipse(pp.x, pp.y, 40, 60);

                    // RECEPTION文字
                    fill(200, 180, 150);
                    textSize(24);
                    let tp = camera.project(0, 0, 4);
                    text('RECEPTION', tp.x, tp.y);
                    break;

                case 2: // Office
                    // 办公室门
                    fill(180, 170, 160);
                    drawQuad3D(camera,
                        { x: -2, y: -1, z: 2 },
                        { x: -1.5, y: -1, z: 2 },
                        { x: -1.5, y: 0.5, z: 2 },
                        { x: -2, y: 0.5, z: 2 },
                        color(180, 170, 160)
                    );
                    break;

                case 3: // Gallery
                    // 画框
                    fill(180, 120, 80);
                    drawQuad3D(camera,
                        { x: -2.5, y: -0.2, z: 2.5 },
                        { x: -1.8, y: -0.2, z: 2.5 },
                        { x: -1.8, y: 0.5, z: 2.5 },
                        { x: -2.5, y: 0.5, z: 2.5 },
                        color(180, 120, 80)
                    );
                    break;

                case 4: // Neon
                    // 霓虹线条
                    stroke(100, 150, 255, 200);
                    strokeWeight(4);
                    drawLine3D(camera,
                        { x: -2.5, y: -1, z: 1 },
                        { x: -2.5, y: 1, z: 1 },
                        color(100, 150, 255, 200), 4
                    );
                    drawLine3D(camera,
                        { x: 2.5, y: -1, z: 1 },
                        { x: 2.5, y: 1, z: 1 },
                        color(200, 100, 255, 200), 4
                    );
                    break;

                case 5: // Rooftop
                    // 星星
                    noStroke();
                    for (let i = 0; i < 10; i++) {
                        let sx = -2 + Math.random() * 4;
                        let sy = 0 + Math.random() * 1;
                        let sz = 2 + Math.random() * 3;
                        let sp = camera.project(sx, sy, sz);
                        fill(255, 255, 220, 200);
                        ellipse(sp.x, sp.y, 3, 3);
                    }
                    break;
            }
            pop();
        }

        // ========== 绘制3D按钮面板 ==========
        function draw3DButtonPanel() {
            const panelX = -1.8;
            const panelY = -0.5;
            const panelZ = 1.5;
            const panelW = 0.4;
            const panelH = 1.8;
            const panelDepth = 0.1;

            // 面板阴影
            push();
            fill(0, 0, 0, 80);
            drawQuad3D(camera,
                { x: panelX - 0.02, y: panelY - 0.02, z: panelZ },
                { x: panelX + panelW + 0.02, y: panelY - 0.02, z: panelZ },
                { x: panelX + panelW + 0.02, y: panelY + panelH + 0.02, z: panelZ },
                { x: panelX - 0.02, y: panelY + panelH + 0.02, z: panelZ },
                color(0, 0, 0, 80)
            );
            pop();

            // 面板主体（前面）
            push();
            let panelNormal = { x: 1, y: 0, z: -0.3 };
            let panelColor = getLambertColor(panelNormal, lightDir, color(42, 47, 52));

            drawQuad3D(camera,
                { x: panelX, y: panelY, z: panelZ },
                { x: panelX + panelW, y: panelY, z: panelZ },
                { x: panelX + panelW, y: panelY + panelH, z: panelZ },
                { x: panelX, y: panelY + panelH, z: panelZ },
                panelColor
            );

            // 面板边缘（右侧）
            drawQuad3D(camera,
                { x: panelX + panelW, y: panelY, z: panelZ },
                { x: panelX + panelW, y: panelY, z: panelZ - panelDepth },
                { x: panelX + panelW, y: panelY + panelH, z: panelZ - panelDepth },
                { x: panelX + panelW, y: panelY + panelH, z: panelZ },
                color(55, 60, 65)
            );
            pop();

            // 绘制3D按钮
            const buttonRadius = 0.08;
            const buttonSpacing = 0.32;
            const startY = panelY + 0.3;

            elevator.buttons.forEach((btn, i) => {
                let bx = panelX + panelW / 2;
                let by = startY + i * buttonSpacing;
                let bz = panelZ + 0.02;

                const isCurrent = btn.floor === elevator.currentFloor;
                const isActive = btn.active;

                // 按钮投影位置
                let bp = camera.project(bx, by, bz);

                push();
                // 按钮阴影
                fill(0, 0, 0, 100);
                ellipse(bp.x + 3, bp.y + 3, buttonRadius * 200, buttonRadius * 200);

                // 按钮外圈
                if (isActive) {
                    fill(180, 140, 30);
                } else if (isCurrent) {
                    fill(50, 55, 60);
                } else {
                    fill(55, 60, 65);
                }
                ellipse(bp.x, bp.y, buttonRadius * 200, buttonRadius * 200);

                // 按钮内圈
                if (isActive) {
                    fill(255, 200, 50);
                } else if (isCurrent) {
                    fill(65, 70, 75);
                } else {
                    fill(60, 65, 70);
                }
                ellipse(bp.x, bp.y, buttonRadius * 170, buttonRadius * 170);

                // 按钮高光
                if (!isActive) {
                    fill(255, 255, 255, 40);
                    ellipse(bp.x - buttonRadius * 30, bp.y - buttonRadius * 30,
                           buttonRadius * 60, buttonRadius * 60);
                }

                // 发光效果
                if (isActive) {
                    noStroke();
                    for (let j = 0; j < 3; j++) {
                        fill(255, 200, 50, 60 - j * 20);
                        ellipse(bp.x, bp.y, buttonRadius * (240 + j * 40), buttonRadius * (240 + j * 40));
                    }
                }

                // 数字
                noStroke();
                fill(isActive ? 40 : 220);
                textSize(buttonRadius * 100);
                textStyle(BOLD);
                text(btn.floor, bp.x, bp.y);

                // 当前楼层指示灯
                if (isCurrent && !isActive) {
                    fill(40, 45, 50);
                    ellipse(bp.x + buttonRadius * 80, bp.y - buttonRadius * 80,
                           buttonRadius * 30, buttonRadius * 30);
                    fill(100, 255, 100, 200);
                    ellipse(bp.x + buttonRadius * 80, bp.y - buttonRadius * 80,
                           buttonRadius * 20, buttonRadius * 20);
                    fill(100, 255, 100, 80);
                    ellipse(bp.x + buttonRadius * 80, bp.y - buttonRadius * 80,
                           buttonRadius * 40, buttonRadius * 40);
                }

                // 存储按钮位置用于点击检测
                btn.screenPos = { x: bp.x, y: bp.y, radius: buttonRadius * 100 };
                pop();
            });
        }

        // ========== 绘制楼层显示器 ==========
        function drawFloorIndicator() {
            push();

            const indicatorPos = camera.project(0, 0.9, 0.05);
            const indicatorW = width * 0.12;
            const indicatorH = height * 0.08;

            // 显示器阴影
            fill(0, 0, 0, 100);
            rect(indicatorPos.x - indicatorW/2 + 5, indicatorPos.y - indicatorH/2 + 5,
                 indicatorW, indicatorH, 5);

            // 显示器外框
            fill(50, 55, 60);
            rect(indicatorPos.x - indicatorW/2, indicatorPos.y - indicatorH/2,
                 indicatorW, indicatorH, 5);

            fill(65, 70, 75);
            rect(indicatorPos.x - indicatorW/2 + 3, indicatorPos.y - indicatorH/2 + 3,
                 indicatorW - 6, indicatorH - 6, 4);

            // 屏幕
            fill(8, 12, 18);
            rect(indicatorPos.x - indicatorW/2 + 5, indicatorPos.y - indicatorH/2 + 5,
                 indicatorW - 10, indicatorH - 10, 3);

            // 数字发光
            let glowAlpha = 255;
            if (elevator.floorChangeTimer < 200) {
                glowAlpha = 255 - (elevator.floorChangeTimer / 200) * 100;
            }

            const fontSize = indicatorH * 0.6;

            fill(255, 210, 90, glowAlpha * 0.2);
            textSize(fontSize * 1.4);
            text(elevator.displayFloor, indicatorPos.x, indicatorPos.y);

            fill(255, 210, 90, glowAlpha * 0.5);
            textSize(fontSize * 1.2);
            text(elevator.displayFloor, indicatorPos.x, indicatorPos.y);

            fill(255, 210, 90, glowAlpha);
            textSize(fontSize);
            textStyle(BOLD);
            text(elevator.displayFloor, indicatorPos.x, indicatorPos.y);

            pop();
        }

        // ========== 绘制状态文字 ==========
        function drawStatusText() {
            push();

            fill(200, 205, 210);
            textSize(Math.min(width * 0.018, height * 0.022));
            textAlign(LEFT, TOP);
            textStyle(NORMAL);
            noStroke();

            // 文字阴影
            fill(0, 0, 0, 100);
            text(elevator.getStatusText(), width * 0.025, height * 0.025);

            // 文字主体
            fill(200, 205, 210);
            text(elevator.getStatusText(), width * 0.02, height * 0.02);

            if (elevator.targetQueue.length > 0) {
                textSize(Math.min(width * 0.015, height * 0.018));
                fill(0, 0, 0, 100);
                text(`队列: ${elevator.targetQueue.join(', ')}`, width * 0.025, height * 0.955);
                fill(160, 165, 170);
                text(`队列: ${elevator.targetQueue.join(', ')}`, width * 0.02, height * 0.95);
            }

            pop();
        }

        // ========== 鼠标/触摸交互 ==========
        function mousePressed() {
            handleClick(mouseX, mouseY);
        }

        function touchStarted() {
            if (touches.length > 0) {
                handleClick(touches[0].x, touches[0].y);
            }
            return false;
        }

        function handleClick(x, y) {
            if (elevator.state === STATE.IDLE ||
                elevator.state === STATE.DOOR_OPEN ||
                elevator.state === STATE.MOVING) {

                elevator.buttons.forEach(btn => {
                    if (btn.screenPos) {
                        const d = dist(x, y, btn.screenPos.x, btn.screenPos.y);
                        if (d < btn.screenPos.radius) {
                            elevator.addTarget(btn.floor);
                            console.log('Button clicked:', btn.floor);
                        }
                    }
                });
            }
        }
    </script>
