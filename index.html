<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电梯体验 - Elevator Experience</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a0a0a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #errorMsg {
            position: fixed;
            top: 10px;
            left: 10px;
            color: red;
            background: white;
            padding: 10px;
            display: none;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="errorMsg">检查控制台...</div>
    <script>
        console.log('Script started');

        // 电梯状态常量
        const STATE = {
            IDLE: 'IDLE',
            MOVING: 'MOVING',
            DOOR_OPENING: 'DOOR_OPENING',
            DOOR_OPEN: 'DOOR_OPEN',
            DOOR_CLOSING: 'DOOR_CLOSING'
        };

        // 电梯类
        class Elevator {
            constructor() {
                this.currentFloor = 1;
                this.displayFloor = 1;
                this.targetQueue = [];
                this.state = STATE.IDLE;
                this.doorProgress = 0;
                this.stateTimer = 0;
                this.movingTimer = 0;
                this.shakeOffset = 0;
                this.floorChangeTimer = 0;

                // 按钮状态
                this.buttons = [
                    { floor: 5, x: 80, y: 180, active: false },
                    { floor: 4, x: 80, y: 240, active: false },
                    { floor: 3, x: 80, y: 300, active: false },
                    { floor: 2, x: 80, y: 360, active: false },
                    { floor: 1, x: 80, y: 420, active: false }
                ];
            }

            update(dt) {
                this.stateTimer += dt;

                switch(this.state) {
                    case STATE.IDLE:
                        this.doorProgress = 0;
                        if (this.targetQueue.length > 0) {
                            this.state = STATE.MOVING;
                            this.movingTimer = 0;
                            this.floorChangeTimer = 0;
                        }
                        break;

                    case STATE.MOVING:
                        this.movingTimer += dt;
                        this.shakeOffset = Math.sin(this.movingTimer * 0.01) * 1.5;

                        if (this.movingTimer > 800) {
                            const target = this.targetQueue[0];

                            if (this.displayFloor < target) {
                                this.displayFloor++;
                                this.floorChangeTimer = 0;
                            } else if (this.displayFloor > target) {
                                this.displayFloor--;
                                this.floorChangeTimer = 0;
                            }

                            this.movingTimer = 0;

                            if (this.displayFloor === target) {
                                this.currentFloor = target;
                                this.targetQueue.shift();
                                this.state = STATE.DOOR_OPENING;
                                this.stateTimer = 0;
                                this.shakeOffset = 0;

                                this.buttons.forEach(btn => {
                                    if (btn.floor === target) {
                                        btn.active = false;
                                    }
                                });
                            }
                        }
                        break;

                    case STATE.DOOR_OPENING:
                        this.doorProgress = Math.min(1, this.doorProgress + dt / 800);
                        if (this.doorProgress >= 1) {
                            this.state = STATE.DOOR_OPEN;
                            this.stateTimer = 0;
                        }
                        break;

                    case STATE.DOOR_OPEN:
                        this.doorProgress = 1;
                        if (this.stateTimer > 1500) {
                            this.state = STATE.DOOR_CLOSING;
                            this.stateTimer = 0;
                        }
                        break;

                    case STATE.DOOR_CLOSING:
                        this.doorProgress = Math.max(0, this.doorProgress - dt / 800);
                        if (this.doorProgress <= 0) {
                            this.state = STATE.IDLE;
                            this.stateTimer = 0;
                        }
                        break;
                }

                this.floorChangeTimer += dt;
            }

            addTarget(floor) {
                if (floor !== this.currentFloor && !this.targetQueue.includes(floor)) {
                    this.targetQueue.push(floor);
                    this.buttons.forEach(btn => {
                        if (btn.floor === floor) {
                            btn.active = true;
                        }
                    });
                }
            }

            getStatusText() {
                switch(this.state) {
                    case STATE.IDLE:
                        return '点击左侧按钮选择楼层';
                    case STATE.MOVING:
                        return '电梯运行中...';
                    case STATE.DOOR_OPENING:
                    case STATE.DOOR_OPEN:
                        return `已到达 ${this.currentFloor} 层`;
                    case STATE.DOOR_CLOSING:
                        return '关门中...';
                    default:
                        return '';
                }
            }
        }

        // 全局变量
        let elevator;
        let lastTime = 0;

        function setup() {
            console.log('Setup called');
            try {
                let canvas = createCanvas(600, 800);
                console.log('Canvas created:', canvas);
                canvas.parent(document.body);
                elevator = new Elevator();
                textAlign(CENTER, CENTER);
                lastTime = millis();
                console.log('Setup complete');
            } catch(e) {
                console.error('Setup error:', e);
                document.getElementById('errorMsg').style.display = 'block';
                document.getElementById('errorMsg').textContent = 'Error: ' + e.message;
            }
        }

        function draw() {
            try {
                const currentTime = millis();
                const deltaTime = currentTime - lastTime;
                lastTime = currentTime;

                if (!elevator) return;

                elevator.update(deltaTime);

                // 背景
                background(30, 35, 40);

                // 绘制电梯内部
                drawCabin();

                // 绘制门
                drawDoors();

                // 绘制按钮面板
                drawPanel();

                // 绘制楼层显示器
                drawFloorIndicator();

                // 绘制状态文字
                drawStatusText();

            } catch(e) {
                console.error('Draw error:', e);
                fill(255, 0, 0);
                text('Error: ' + e.message, 300, 400);
            }
        }

        function drawCabin() {
            // 顶灯
            fill(240, 240, 200, 200);
            noStroke();
            rect(200, 40, 200, 40, 5);

            // 顶部光源
            for (let i = 0; i < 5; i++) {
                let alpha = map(i, 0, 5, 80, 0);
                fill(255, 255, 220, alpha);
                ellipse(300, 100, 500 - i * 50, 400 - i * 50);
            }

            // 左墙
            for (let x = 0; x < 150; x += 3) {
                let c = 35;
                if (x > 40 && x < 110) c = 45;
                stroke(c, c + 5, c + 10);
                line(x, 100, x, 800);
            }

            // 右墙
            for (let x = 450; x < 600; x += 3) {
                let c = 35;
                if (x > 490 && x < 560) c = 45;
                stroke(c, c + 5, c + 10);
                line(x, 100, x, 800);
            }

            // 地板网格
            stroke(50, 55, 60);
            strokeWeight(1);
            for (let i = 0; i < 10; i++) {
                line(0, 600 + i * 20, 600, 600 + i * 20);
            }
            for (let i = 0; i < 12; i++) {
                line(i * 50, 600, i * 50, 800);
            }
        }

        function drawDoors() {
            push();
            translate(0, elevator.shakeOffset);

            const doorWidth = 175;
            const doorHeight = 450;
            const doorY = 120;
            const centerX = 300;
            const slideOffset = doorWidth * elevator.doorProgress;

            // 绘制外部场景（如果门打开）
            if (elevator.doorProgress > 0) {
                push();
                // 使用clip裁剪
                let ctx = drawingContext;
                ctx.save();
                ctx.beginPath();
                ctx.rect(centerX - slideOffset, doorY, slideOffset * 2, doorHeight);
                ctx.clip();

                // 绘制场景
                drawExteriorScene(elevator.currentFloor);

                ctx.restore();
                pop();
            }

            // 左门
            for (let x = 0; x < doorWidth; x += 2) {
                let c = 70;
                if (x > 10 && x < doorWidth - 10) c = 80;
                stroke(c, c + 5, c + 10);
                line(centerX - doorWidth - slideOffset + x, doorY,
                     centerX - doorWidth - slideOffset + x, doorY + doorHeight);
            }

            // 右门
            for (let x = 0; x < doorWidth; x += 2) {
                let c = 70;
                if (x > 10 && x < doorWidth - 10) c = 80;
                stroke(c, c + 5, c + 10);
                line(centerX + slideOffset + x, doorY,
                     centerX + slideOffset + x, doorY + doorHeight);
            }

            // 门缝
            if (elevator.doorProgress < 1) {
                stroke(10, 15, 20);
                strokeWeight(3);
                line(centerX - slideOffset, doorY, centerX - slideOffset, doorY + doorHeight);
                line(centerX + slideOffset, doorY, centerX + slideOffset, doorY + doorHeight);
            }

            pop();
        }

        function drawExteriorScene(floor) {
            switch(floor) {
                case 1: drawLobby(); break;
                case 2: drawOffice(); break;
                case 3: drawGallery(); break;
                case 4: drawNeon(); break;
                case 5: drawRooftop(); break;
            }
        }

        function drawLobby() {
            background(45, 40, 35);

            // 简化的大堂场景
            fill(30, 25, 20);
            rect(150, 150, 100, 400);
            rect(350, 150, 100, 400);

            fill(40, 80, 40);
            ellipse(200, 450, 60, 80);

            fill(200, 180, 150);
            textSize(24);
            text('RECEPTION', 300, 300);
        }

        function drawOffice() {
            background(220, 225, 230);

            fill(180, 170, 160);
            rect(170, 200, 80, 180, 3);
            rect(350, 200, 80, 180, 3);

            fill(150, 180, 200, 100);
            rect(180, 220, 60, 60, 2);
            rect(360, 220, 60, 60, 2);
        }

        function drawGallery() {
            background(35, 30, 40);

            fill(20, 15, 25);
            rect(170, 200, 90, 120, 3);
            fill(180, 120, 80);
            rect(180, 210, 70, 100);

            fill(20, 15, 25);
            rect(340, 250, 90, 120, 3);
            fill(80, 120, 180);
            rect(350, 260, 70, 100);
        }

        function drawNeon() {
            background(10, 5, 20);

            strokeWeight(4);
            stroke(100, 150, 255, 200);
            line(180, 150, 180, 550);

            stroke(200, 100, 255, 200);
            line(420, 150, 420, 550);

            stroke(150, 200, 255, 180);
            line(200, 300, 400, 300);
        }

        function drawRooftop() {
            // 天空渐变
            for (let y = 100; y < 600; y += 5) {
                let c = map(y, 100, 600, 30, 60);
                stroke(c, c, c + 20);
                line(150, y, 450, y);
            }

            // 星星
            for (let i = 0; i < 15; i++) {
                let x = 170 + (i * 23) % 260;
                let y = 120 + (i * 37) % 200;
                fill(255, 255, 220, 200);
                noStroke();
                ellipse(x, y, 2, 2);
            }

            // 建筑剪影
            fill(10, 10, 20, 180);
            rect(160, 380, 50, 120);
            rect(220, 400, 40, 100);
            rect(270, 360, 60, 140);
            rect(340, 390, 45, 110);
        }

        function drawPanel() {
            // 面板背景
            fill(40, 45, 50);
            stroke(60, 65, 70);
            strokeWeight(2);
            rect(50, 150, 80, 310, 8);

            // 绘制按钮
            elevator.buttons.forEach(btn => {
                const isCurrent = btn.floor === elevator.currentFloor;
                const isActive = btn.active;

                // 按钮
                if (isActive) {
                    fill(255, 200, 50);
                    stroke(255, 220, 100);
                    strokeWeight(2);
                } else if (isCurrent) {
                    fill(60, 65, 70);
                    stroke(100, 200, 100);
                    strokeWeight(2);
                } else {
                    fill(60, 65, 70);
                    stroke(80, 85, 90);
                    strokeWeight(1);
                }

                ellipse(btn.x, btn.y, 50, 50);

                // 发光
                if (isActive) {
                    noStroke();
                    fill(255, 200, 50, 50);
                    ellipse(btn.x, btn.y, 60, 60);
                }

                // 数字
                noStroke();
                fill(isActive ? 40 : 220);
                textSize(24);
                text(btn.floor, btn.x, btn.y);

                // 当前楼层指示
                if (isCurrent && !isActive) {
                    fill(100, 255, 100);
                    ellipse(btn.x + 22, btn.y - 22, 6, 6);
                }
            });
        }

        function drawFloorIndicator() {
            push();
            translate(0, elevator.shakeOffset);

            // 外框
            fill(20, 25, 30);
            stroke(60, 65, 70);
            strokeWeight(3);
            rect(250, 60, 100, 50, 5);

            // 屏幕
            fill(10, 15, 20);
            noStroke();
            rect(255, 65, 90, 40, 3);

            // 数字
            let glowAlpha = 255;
            if (elevator.floorChangeTimer < 200) {
                glowAlpha = 255 - (elevator.floorChangeTimer / 200) * 100;
            }

            fill(255, 210, 90, glowAlpha * 0.3);
            textSize(50);
            text(elevator.displayFloor, 300, 85);

            fill(255, 210, 90, glowAlpha * 0.6);
            textSize(45);
            text(elevator.displayFloor, 300, 85);

            fill(255, 210, 90, glowAlpha);
            textSize(40);
            text(elevator.displayFloor, 300, 85);

            pop();
        }

        function drawStatusText() {
            fill(180, 185, 190);
            textSize(14);
            textAlign(LEFT, TOP);
            noStroke();
            text(elevator.getStatusText(), 20, 20);

            if (elevator.targetQueue.length > 0) {
                textSize(12);
                fill(150, 155, 160);
                text(`队列: ${elevator.targetQueue.join(', ')}`, 20, 740);
            }

            textAlign(CENTER, CENTER); // 恢复默认
        }

        function mousePressed() {
            handleClick(mouseX, mouseY);
        }

        function touchStarted() {
            if (touches.length > 0) {
                handleClick(touches[0].x, touches[0].y);
            }
            return false;
        }

        function handleClick(x, y) {
            if (elevator.state === STATE.IDLE ||
                elevator.state === STATE.DOOR_OPEN ||
                elevator.state === STATE.MOVING) {
                elevator.buttons.forEach(btn => {
                    const d = dist(x, y, btn.x, btn.y);
                    if (d < 25) {
                        elevator.addTarget(btn.floor);
                        console.log('Button clicked:', btn.floor);
                    }
                });
            }
        }

        // 错误处理
        window.addEventListener('error', function(e) {
            console.error('Global error:', e.error);
            document.getElementById('errorMsg').style.display = 'block';
            document.getElementById('errorMsg').textContent = 'Error: ' + e.message;
        });
    </script>
</body>
</html>
