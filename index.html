<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电梯体验 - Elevator Experience</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
        }
        body {
            width: 100vw;
            height: 100vh;
            background: #0a0a0a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        canvas {
            display: block;
        }
        #errorMsg {
            position: fixed;
            top: 10px;
            left: 10px;
            color: red;
            background: white;
            padding: 10px;
            display: none;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="errorMsg">检查控制台...</div>
    <script>
        console.log('Script started');

        // 电梯状态常量
        const STATE = {
            IDLE: 'IDLE',
            MOVING: 'MOVING',
            DOOR_OPENING: 'DOOR_OPENING',
            DOOR_OPEN: 'DOOR_OPEN',
            DOOR_CLOSING: 'DOOR_CLOSING'
        };

        // 电梯类
        class Elevator {
            constructor() {
                this.currentFloor = 1;
                this.displayFloor = 1;
                this.targetQueue = [];
                this.state = STATE.IDLE;
                this.doorProgress = 0;
                this.stateTimer = 0;
                this.movingTimer = 0;
                this.shakeOffset = 0;
                this.floorChangeTimer = 0;

                this.updateButtonPositions();
            }

            updateButtonPositions() {
                // 按钮位置 - 响应式（左侧，垂直居中）
                const panelX = width * 0.12;
                const startY = height * 0.28;
                const spacing = height * 0.08;

                this.buttons = [
                    { floor: 5, x: panelX, y: startY, active: false },
                    { floor: 4, x: panelX, y: startY + spacing, active: false },
                    { floor: 3, x: panelX, y: startY + spacing * 2, active: false },
                    { floor: 2, x: panelX, y: startY + spacing * 3, active: false },
                    { floor: 1, x: panelX, y: startY + spacing * 4, active: false }
                ];
            }

            update(dt) {
                this.stateTimer += dt;

                switch(this.state) {
                    case STATE.IDLE:
                        this.doorProgress = 0;
                        if (this.targetQueue.length > 0) {
                            this.state = STATE.MOVING;
                            this.movingTimer = 0;
                            this.floorChangeTimer = 0;
                        }
                        break;

                    case STATE.MOVING:
                        this.movingTimer += dt;
                        this.shakeOffset = Math.sin(this.movingTimer * 0.01) * 1.5;

                        if (this.movingTimer > 800) {
                            const target = this.targetQueue[0];

                            if (this.displayFloor < target) {
                                this.displayFloor++;
                                this.floorChangeTimer = 0;
                            } else if (this.displayFloor > target) {
                                this.displayFloor--;
                                this.floorChangeTimer = 0;
                            }

                            this.movingTimer = 0;

                            if (this.displayFloor === target) {
                                this.currentFloor = target;
                                this.targetQueue.shift();
                                this.state = STATE.DOOR_OPENING;
                                this.stateTimer = 0;
                                this.shakeOffset = 0;

                                this.buttons.forEach(btn => {
                                    if (btn.floor === target) {
                                        btn.active = false;
                                    }
                                });
                            }
                        }
                        break;

                    case STATE.DOOR_OPENING:
                        this.doorProgress = Math.min(1, this.doorProgress + dt / 800);
                        if (this.doorProgress >= 1) {
                            this.state = STATE.DOOR_OPEN;
                            this.stateTimer = 0;
                        }
                        break;

                    case STATE.DOOR_OPEN:
                        this.doorProgress = 1;
                        if (this.stateTimer > 1500) {
                            this.state = STATE.DOOR_CLOSING;
                            this.stateTimer = 0;
                        }
                        break;

                    case STATE.DOOR_CLOSING:
                        this.doorProgress = Math.max(0, this.doorProgress - dt / 800);
                        if (this.doorProgress <= 0) {
                            this.state = STATE.IDLE;
                            this.stateTimer = 0;
                        }
                        break;
                }

                this.floorChangeTimer += dt;
            }

            addTarget(floor) {
                if (floor !== this.currentFloor && !this.targetQueue.includes(floor)) {
                    this.targetQueue.push(floor);
                    this.buttons.forEach(btn => {
                        if (btn.floor === floor) {
                            btn.active = true;
                        }
                    });
                }
            }

            getStatusText() {
                switch(this.state) {
                    case STATE.IDLE:
                        return '点击左侧按钮选择楼层';
                    case STATE.MOVING:
                        return '电梯运行中...';
                    case STATE.DOOR_OPENING:
                    case STATE.DOOR_OPEN:
                        return `已到达 ${this.currentFloor} 层`;
                    case STATE.DOOR_CLOSING:
                        return '关门中...';
                    default:
                        return '';
                }
            }
        }

        // 全局变量
        let elevator;
        let lastTime = 0;

        function setup() {
            console.log('Setup called');
            try {
                // 全屏画布
                let canvas = createCanvas(windowWidth, windowHeight);
                console.log('Canvas created:', windowWidth, 'x', windowHeight);
                canvas.parent(document.body);
                elevator = new Elevator();
                textAlign(CENTER, CENTER);
                lastTime = millis();
                console.log('Setup complete');
            } catch(e) {
                console.error('Setup error:', e);
                document.getElementById('errorMsg').style.display = 'block';
                document.getElementById('errorMsg').textContent = 'Error: ' + e.message;
            }
        }

        // 窗口大小改变时重新调整
        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
            if (elevator) {
                elevator.updateButtonPositions();
            }
            console.log('Window resized:', windowWidth, 'x', windowHeight);
        }

        function draw() {
            try {
                const currentTime = millis();
                const deltaTime = currentTime - lastTime;
                lastTime = currentTime;

                if (!elevator) return;

                elevator.update(deltaTime);

                // 清除画布 - 深灰色背景
                background(15, 18, 22);

                // 绘制电梯内部（3D空间）
                drawCabin3D();

                // 绘制门和外部场景
                drawDoors();

                // 绘制按钮面板（带3D效果）
                drawPanel3D();

                // 绘制楼层显示器
                drawFloorIndicator();

                // 绘制状态文字
                drawStatusText();

            } catch(e) {
                console.error('Draw error:', e);
                fill(255, 0, 0);
                text('Error: ' + e.message, width/2, height/2);
            }
        }

        function drawCabin3D() {
            push();
            translate(0, elevator.shakeOffset);

            const centerX = width / 2;
            const centerY = height / 2;

            // 3D透视参数
            const vanishY = height * 0.35; // 消失点Y
            const depth = height * 0.6; // 深度

            // === 背墙（深处） ===
            push();
            fill(25, 28, 32);
            noStroke();
            const backWallTop = vanishY;
            const backWallBottom = vanishY + depth * 0.5;
            const backWallLeft = width * 0.28;
            const backWallRight = width * 0.72;
            quad(
                backWallLeft, backWallTop,
                backWallRight, backWallTop,
                backWallRight, backWallBottom,
                backWallLeft, backWallBottom
            );
            pop();

            // === 天花板（透视） ===
            push();
            // 中央灯光区域
            fill(240, 240, 220, 180);
            noStroke();
            quad(
                width * 0.35, vanishY - height * 0.05,
                width * 0.65, vanishY - height * 0.05,
                width * 0.75, 0,
                width * 0.25, 0
            );

            // 天花板透视线条
            for (let i = 0; i < 8; i++) {
                let ratio = i / 8;
                stroke(40 + i * 5, 43 + i * 5, 48 + i * 5);
                strokeWeight(1);

                // 从边缘到消失点的线条
                let topX = lerp(width * 0.25, width * 0.35, ratio);
                let topX2 = lerp(width * 0.75, width * 0.65, ratio);
                line(0, 0, topX, vanishY);
                line(width, 0, topX2, vanishY);
            }

            // 天花板格子
            stroke(35, 38, 42);
            strokeWeight(2);
            for (let i = 1; i < 4; i++) {
                let y = vanishY * i / 4;
                let leftX = lerp(0, width * 0.35, i / 4);
                let rightX = lerp(width, width * 0.65, i / 4);
                line(leftX, y, rightX, y);
            }
            pop();

            // === 顶部光源（柔和光晕） ===
            push();
            noStroke();
            for (let i = 0; i < 8; i++) {
                let alpha = map(i, 0, 8, 100, 0);
                fill(255, 250, 220, alpha);
                let size = height * (0.5 + i * 0.15);
                ellipse(centerX, vanishY * 0.5, size, size * 0.6);
            }
            pop();

            // === 左墙（透视） ===
            push();
            for (let i = 0; i < 15; i++) {
                let ratio = i / 15;
                let c = 30 + i * 3;
                if (i > 5 && i < 10) c += 10; // 中间亮一些

                stroke(c, c + 5, c + 8);
                strokeWeight(2);

                let topX = lerp(0, width * 0.28, ratio);
                let bottomX = lerp(0, width * 0.05, ratio);
                line(topX, vanishY, bottomX, height);
            }

            // 左墙金属条纹
            stroke(55, 60, 65, 100);
            strokeWeight(3);
            line(width * 0.15, vanishY, width * 0.03, height);
            pop();

            // === 右墙（透视） ===
            push();
            for (let i = 0; i < 15; i++) {
                let ratio = i / 15;
                let c = 30 + i * 3;
                if (i > 5 && i < 10) c += 10;

                stroke(c, c + 5, c + 8);
                strokeWeight(2);

                let topX = lerp(width, width * 0.72, ratio);
                let bottomX = lerp(width, width * 0.95, ratio);
                line(topX, vanishY, bottomX, height);
            }

            // 右墙金属条纹
            stroke(55, 60, 65, 100);
            strokeWeight(3);
            line(width * 0.85, vanishY, width * 0.97, height);
            pop();

            // === 地板（透视网格） ===
            push();
            stroke(45, 50, 55);
            strokeWeight(1);

            // 横向透视线
            for (let i = 0; i < 12; i++) {
                let y = height * (0.7 + i * 0.025);
                let progress = (y - height * 0.7) / (height * 0.3);
                let leftX = lerp(width * 0.05, width * 0.28, progress);
                let rightX = lerp(width * 0.95, width * 0.72, progress);
                line(leftX, y, rightX, y);
            }

            // 纵向透视线
            for (let i = 0; i < 10; i++) {
                let ratio = i / 10;
                let bottomX = lerp(width * 0.05, width * 0.95, ratio);
                let topX = lerp(width * 0.28, width * 0.72, ratio);
                line(bottomX, height, topX, height * 0.7);
            }

            // 地板反光
            noStroke();
            fill(255, 255, 240, 15);
            quad(
                width * 0.35, height * 0.75,
                width * 0.65, height * 0.75,
                width * 0.7, height,
                width * 0.3, height
            );
            pop();

            pop();
        }

        function drawDoors() {
            push();
            translate(0, elevator.shakeOffset);

            const centerX = width / 2;
            const doorWidth = width * 0.18;
            const doorHeight = height * 0.48;
            const doorY = height * 0.22;
            const slideOffset = doorWidth * elevator.doorProgress;

            // 门框（3D效果）
            push();
            fill(50, 55, 60);
            noStroke();
            // 顶部门框
            rect(centerX - doorWidth * 1.1, doorY - 15, doorWidth * 2.2, 15);
            // 左侧门框
            rect(centerX - doorWidth * 1.1, doorY, 15, doorHeight);
            // 右侧门框
            rect(centerX + doorWidth * 1.1 - 15, doorY, 15, doorHeight);
            // 底部门框
            rect(centerX - doorWidth * 1.1, doorY + doorHeight, doorWidth * 2.2, 15);

            // 门框高光
            stroke(80, 85, 90, 150);
            strokeWeight(2);
            line(centerX - doorWidth * 1.1, doorY - 15, centerX + doorWidth * 1.1, doorY - 15);
            line(centerX - doorWidth * 1.1, doorY, centerX - doorWidth * 1.1, doorY + doorHeight);
            pop();

            // 绘制外部场景（如果门打开）
            if (elevator.doorProgress > 0) {
                push();
                let ctx = drawingContext;
                ctx.save();
                ctx.beginPath();
                ctx.rect(centerX - slideOffset, doorY, slideOffset * 2, doorHeight);
                ctx.clip();

                drawExteriorScene(elevator.currentFloor);

                ctx.restore();
                pop();
            }

            // 左门（金属质感+3D效果）
            push();
            // 门的阴影（立体感）
            fill(0, 0, 0, 50);
            rect(centerX - doorWidth - slideOffset - 5, doorY, doorWidth + 5, doorHeight);

            // 门本体
            for (let x = 0; x < doorWidth; x += 2) {
                let progress = x / doorWidth;
                let c = 65;
                if (progress < 0.1 || progress > 0.9) {
                    c = 50; // 边缘暗
                } else if (progress > 0.3 && progress < 0.7) {
                    c = 85; // 中间亮
                }
                stroke(c, c + 8, c + 12);
                line(centerX - doorWidth - slideOffset + x, doorY,
                     centerX - doorWidth - slideOffset + x, doorY + doorHeight);
            }

            // 门的高光线
            stroke(100, 110, 120, 180);
            strokeWeight(3);
            line(centerX - doorWidth * 0.5 - slideOffset, doorY + 20,
                 centerX - doorWidth * 0.5 - slideOffset, doorY + doorHeight - 20);

            // 门把手区域
            fill(40, 45, 50);
            rect(centerX - doorWidth * 0.2 - slideOffset, doorY + doorHeight * 0.45,
                 doorWidth * 0.15, doorHeight * 0.1, 3);
            pop();

            // 右门（金属质感+3D效果）
            push();
            // 门的阴影
            fill(0, 0, 0, 50);
            rect(centerX + slideOffset, doorY, doorWidth + 5, doorHeight);

            // 门本体
            for (let x = 0; x < doorWidth; x += 2) {
                let progress = x / doorWidth;
                let c = 65;
                if (progress < 0.1 || progress > 0.9) {
                    c = 50;
                } else if (progress > 0.3 && progress < 0.7) {
                    c = 85;
                }
                stroke(c, c + 8, c + 12);
                line(centerX + slideOffset + x, doorY,
                     centerX + slideOffset + x, doorY + doorHeight);
            }

            // 门的高光线
            stroke(100, 110, 120, 180);
            strokeWeight(3);
            line(centerX + doorWidth * 0.5 + slideOffset, doorY + 20,
                 centerX + doorWidth * 0.5 + slideOffset, doorY + doorHeight - 20);

            // 门把手区域
            fill(40, 45, 50);
            rect(centerX + doorWidth * 0.05 + slideOffset, doorY + doorHeight * 0.45,
                 doorWidth * 0.15, doorHeight * 0.1, 3);
            pop();

            // 门缝
            if (elevator.doorProgress < 1) {
                stroke(5, 8, 12);
                strokeWeight(4);
                line(centerX - slideOffset, doorY - 5, centerX - slideOffset, doorY + doorHeight + 5);
                line(centerX + slideOffset, doorY - 5, centerX + slideOffset, doorY + doorHeight + 5);
            }

            pop();
        }

        function drawExteriorScene(floor) {
            switch(floor) {
                case 1: drawLobby(); break;
                case 2: drawOffice(); break;
                case 3: drawGallery(); break;
                case 4: drawNeon(); break;
                case 5: drawRooftop(); break;
            }
        }

        function drawLobby() {
            const centerX = width / 2;
            const sceneW = width * 0.5;
            const sceneLeft = centerX - sceneW / 2;

            background(45, 40, 35);

            fill(30, 25, 20);
            rect(sceneLeft, height * 0.2, sceneW * 0.3, height * 0.5);
            rect(sceneLeft + sceneW * 0.7, height * 0.2, sceneW * 0.3, height * 0.5);

            fill(40, 80, 40);
            ellipse(sceneLeft + sceneW * 0.15, height * 0.6, width * 0.05, height * 0.1);

            fill(200, 180, 150);
            textSize(height * 0.03);
            text('RECEPTION', centerX, height * 0.4);
        }

        function drawOffice() {
            const centerX = width / 2;
            const sceneW = width * 0.5;
            const sceneLeft = centerX - sceneW / 2;

            background(220, 225, 230);

            fill(180, 170, 160);
            rect(sceneLeft + sceneW * 0.1, height * 0.25, sceneW * 0.25, height * 0.3, 3);
            rect(sceneLeft + sceneW * 0.65, height * 0.25, sceneW * 0.25, height * 0.3, 3);

            fill(150, 180, 200, 100);
            rect(sceneLeft + sceneW * 0.13, height * 0.28, sceneW * 0.19, height * 0.1, 2);
            rect(sceneLeft + sceneW * 0.68, height * 0.28, sceneW * 0.19, height * 0.1, 2);
        }

        function drawGallery() {
            const centerX = width / 2;
            const sceneW = width * 0.5;
            const sceneLeft = centerX - sceneW / 2;

            background(35, 30, 40);

            fill(20, 15, 25);
            rect(sceneLeft + sceneW * 0.1, height * 0.25, sceneW * 0.3, height * 0.2, 3);
            fill(180, 120, 80);
            rect(sceneLeft + sceneW * 0.13, height * 0.27, sceneW * 0.24, height * 0.16);

            fill(20, 15, 25);
            rect(sceneLeft + sceneW * 0.6, height * 0.35, sceneW * 0.3, height * 0.2, 3);
            fill(80, 120, 180);
            rect(sceneLeft + sceneW * 0.63, height * 0.37, sceneW * 0.24, height * 0.16);
        }

        function drawNeon() {
            background(10, 5, 20);

            const centerX = width / 2;
            const sceneW = width * 0.5;
            const sceneLeft = centerX - sceneW / 2;

            strokeWeight(4);

            stroke(100, 150, 255, 200);
            line(sceneLeft + sceneW * 0.1, height * 0.2, sceneLeft + sceneW * 0.1, height * 0.7);
            stroke(100, 150, 255, 100);
            strokeWeight(8);
            line(sceneLeft + sceneW * 0.1, height * 0.2, sceneLeft + sceneW * 0.1, height * 0.7);

            strokeWeight(4);
            stroke(200, 100, 255, 200);
            line(sceneLeft + sceneW * 0.9, height * 0.2, sceneLeft + sceneW * 0.9, height * 0.7);
            stroke(200, 100, 255, 100);
            strokeWeight(8);
            line(sceneLeft + sceneW * 0.9, height * 0.2, sceneLeft + sceneW * 0.9, height * 0.7);

            strokeWeight(3);
            stroke(150, 200, 255, 180);
            line(sceneLeft + sceneW * 0.2, height * 0.4, sceneLeft + sceneW * 0.8, height * 0.4);
        }

        function drawRooftop() {
            const centerX = width / 2;
            const sceneW = width * 0.5;
            const sceneLeft = centerX - sceneW / 2;

            for (let y = height * 0.15; y < height * 0.7; y += 5) {
                let c = map(y, height * 0.15, height * 0.7, 30, 60);
                stroke(c, c, c + 20);
                line(sceneLeft, y, sceneLeft + sceneW, y);
            }

            for (let i = 0; i < 15; i++) {
                let x = sceneLeft + (i * 23) % sceneW;
                let y = height * 0.2 + (i * 37) % (height * 0.25);
                fill(255, 255, 220, 200);
                noStroke();
                ellipse(x, y, 2, 2);
            }

            fill(10, 10, 20, 180);
            rect(sceneLeft + sceneW * 0.05, height * 0.5, sceneW * 0.15, height * 0.2);
            rect(sceneLeft + sceneW * 0.25, height * 0.53, sceneW * 0.12, height * 0.17);
            rect(sceneLeft + sceneW * 0.45, height * 0.48, sceneW * 0.18, height * 0.22);
            rect(sceneLeft + sceneW * 0.7, height * 0.52, sceneW * 0.13, height * 0.18);
        }

        function drawPanel3D() {
            push();

            const panelX = width * 0.05;
            const panelY = height * 0.23;
            const panelW = width * 0.12;
            const panelH = height * 0.52;

            // 面板阴影（3D深度）
            fill(0, 0, 0, 80);
            rect(panelX + 8, panelY + 8, panelW, panelH, 8);

            // 面板外框（凸起效果）
            // 暗边（左+上）
            fill(30, 35, 40);
            rect(panelX, panelY, panelW, panelH, 8);

            // 亮边（右+下）
            fill(55, 60, 65);
            rect(panelX + 4, panelY + 4, panelW - 4, panelH - 4, 6);

            // 面板主体
            fill(42, 47, 52);
            rect(panelX + 6, panelY + 6, panelW - 12, panelH - 12, 5);

            // 面板内凹陷区域
            fill(28, 32, 36);
            rect(panelX + 10, panelY + 10, panelW - 20, panelH - 20, 4);

            // 绘制3D按钮
            const buttonSize = Math.min(width * 0.055, height * 0.055);

            elevator.buttons.forEach(btn => {
                const isCurrent = btn.floor === elevator.currentFloor;
                const isActive = btn.active;

                push();

                // 按钮阴影（凹陷/凸起效果）
                if (isActive) {
                    // 按下状态 - 凹陷
                    fill(0, 0, 0, 100);
                    ellipse(btn.x + 2, btn.y + 2, buttonSize, buttonSize);
                } else {
                    // 未按下 - 凸起
                    fill(0, 0, 0, 60);
                    ellipse(btn.x + 4, btn.y + 4, buttonSize, buttonSize);
                }

                // 按钮外圈（立体边缘）
                if (isActive) {
                    fill(180, 140, 30);
                } else if (isCurrent) {
                    fill(50, 55, 60);
                } else {
                    fill(55, 60, 65);
                }
                ellipse(btn.x, btn.y, buttonSize, buttonSize);

                // 按钮内圈（主体）
                if (isActive) {
                    // 激活状态 - 金黄色发光
                    fill(255, 200, 50);
                    ellipse(btn.x, btn.y, buttonSize * 0.85, buttonSize * 0.85);
                } else if (isCurrent) {
                    fill(65, 70, 75);
                    ellipse(btn.x, btn.y, buttonSize * 0.85, buttonSize * 0.85);
                } else {
                    fill(60, 65, 70);
                    ellipse(btn.x, btn.y, buttonSize * 0.85, buttonSize * 0.85);
                }

                // 按钮高光（球面效果）
                if (!isActive) {
                    fill(255, 255, 255, 40);
                    noStroke();
                    ellipse(btn.x - buttonSize * 0.15, btn.y - buttonSize * 0.15,
                           buttonSize * 0.3, buttonSize * 0.3);
                }

                // 发光效果
                if (isActive) {
                    noStroke();
                    for (let i = 0; i < 3; i++) {
                        fill(255, 200, 50, 60 - i * 20);
                        ellipse(btn.x, btn.y, buttonSize * (1.2 + i * 0.2), buttonSize * (1.2 + i * 0.2));
                    }
                }

                // 数字
                noStroke();
                fill(isActive ? 40 : 220);
                textSize(buttonSize * 0.45);
                textStyle(BOLD);
                text(btn.floor, btn.x, btn.y);

                // 当前楼层指示灯（3D效果）
                if (isCurrent && !isActive) {
                    // 指示灯外壳
                    fill(40, 45, 50);
                    ellipse(btn.x + buttonSize * 0.4, btn.y - buttonSize * 0.4,
                           buttonSize * 0.15, buttonSize * 0.15);
                    // 指示灯发光
                    fill(100, 255, 100, 200);
                    ellipse(btn.x + buttonSize * 0.4, btn.y - buttonSize * 0.4,
                           buttonSize * 0.1, buttonSize * 0.1);
                    // 光晕
                    fill(100, 255, 100, 80);
                    ellipse(btn.x + buttonSize * 0.4, btn.y - buttonSize * 0.4,
                           buttonSize * 0.2, buttonSize * 0.2);
                }

                pop();
            });

            pop();
        }

        function drawFloorIndicator() {
            push();
            translate(0, elevator.shakeOffset);

            const centerX = width / 2;
            const indicatorW = width * 0.13;
            const indicatorH = height * 0.08;
            const indicatorY = height * 0.1;

            // 显示器阴影
            fill(0, 0, 0, 100);
            rect(centerX - indicatorW/2 + 5, indicatorY + 5, indicatorW, indicatorH, 5);

            // 显示器外框（金属边框 - 3D效果）
            fill(50, 55, 60);
            rect(centerX - indicatorW/2, indicatorY, indicatorW, indicatorH, 5);

            fill(65, 70, 75);
            rect(centerX - indicatorW/2 + 3, indicatorY + 3, indicatorW - 6, indicatorH - 6, 4);

            // 屏幕（内凹陷）
            fill(8, 12, 18);
            rect(centerX - indicatorW/2 + 5, indicatorY + 5, indicatorW - 10, indicatorH - 10, 3);

            // 数字发光
            let glowAlpha = 255;
            if (elevator.floorChangeTimer < 200) {
                glowAlpha = 255 - (elevator.floorChangeTimer / 200) * 100;
            }

            const fontSize = indicatorH * 0.6;

            // 多层光晕
            fill(255, 210, 90, glowAlpha * 0.2);
            textSize(fontSize * 1.4);
            text(elevator.displayFloor, centerX, indicatorY + indicatorH/2);

            fill(255, 210, 90, glowAlpha * 0.5);
            textSize(fontSize * 1.2);
            text(elevator.displayFloor, centerX, indicatorY + indicatorH/2);

            fill(255, 210, 90, glowAlpha);
            textSize(fontSize);
            textStyle(BOLD);
            text(elevator.displayFloor, centerX, indicatorY + indicatorH/2);

            pop();
        }

        function drawStatusText() {
            push();

            fill(200, 205, 210);
            textSize(Math.min(width * 0.018, height * 0.022));
            textAlign(LEFT, TOP);
            textStyle(NORMAL);
            noStroke();

            // 文字阴影
            fill(0, 0, 0, 100);
            text(elevator.getStatusText(), width * 0.025, height * 0.025);

            // 文字主体
            fill(200, 205, 210);
            text(elevator.getStatusText(), width * 0.02, height * 0.02);

            if (elevator.targetQueue.length > 0) {
                textSize(Math.min(width * 0.015, height * 0.018));
                fill(0, 0, 0, 100);
                text(`队列: ${elevator.targetQueue.join(', ')}`, width * 0.025, height * 0.955);
                fill(160, 165, 170);
                text(`队列: ${elevator.targetQueue.join(', ')}`, width * 0.02, height * 0.95);
            }

            pop();
        }

        function mousePressed() {
            handleClick(mouseX, mouseY);
        }

        function touchStarted() {
            if (touches.length > 0) {
                handleClick(touches[0].x, touches[0].y);
            }
            return false;
        }

        function handleClick(x, y) {
            if (elevator.state === STATE.IDLE ||
                elevator.state === STATE.DOOR_OPEN ||
                elevator.state === STATE.MOVING) {

                const buttonSize = Math.min(width * 0.055, height * 0.055);

                elevator.buttons.forEach(btn => {
                    const d = dist(x, y, btn.x, btn.y);
                    if (d < buttonSize / 2) {
                        elevator.addTarget(btn.floor);
                        console.log('Button clicked:', btn.floor);
                    }
                });
            }
        }

        // 错误处理
        window.addEventListener('error', function(e) {
            console.error('Global error:', e.error);
            document.getElementById('errorMsg').style.display = 'block';
            document.getElementById('errorMsg').textContent = 'Error: ' + e.message;
        });
    </script>
</body>
</html>
