            ctx.moveTo(backRightX - backWallOffset, backCeilingY + backWallOffset);
            ctx.lineTo(backRightX - backWallOffset, backFloorY - backWallOffset);
            ctx.stroke();

            // top horizontal edge
            ctx.beginPath();
            ctx.moveTo(backLeftX + backWallOffset, backCeilingY + backWallOffset);
            ctx.lineTo(backRightX - backWallOffset, backCeilingY + backWallOffset);
            ctx.stroke();

            ctx.restore();

            // --- DIAGONAL PURPLE STRIPS on side walls, in perspective ---
            ctx.save();
            ctx.shadowColor = "rgba(200, 80, 255, 0.9)";
            ctx.shadowBlur  = 26;
            ctx.strokeStyle = "#c554ff";
            ctx.lineWidth   = 3;

            // helper: a point along the left wall edge (front->back)
            function lerpWallLeft(t) {
                const x = frontLeftX + (backLeftX - frontLeftX) * t;
                const y = frontCeilingY + (backFloorY - frontCeilingY) * t;
                return { x, y };
            }

            // helper: a point along the right wall edge (front->back)
            function lerpWallRight(t) {
                const x = frontRightX + (backRightX - frontRightX) * t;
                const y = frontCeilingY + (backFloorY - frontCeilingY) * t;
                return { x, y };
            }

            // choose two depth positions on each wall: tStart (closer to camera), tEnd (closer to back)
            const tStart = 0.20;
            const tEnd   = 0.85;

            // LEFT wall diagonal
            const L0 = lerpWallLeft(tStart);
            const L1 = lerpWallLeft(tEnd);
            ctx.beginPath();
            ctx.moveTo(L0.x + 4, L0.y);   // small X offset so it sits inside the wall
            ctx.lineTo(L1.x + 4, L1.y);
            ctx.stroke();

            // RIGHT wall diagonal
            const R0 = lerpWallRight(tStart);
            const R1 = lerpWallRight(tEnd);
            ctx.beginPath();
            ctx.moveTo(R0.x - 4, R0.y);
            ctx.lineTo(R1.x - 4, R1.y);
            ctx.stroke();

            ctx.restore();
        }

        // ========== 侧墙装饰 Side Wall Decorations ==========
        // Shelves, posters, and light panels on left and right walls
        // 左右墙上的架子、海报和灯板
        function drawSideWallDecor(frontLeftX, frontRightX, backLeftX, backRightX,
                                    frontCeilingY, backCeilingY, frontFloorY, backFloorY) {
            // Disable all side-wall decor for now - clean walls with only neon lines
            // 暂时禁用所有侧墙装饰 - 只保留霓虹线条的干净墙面
            return;

            ctx.save();

            // LEFT WALL: Two floating shelves with small objects - 左墙：两个浮动架子和小物件
            // Shelf 1 (upper)
            const shelf1Y = lerp(backCeilingY, backFloorY, 0.3);
            const shelf1X = lerp(backLeftX, frontLeftX, 0.7);
            ctx.fillStyle = '#1a1e3a';
            ctx.fillRect(shelf1X, shelf1Y, 60, 6);
            // Objects on shelf 1 (small rectangles)
            ctx.fillStyle = '#4fd4ff';
            ctx.fillRect(shelf1X + 5, shelf1Y - 12, 8, 12);
            ctx.fillStyle = '#c554ff';
            ctx.fillRect(shelf1X + 20, shelf1Y - 15, 10, 15);
            ctx.fillStyle = '#4fd4ff';
            ctx.fillRect(shelf1X + 40, shelf1Y - 10, 12, 10);

            // Shelf 2 (lower)
            const shelf2Y = lerp(backCeilingY, backFloorY, 0.6);
            const shelf2X = lerp(backLeftX, frontLeftX, 0.65);
            ctx.fillStyle = '#1a1e3a';
            ctx.fillRect(shelf2X, shelf2Y, 70, 6);
            // Objects on shelf 2
            ctx.fillStyle = '#c554ff';
            ctx.fillRect(shelf2X + 8, shelf2Y - 14, 12, 14);
            ctx.fillStyle = '#4fd4ff';
            ctx.fillRect(shelf2X + 30, shelf2Y - 18, 15, 18);
            ctx.fillStyle = '#c554ff';
            ctx.fillRect(shelf2X + 52, shelf2Y - 12, 10, 12);

            // LEFT WALL: Poster (glowing rectangle) - 左墙：发光海报
            const posterY = lerp(backCeilingY, backFloorY, 0.45);
            const posterX = lerp(backLeftX, frontLeftX, 0.5);
            ctx.shadowColor = 'rgba(79, 212, 255, 0.5)';
            ctx.shadowBlur = 12;
            ctx.fillStyle = 'rgba(79, 212, 255, 0.2)';
            ctx.fillRect(posterX, posterY, 40, 55);
            ctx.strokeStyle = '#4fd4ff';
            ctx.lineWidth = 2;
            ctx.strokeRect(posterX, posterY, 40, 55);

            // RIGHT WALL: Two floating shelves - 右墙：两个浮动架子
            // Shelf 1 (upper)
            const rshelf1Y = lerp(backCeilingY, backFloorY, 0.35);
            const rshelf1X = lerp(backRightX, frontRightX, 0.7) - 60;
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#1a1e3a';
            ctx.fillRect(rshelf1X, rshelf1Y, 60, 6);
            // Objects
            ctx.fillStyle = '#c554ff';
            ctx.fillRect(rshelf1X + 10, rshelf1Y - 10, 10, 10);
            ctx.fillStyle = '#4fd4ff';
            ctx.fillRect(rshelf1X + 28, rshelf1Y - 14, 12, 14);
            ctx.fillStyle = '#c554ff';
            ctx.fillRect(rshelf1X + 45, rshelf1Y - 12, 8, 12);

            // Shelf 2 (lower)
            const rshelf2Y = lerp(backCeilingY, backFloorY, 0.65);
            const rshelf2X = lerp(backRightX, frontRightX, 0.65) - 70;
            ctx.fillStyle = '#1a1e3a';
            ctx.fillRect(rshelf2X, rshelf2Y, 70, 6);
            // Objects
            ctx.fillStyle = '#4fd4ff';
            ctx.fillRect(rshelf2X + 12, rshelf2Y - 16, 14, 16);
            ctx.fillStyle = '#c554ff';
            ctx.fillRect(rshelf2X + 35, rshelf2Y - 12, 10, 12);
            ctx.fillStyle = '#4fd4ff';
            ctx.fillRect(rshelf2X + 52, rshelf2Y - 18, 12, 18);

            // RIGHT WALL: Light panel (purple glow) - 右墙：紫色发光面板
            const panelY = lerp(backCeilingY, backFloorY, 0.5);
            const panelX = lerp(backRightX, frontRightX, 0.5) - 45;
            ctx.shadowColor = 'rgba(197, 84, 255, 0.6)';
            ctx.shadowBlur = 15;
            ctx.fillStyle = 'rgba(197, 84, 255, 0.25)';
            ctx.fillRect(panelX, panelY, 45, 60);
            ctx.strokeStyle = '#c554ff';
            ctx.lineWidth = 2;
            ctx.strokeRect(panelX, panelY, 45, 60);

            ctx.restore();
        }

        // ========== 侧墙霓虹相框 Wall Neon Frames ==========
        // Draws horizontal neon-framed displays on left and right walls at eye level
        // Frame size now fits snugly around poster images
        // 在左右侧墙上绘制水平霓虹相框（相框紧密贴合海报）
        function drawWallFrames(
            ctx,
            frontLeftX, frontRightX,
            backLeftX, backRightX,
            frontCeilingY, backCeilingY,
            frontFloorY, backFloorY
        ) {
            // POSTER DIMENSIONS - Define poster area first, then build frame around it
            // Posters are positioned at eye level on the walls
            const posterDepthStart = 0.15;  // Start 15% from front
            const posterDepthEnd = 0.70;    // End 70% from front (55% width)
            const posterCenterY = 0.50;     // Centered vertically at 50%

            // Poster dimensions with 16:9 aspect ratio
            const posterWidthRatio = posterDepthEnd - posterDepthStart; // 0.55
            const posterHeightRatio = posterWidthRatio * 0.56;  // ~16:9 aspect ratio

            const posterTopRatio = posterCenterY - posterHeightRatio / 2;
            const posterBottomRatio = posterCenterY + posterHeightRatio / 2;

            // FRAME MARGIN - Small padding between poster and neon frame
            // Convert pixel margin to ratio based on typical wall size
            const FRAME_MARGIN_RATIO = 0.012; // ~14px equivalent margin

            ctx.save();

            // ========== LEFT WALL FRAME (CS:GO POSTER) ==========
            {
                // Step 1: Define POSTER area (no margin yet)
                const posterTopY = lerp(frontCeilingY, frontFloorY, posterTopRatio);
                const posterTopBackY = lerp(backCeilingY, backFloorY, posterTopRatio);
                const posterBottomY = lerp(frontCeilingY, frontFloorY, posterBottomRatio);
                const posterBottomBackY = lerp(backCeilingY, backFloorY, posterBottomRatio);

                const posterFrontTop = {
                    x: lerp(frontLeftX, backLeftX, posterDepthStart),
                    y: lerp(posterTopY, posterTopBackY, posterDepthStart)
                };
                const posterBackTop = {
                    x: lerp(frontLeftX, backLeftX, posterDepthEnd),
                    y: lerp(posterTopY, posterTopBackY, posterDepthEnd)
                };
                const posterBackBottom = {
                    x: lerp(frontLeftX, backLeftX, posterDepthEnd),
                    y: lerp(posterBottomY, posterBottomBackY, posterDepthEnd)
                };
                const posterFrontBottom = {
                    x: lerp(frontLeftX, backLeftX, posterDepthStart),
                    y: lerp(posterBottomY, posterBottomBackY, posterDepthStart)
                };

                // Step 2: Build FRAME around poster with margin
                const frameDepthStart = posterDepthStart - FRAME_MARGIN_RATIO;
                const frameDepthEnd = posterDepthEnd + FRAME_MARGIN_RATIO;
                const frameTopRatio = posterTopRatio - FRAME_MARGIN_RATIO;
                const frameBottomRatio = posterBottomRatio + FRAME_MARGIN_RATIO;

                const frameTopY = lerp(frontCeilingY, frontFloorY, frameTopRatio);
                const frameTopBackY = lerp(backCeilingY, backFloorY, frameTopRatio);
                const frameBottomY = lerp(frontCeilingY, frontFloorY, frameBottomRatio);
                const frameBottomBackY = lerp(backCeilingY, backFloorY, frameBottomRatio);

                const frameFrontTop = {
                    x: lerp(frontLeftX, backLeftX, frameDepthStart),
                    y: lerp(frameTopY, frameTopBackY, frameDepthStart)
                };
                const frameBackTop = {
                    x: lerp(frontLeftX, backLeftX, frameDepthEnd),
                    y: lerp(frameTopY, frameTopBackY, frameDepthEnd)
                };
                const frameBackBottom = {
                    x: lerp(frontLeftX, backLeftX, frameDepthEnd),
                    y: lerp(frameBottomY, frameBottomBackY, frameDepthEnd)
                };
                const frameFrontBottom = {
                    x: lerp(frontLeftX, backLeftX, frameDepthStart),
                    y: lerp(frameBottomY, frameBottomBackY, frameDepthStart)
                };

                // Step 3: Draw dark background for frame
                ctx.beginPath();
                ctx.moveTo(frameFrontTop.x, frameFrontTop.y);
                ctx.lineTo(frameBackTop.x, frameBackTop.y);
                ctx.lineTo(frameBackBottom.x, frameBackBottom.y);
                ctx.lineTo(frameFrontBottom.x, frameFrontBottom.y);
                ctx.closePath();
                ctx.fillStyle = 'rgba(5, 10, 25, 0.85)';
                ctx.fill();

                // Step 4: Draw CS:GO poster image
                if (csgoImageLoaded) {
                    ctx.save();

                    // Create clipping path for the poster area
                    ctx.beginPath();
                    ctx.moveTo(posterFrontTop.x, posterFrontTop.y);
                    ctx.lineTo(posterBackTop.x, posterBackTop.y);
                    ctx.lineTo(posterBackBottom.x, posterBackBottom.y);
                    ctx.lineTo(posterFrontBottom.x, posterFrontBottom.y);
                    ctx.closePath();
                    ctx.clip();

                    // Calculate bounding box and draw image to fill it completely
                    const minX = Math.min(posterFrontTop.x, posterBackTop.x, posterBackBottom.x, posterFrontBottom.x);
                    const maxX = Math.max(posterFrontTop.x, posterBackTop.x, posterBackBottom.x, posterFrontBottom.x);
                    const minY = Math.min(posterFrontTop.y, posterBackTop.y, posterBackBottom.y, posterFrontBottom.y);
                    const maxY = Math.max(posterFrontTop.y, posterBackTop.y, posterBackBottom.y, posterFrontBottom.y);

                    const boxWidth = maxX - minX;
                    const boxHeight = maxY - minY;

                    // Use "cover" behavior - fill the entire box
                    const imageAspect = csgoImage.width / csgoImage.height;
                    const boxAspect = boxWidth / boxHeight;

                    let drawWidth, drawHeight, drawX, drawY;
                    if (imageAspect > boxAspect) {
                        // Image is wider - fit to height, crop width
                        drawHeight = boxHeight;
                        drawWidth = drawHeight * imageAspect;
                        drawY = minY;
                        drawX = minX - (drawWidth - boxWidth) / 2;
                    } else {
                        // Image is taller - fit to width, crop height
                        drawWidth = boxWidth;
                        drawHeight = drawWidth / imageAspect;
                        drawX = minX;
                        drawY = minY - (drawHeight - boxHeight) / 2;
                    }

                    ctx.drawImage(csgoImage, drawX, drawY, drawWidth, drawHeight);
                    ctx.restore();
                }

                // Step 5: Draw neon frame outline
                ctx.beginPath();
                ctx.moveTo(frameFrontTop.x, frameFrontTop.y);
                ctx.lineTo(frameBackTop.x, frameBackTop.y);
                ctx.lineTo(frameBackBottom.x, frameBackBottom.y);
                ctx.lineTo(frameFrontBottom.x, frameFrontBottom.y);
                ctx.closePath();
                ctx.strokeStyle = 'rgba(140, 210, 255, 1.0)';
                ctx.lineWidth = 5;
                ctx.shadowColor = 'rgba(140, 210, 255, 1.0)';
                ctx.shadowBlur = 25;
                ctx.stroke();
            }

            // ========== RIGHT WALL FRAME (VALORANT POSTER) ==========
            {
                // Step 1: Define POSTER area (no margin yet)
                const posterTopY = lerp(frontCeilingY, frontFloorY, posterTopRatio);
                const posterTopBackY = lerp(backCeilingY, backFloorY, posterTopRatio);
                const posterBottomY = lerp(frontCeilingY, frontFloorY, posterBottomRatio);
                const posterBottomBackY = lerp(backCeilingY, backFloorY, posterBottomRatio);

                const posterFrontTop = {
                    x: lerp(frontRightX, backRightX, posterDepthStart),
                    y: lerp(posterTopY, posterTopBackY, posterDepthStart)
                };
                const posterBackTop = {
                    x: lerp(frontRightX, backRightX, posterDepthEnd),
                    y: lerp(posterTopY, posterTopBackY, posterDepthEnd)
                };
                const posterBackBottom = {
                    x: lerp(frontRightX, backRightX, posterDepthEnd),
                    y: lerp(posterBottomY, posterBottomBackY, posterDepthEnd)
                };
                const posterFrontBottom = {
                    x: lerp(frontRightX, backRightX, posterDepthStart),
                    y: lerp(posterBottomY, posterBottomBackY, posterDepthStart)
                };

                // Step 2: Build FRAME around poster with margin
                const frameDepthStart = posterDepthStart - FRAME_MARGIN_RATIO;
                const frameDepthEnd = posterDepthEnd + FRAME_MARGIN_RATIO;
                const frameTopRatio = posterTopRatio - FRAME_MARGIN_RATIO;
                const frameBottomRatio = posterBottomRatio + FRAME_MARGIN_RATIO;

                const frameTopY = lerp(frontCeilingY, frontFloorY, frameTopRatio);
                const frameTopBackY = lerp(backCeilingY, backFloorY, frameTopRatio);
                const frameBottomY = lerp(frontCeilingY, frontFloorY, frameBottomRatio);
                const frameBottomBackY = lerp(backCeilingY, backFloorY, frameBottomRatio);

                const frameFrontTop = {
                    x: lerp(frontRightX, backRightX, frameDepthStart),
                    y: lerp(frameTopY, frameTopBackY, frameDepthStart)
                };
                const frameBackTop = {
                    x: lerp(frontRightX, backRightX, frameDepthEnd),
                    y: lerp(frameTopY, frameTopBackY, frameDepthEnd)
                };
                const frameBackBottom = {
                    x: lerp(frontRightX, backRightX, frameDepthEnd),
                    y: lerp(frameBottomY, frameBottomBackY, frameDepthEnd)
                };
                const frameFrontBottom = {
                    x: lerp(frontRightX, backRightX, frameDepthStart),
                    y: lerp(frameBottomY, frameBottomBackY, frameDepthStart)
                };

                // Step 3: Draw dark background for frame
                ctx.beginPath();
                ctx.moveTo(frameFrontTop.x, frameFrontTop.y);
                ctx.lineTo(frameBackTop.x, frameBackTop.y);
                ctx.lineTo(frameBackBottom.x, frameBackBottom.y);
                ctx.lineTo(frameFrontBottom.x, frameFrontBottom.y);
                ctx.closePath();
                ctx.fillStyle = 'rgba(5, 10, 25, 0.85)';
                ctx.fill();

                // Step 4: Draw Valorant poster image
                if (valorantImageLoaded) {
                    ctx.save();

                    // Create clipping path for the poster area
                    ctx.beginPath();
                    ctx.moveTo(posterFrontTop.x, posterFrontTop.y);
                    ctx.lineTo(posterBackTop.x, posterBackTop.y);
                    ctx.lineTo(posterBackBottom.x, posterBackBottom.y);
                    ctx.lineTo(posterFrontBottom.x, posterFrontBottom.y);
                    ctx.closePath();
                    ctx.clip();

                    // Calculate bounding box and draw image to fill it completely
                    const minX = Math.min(posterFrontTop.x, posterBackTop.x, posterBackBottom.x, posterFrontBottom.x);
                    const maxX = Math.max(posterFrontTop.x, posterBackTop.x, posterBackBottom.x, posterFrontBottom.x);
                    const minY = Math.min(posterFrontTop.y, posterBackTop.y, posterBackBottom.y, posterFrontBottom.y);
                    const maxY = Math.max(posterFrontTop.y, posterBackTop.y, posterBackBottom.y, posterFrontBottom.y);

                    const boxWidth = maxX - minX;
                    const boxHeight = maxY - minY;

                    // Use "cover" behavior - fill the entire box
                    const imageAspect = valorantImage.width / valorantImage.height;
                    const boxAspect = boxWidth / boxHeight;

                    let drawWidth, drawHeight, drawX, drawY;
                    if (imageAspect > boxAspect) {
                        // Image is wider - fit to height, crop width
                        drawHeight = boxHeight;
                        drawWidth = drawHeight * imageAspect;
                        drawY = minY;
                        drawX = minX - (drawWidth - boxWidth) / 2;
                    } else {
                        // Image is taller - fit to width, crop height
                        drawWidth = boxWidth;
                        drawHeight = drawWidth / imageAspect;
                        drawX = minX;
                        drawY = minY - (drawHeight - boxHeight) / 2;
                    }

                    ctx.drawImage(valorantImage, drawX, drawY, drawWidth, drawHeight);
                    ctx.restore();
                }

                // Step 5: Draw neon frame outline
                ctx.beginPath();
                ctx.moveTo(frameFrontTop.x, frameFrontTop.y);
                ctx.lineTo(frameBackTop.x, frameBackTop.y);
                ctx.lineTo(frameBackBottom.x, frameBackBottom.y);
                ctx.lineTo(frameFrontBottom.x, frameFrontBottom.y);
                ctx.closePath();
                ctx.strokeStyle = 'rgba(140, 210, 255, 1.0)';
                ctx.lineWidth = 5;
                ctx.shadowColor = 'rgba(140, 210, 255, 1.0)';
                ctx.shadowBlur = 25;
                ctx.stroke();
            }

            ctx.restore();
        }

        // ========== 地板纹理 Floor Texture ==========
        // Image texture for plush gaming rug, clipped to floor trapezoid
        // 地板纹理图片（毛绒游戏地毯），裁剪到地板梯形区域
        function drawFloorTexture(frontLeftX, frontRightX, backLeftX, backRightX, frontFloorY, backFloorY) {
            if (!floorTextureLoaded) return;

            const FL = { x: frontLeftX,  y: frontFloorY };
            const FR = { x: frontRightX, y: frontFloorY };
            const BR = { x: backRightX,  y: backFloorY };
            const BL = { x: backLeftX,   y: backFloorY };

            ctx.save();

            // Clip to the floor polygon
            ctx.beginPath();
            ctx.moveTo(FL.x, FL.y);
            ctx.lineTo(FR.x, FR.y);
            ctx.lineTo(BR.x, BR.y);
            ctx.lineTo(BL.x, BL.y);
            ctx.closePath();
            ctx.clip();

            // Draw the texture stretched over the entire floor area (full width from front)
            // 将纹理拉伸覆盖整个地板区域（从前端完整宽度）
            const dx = frontLeftX;  // Start from front left edge
            const dy = backFloorY;
            const dw = frontRightX - frontLeftX;  // Full front width
            const dh = frontFloorY - backFloorY;

            ctx.drawImage(
                floorTexture,
                0, 0, floorTexture.width, floorTexture.height,
                dx, dy, dw, dh
            );

            ctx.restore();
        }

        // ========== Plush Rug Fuzz Overlay ==========
        // Adds fiber texture and vignette on top of the floor texture to simulate a plush gaming rug
        // 在地板纹理上添加纤维纹理和渐变，模拟毛绒游戏地毯
        function drawRugSoftPlushOverlay(
            ctx,
            frontLeftX, frontRightX,
            backLeftX, backRightX,
            frontFloorY, backFloorY
        ) {
            const BL = { x: backLeftX,   y: backFloorY };
            const BR = { x: backRightX,  y: backFloorY };
            const FL = { x: frontLeftX,  y: frontFloorY };
            const FR = { x: frontRightX, y: frontFloorY };

            // Clip exactly to the rug trapezoid so nothing spills outside
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(FL.x, FL.y);
            ctx.lineTo(FR.x, FR.y);
            ctx.lineTo(BR.x, BR.y);
            ctx.lineTo(BL.x, BL.y);
            ctx.closePath();
            ctx.clip();

            // -----------------------------------
            // 1) VERY SOFT vignette (almost invisible)
            // -----------------------------------
            // Just slightly darken the far edge and sides to remove the "glossy" feel,
            // but keep the image bright overall.
            const height = frontFloorY - backFloorY;
            const grad = ctx.createLinearGradient(0, backFloorY, 0, frontFloorY);
            grad.addColorStop(0.0, "rgba(0, 0, 0, 0.20)"); // far end a bit darker
            grad.addColorStop(0.4, "rgba(0, 0, 0, 0.08)");
            grad.addColorStop(1.0, "rgba(0, 0, 0, 0.03)");

            ctx.fillStyle = grad;
            ctx.globalAlpha = 1.0;
            ctx.fillRect(
                BL.x - 5,
                backFloorY - 5,
                BR.x - BL.x + 10,
                height + 10
            );

            // -----------------------------------
            // 2) fine "fiber" noise for plush feeling
            // -----------------------------------
            const fibers = 1200; // fewer strokes than before
            ctx.globalAlpha = 0.18;
            ctx.strokeStyle = "rgba(255, 255, 255, 0.40)";
            ctx.lineWidth   = 0.8;
            ctx.lineCap     = "round";

            for (let i = 0; i < fibers; i++) {
                const t = Math.random(); // depth 0..1
                const y = backFloorY + height * t;

                const leftX  = BL.x + (FL.x - BL.x) * t;
                const rightX = BR.x + (FR.x - BR.x) * t;
                const span   = rightX - leftX;

                const x  = leftX + Math.random() * span;
                const len = span * (0.004 + Math.random() * 0.010);

                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x + len, y);
                ctx.stroke();
            }

            // darker fibers (very subtle) to break uniformity
            ctx.globalAlpha = 0.10;
            ctx.strokeStyle = "rgba(0, 0, 0, 0.55)";
            for (let i = 0; i < fibers * 0.4; i++) {
                const t = Math.random();
                const y = backFloorY + height * t;

                const leftX  = BL.x + (FL.x - BL.x) * t;
                const rightX = BR.x + (FR.x - BR.x) * t;
                const span   = rightX - leftX;

                const x  = leftX + Math.random() * span;
                const len = span * (0.003 + Math.random() * 0.008);

                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x + len * 0.6, y + 0.5);
                ctx.stroke();
            }

            ctx.restore();

            // thin outline so the rug reads as an object on the floor
            ctx.save();
            ctx.strokeStyle = "rgba(200, 230, 255, 0.35)";
            ctx.lineWidth   = 1;
            ctx.beginPath();
            ctx.moveTo(FL.x, FL.y);
            ctx.lineTo(FR.x, FR.y);
            ctx.lineTo(BR.x, BR.y);
            ctx.lineTo(BL.x, BL.y);
            ctx.closePath();
            ctx.stroke();
            ctx.restore();
        }

        // ========== 科技模拟时钟 Tech Analog Clock ==========
        // Large sci-fi analog clock with hands, neon rings, and HUD aesthetic
        // 大型科幻模拟时钟，带指针、霓虹环和HUD美学
        function drawTechAnalogClock(backLeftX, backRightX, backCeilingY, backFloorY) {
            // geometry: centered on the back wall, above the monitor
            const cx = (backLeftX + backRightX) / 2;
            const cy = backCeilingY + (backFloorY - backCeilingY) * 0.20;

            // BIG radius so it feels important
            const outerRadius = 70;
            const innerRadius = 52;

            const now = new Date();
            const ms  = now.getMilliseconds();
            const sec = now.getSeconds() + ms / 1000;
            const min = now.getMinutes() + sec / 60;
            const hr  = (now.getHours() % 12) + min / 60;

            // convert to angles (0 at top, clockwise)
            const secAngle = -Math.PI / 2 + (sec / 60) * Math.PI * 2;
            const minAngle = -Math.PI / 2 + (min / 60) * Math.PI * 2;
            const hrAngle  = -Math.PI / 2 + (hr  / 12) * Math.PI * 2;

            // ===========================
            // BACKGROUND GLOW & OUTER RING
            // ===========================
            ctx.save();
            ctx.shadowColor = "rgba(120, 200, 255, 0.95)";
            ctx.shadowBlur  = 45;

            // soft outer halo
            const haloGrad = ctx.createRadialGradient(cx, cy, innerRadius * 0.4, cx, cy, outerRadius * 1.4);
            haloGrad.addColorStop(0.0, "rgba(10, 30, 70, 0.8)");
            haloGrad.addColorStop(1.0, "rgba(0, 0, 0, 0.0)");
            ctx.fillStyle = haloGrad;
            ctx.beginPath();
            ctx.arc(cx, cy, outerRadius * 1.4, 0, Math.PI * 2);
            ctx.fill();

            // outer neon ring
            ctx.strokeStyle = "#6fd8ff";
            ctx.lineWidth   = 5;
            ctx.beginPath();
            ctx.arc(cx, cy, outerRadius, 0, Math.PI * 2);
            ctx.stroke();

            // inner ring
            ctx.strokeStyle = "#c554ff";
            ctx.lineWidth   = 3;
            ctx.beginPath();
            ctx.arc(cx, cy, innerRadius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();

            // ===========================
            // TICK MARKS (TECH RING)
            // ===========================
            ctx.save();
            ctx.strokeStyle = "rgba(180, 210, 255, 0.85)";
            ctx.lineWidth   = 2;
            ctx.lineCap     = "round";

            for (let i = 0; i < 60; i++) {
                const a = -Math.PI / 2 + (i / 60) * Math.PI * 2;
                const cos = Math.cos(a);
                const sin = Math.sin(a);

                const isMajor = (i % 5 === 0);
                const rOuter  = outerRadius - 4;
                const rInner  = isMajor ? innerRadius - 10 : innerRadius - 5;

                ctx.beginPath();
                ctx.moveTo(cx + cos * rInner, cy + sin * rInner);
                ctx.lineTo(cx + cos * rOuter, cy + sin * rOuter);
                ctx.stroke();
            }
            ctx.restore();

            // ===========================
            // NEON SECOND ARC (sci-fi feeling)
            // ===========================
            ctx.save();
            ctx.shadowColor = "rgba(197, 84, 255, 0.9)";
            ctx.shadowBlur  = 30;
            ctx.strokeStyle = "#c554ff";
            ctx.lineWidth   = 4;

            const secSweep = (sec / 60) * Math.PI * 2;
            ctx.beginPath();
            ctx.arc(cx, cy, innerRadius + 6, -Math.PI / 2, -Math.PI / 2 + secSweep);
            ctx.stroke();
            ctx.restore();

            // ===========================
            // HOUR, MINUTE AND SECOND HANDS
            // ===========================
            ctx.save();
            ctx.lineCap = "round";

            // hour hand
            ctx.strokeStyle = "rgba(220, 235, 255, 0.95)";
            ctx.lineWidth   = 4;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(
                cx + Math.cos(hrAngle) * (innerRadius - 18),
                cy + Math.sin(hrAngle) * (innerRadius - 18)
            );
            ctx.stroke();

            // minute hand
            ctx.strokeStyle = "#6fd8ff";
            ctx.lineWidth   = 3;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(
                cx + Math.cos(minAngle) * (innerRadius - 10),
                cy + Math.sin(minAngle) * (innerRadius - 10)
            );
            ctx.stroke();

            // second hand (thin, bright, slightly longer)
            ctx.strokeStyle = "#ff5df5";
            ctx.lineWidth   = 2;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(
                cx + Math.cos(secAngle) * (innerRadius + 6),
                cy + Math.sin(secAngle) * (innerRadius + 6)
            );
            ctx.stroke();

            // center node
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(cx, cy, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();

            // ===========================
            // NUMERIC LABEL UNDER THE CLOCK (OPTIONAL)
            // ===========================
            const hhStr = String(now.getHours()).padStart(2, "0");
            const mmStr = String(now.getMinutes()).padStart(2, "0");
            const ssStr = String(now.getSeconds()).padStart(2, "0");
            const timeLabel = `${hhStr}:${mmStr}:${ssStr}`;

            ctx.save();
            ctx.fillStyle   = "rgba(210, 230, 255, 0.75)";
            ctx.font        = "14px monospace";
            ctx.textAlign   = "center";
            ctx.textBaseline = "top";
            ctx.fillText(timeLabel, cx, cy + outerRadius + 10);
            ctx.restore();
        }

        // ========== 桌子和电脑绘制 Desk and Computer Drawing ==========
        // Clean, symmetric desk with large monitor - standing on the floor
        // 干净对称的桌子和大显示器 - 站立在地板上
        function drawDeskAndComputer(backLeftX, backRightX, backFloorY, t) {
            // TWO-PHASE SCALING: normal approach (0→0.8) + extra close-up (0.8→1.0)
            // 两阶段缩放：正常接近（0→0.8）+ 额外特写（0.8→1.0）
            const tClamped = clamp01(t);

            // Phase 1: base approach (0 to 0.8)
            const basePhase = Math.min(tClamped, 0.8) / 0.8;  // 0..1 from 0 to 0.8

            // Phase 2: close-up zoom (0.8 to 1.0)
            const closePhase = clamp01((tClamped - 0.8) / 0.2);  // 0..1 from 0.8 to 1.0

            // Ease the close-up phase for smooth feeling (smoothstep)
            const closePhaseEased = closePhase * closePhase * (3 - 2 * closePhase);

            // Compute final scale: base approach + extra close-up zoom
            let computerScale = lerp(COMPUTER_SCALE_FAR, COMPUTER_SCALE_MID, basePhase);
            computerScale = lerp(computerScale, COMPUTER_SCALE_CLOSE, closePhaseEased);

            const floorY = backFloorY;  // Desk legs touch the back wall floor line
            const cx = (backLeftX + backRightX) / 2;

            // Vertical offset for close-up: slide desk+monitor down so monitor stays visible
            // 特写时的垂直偏移：将桌子+显示器整体下移，使显示器保持在画面内
            const MAX_DOWN_OFFSET = 40 * computerScale;
            const downOffset = lerp(0, MAX_DOWN_OFFSET, closePhaseEased);

            // ========== 桌子尺寸 Desk dimensions ==========
            const deskWidth     = 360 * computerScale;
            const deskThickness = 14  * computerScale;
            const legWidth      = 24  * computerScale;

            // 桌面前边缘位置 Front edge of desktop - adjusted by downOffset
            const deskFrontY = floorY - 32 * computerScale + downOffset;
            const deskTopY   = deskFrontY - deskThickness;
            const deskLeftX  = cx - deskWidth / 2;
            const deskRightX = cx + deskWidth / 2;

            // ========== 绘制桌面 Draw desk top (full rectangle, symmetric) ==========
            ctx.fillStyle = '#4b4e59';
            ctx.fillRect(deskLeftX, deskTopY, deskWidth, deskThickness);

            // 桌面前边缘厚度 Slight front face for thickness
            ctx.fillStyle = '#3d3f48';
            ctx.fillRect(deskLeftX, deskFrontY, deskWidth, 4 * computerScale);

            // ========== 绘制桌腿 Draw desk legs (two straight legs down to floor) ==========
            const legTopY = deskFrontY + 4 * computerScale;
            const legBottomY = floorY;  // Legs touch floor

            ctx.fillStyle = '#343640';

            // 左桌腿 Left leg
            const leftLegX = cx - deskWidth * 0.22 - legWidth / 2;
            ctx.fillRect(leftLegX, legTopY, legWidth, legBottomY - legTopY);

            // 右桌腿 Right leg
            const rightLegX = cx + deskWidth * 0.22 - legWidth / 2;
            ctx.fillRect(rightLegX, legTopY, legWidth, legBottomY - legTopY);

            // ========== 显示器和支架 Monitor + Stand ==========
            // Increased sizes so desk + monitor occupy ~2/3 screen height when close
            // 增大尺寸，使得靠近时桌子+显示器占据约2/3屏幕高度
            const monitorWidth  = 220 * computerScale;
            const monitorHeight = 140 * computerScale;
            const monitorBorder = 5   * computerScale;

            const standHeight = 32 * computerScale;
            const standWidth  = 32 * computerScale;

            const basePlateWidth  = 110 * computerScale;
            const basePlateHeight = 10  * computerScale;

            // 底座板在桌面上 Base plate on top of desk
            const basePlateBottomY = deskTopY;
            const basePlateTopY    = basePlateBottomY - basePlateHeight;

            ctx.fillStyle = '#3b3e49';
            ctx.fillRect(
                cx - basePlateWidth / 2,
                basePlateTopY,
                basePlateWidth,
                basePlateHeight
            );

            // 支架 Stand
            const standBottomY = basePlateTopY;
            const standTopY    = standBottomY - standHeight;

            ctx.fillStyle = '#505361';
            ctx.fillRect(
                cx - standWidth / 2,
                standTopY,
                standWidth,
                standHeight
            );

            // 显示器外框 Monitor frame
            const monitorBottomY = standTopY - 8 * computerScale;
            const monitorTopY    = monitorBottomY - monitorHeight;
            const monitorLeftX   = cx - monitorWidth / 2;

            ctx.fillStyle = '#050711';
            ctx.fillRect(
                monitorLeftX,
                monitorTopY,
                monitorWidth,
                monitorHeight
            );

            ctx.strokeStyle = 'rgba(220, 230, 255, 0.95)';
            ctx.lineWidth = monitorBorder;
            ctx.strokeRect(
                monitorLeftX,
                monitorTopY,
                monitorWidth,
                monitorHeight
            );

            // 屏幕内部蓝色发光 Inner blue screen glow
            ctx.save();
            ctx.shadowColor = 'rgba(90, 150, 255, 0.9)';
            ctx.shadowBlur = 28 * computerScale;
            ctx.fillStyle = '#2c74ff';

            const padding = 9 * computerScale;
            ctx.fillRect(
                monitorLeftX + padding,
                monitorTopY + padding,
                monitorWidth  - padding * 2,
                monitorHeight - padding * 2
            );
            ctx.restore();

            // Update monitor bounds for click detection
            // 更新显示器边界用于点击检测
            monitorBounds.x = monitorLeftX;
            monitorBounds.y = monitorTopY;
            monitorBounds.w = monitorWidth;
            monitorBounds.h = monitorHeight;

            // When player is at the front, show "Click Screen" hint on the monitor
            // 到达走廊最前时，在屏幕上显示"Click Screen"提示
            const isAtFront = (tClamped >= 0.98) && (viewMode === 'corridor');
            if (isAtFront) {
                const now = performance.now() / 1000;
                const blink = 0.5 + 0.5 * Math.sin(now * 3.0); // 0..1 pulsing

                ctx.save();
                ctx.font = `bold ${18 * computerScale}px 'Segoe UI', Arial, sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                // Subtle glow effect
                ctx.shadowColor = 'rgba(79, 212, 255, ' + blink + ')';
                ctx.shadowBlur = 15 * computerScale;
                ctx.fillStyle = 'rgba(79, 212, 255, ' + blink + ')';

                const hintX = cx;
                const hintY = monitorTopY + monitorHeight / 2;
                ctx.fillText('Click Screen', hintX, hintY);

                ctx.restore();
            }

            // Removed: Soft floor shadow under desk (per user request)
            // 移除：桌子下方地板阴影（根据用户要求）
        }

        // ========== FLOOR 2: AUDIO ROOM SCENE ==========
        // Futuristic audio / speaker room with same geometry as Floor 1 gaming room
        // 未来风格的音频/扬声器房间，与1楼游戏室使用相同的几何结构
        function drawAudioRoomScene() {
            // Use same perspective geometry as corridor1
            const t = walkProgress;

            // Back wall horizontal: slightly wider when closer
            const backLeftX  = lerp(CORRIDOR_BACK_LEFT_X_FAR,  CORRIDOR_BACK_LEFT_X_NEAR,  t);
            const backRightX = lerp(CORRIDOR_BACK_RIGHT_X_FAR, CORRIDOR_BACK_RIGHT_X_NEAR, t);

            // Back wall vertical: floor line moves down a bit when closer
            const backFloorY   = lerp(CORRIDOR_BACK_FLOOR_Y_FAR, CORRIDOR_BACK_FLOOR_Y_NEAR, t);
            const backCeilingY = CORRIDOR_BACK_CEILING_Y;

            // Front edges of side walls: FIXED
            const frontLeftX    = CORRIDOR_FRONT_LEFT_X;
            const frontRightX   = CORRIDOR_FRONT_RIGHT_X;
            const frontCeilingY = CORRIDOR_FRONT_CEILING_Y;
            const frontFloorY   = CORRIDOR_FRONT_FLOOR_Y;

            // === DRAW FLOOR ===
            ctx.fillStyle = '#050716';  // Dark blue floor
            ctx.beginPath();
            ctx.moveTo(frontLeftX, frontFloorY);
            ctx.lineTo(frontRightX, frontFloorY);
            ctx.lineTo(backRightX, backFloorY);
            ctx.lineTo(backLeftX, backFloorY);
            ctx.closePath();
            ctx.fill();

            // Floor grid scrolling (same as gaming room)
            const tileSize = TILE_SIZE;
            const offset = floorScroll % tileSize;

            ctx.save();
            ctx.strokeStyle = 'rgba(79, 212, 255, 0.12)';
            ctx.lineWidth = 1;

            const numHLines = Math.ceil((frontFloorY - backFloorY) / tileSize) + 2;
            for (let i = 0; i < numHLines; i++) {
                const y = backFloorY + (i * tileSize) + offset;
                if (y < backFloorY || y > frontFloorY) continue;

                const tLine = (y - backFloorY) / (frontFloorY - backFloorY);
                const leftX = lerp(backLeftX, frontLeftX, tLine);
                const rightX = lerp(backRightX, frontRightX, tLine);

                ctx.beginPath();
                ctx.moveTo(leftX, y);
                ctx.lineTo(rightX, y);
                ctx.stroke();
            }

            const numVLines = 8;
            for (let i = 0; i <= numVLines; i++) {
                const tLine = i / numVLines;
                const frontX = lerp(frontLeftX, frontRightX, tLine);
                const backX = lerp(backLeftX, backRightX, tLine);

                ctx.beginPath();
                ctx.moveTo(frontX, frontFloorY);
                ctx.lineTo(backX, backFloorY);
                ctx.stroke();
            }
            ctx.restore();

            // === DRAW LEFT WALL ===
            const leftWallGrad = ctx.createLinearGradient(frontLeftX, 0, backLeftX, 0);
            leftWallGrad.addColorStop(0, '#101427');
            leftWallGrad.addColorStop(0.5, '#1a1e3a');
            leftWallGrad.addColorStop(1, '#101427');

            ctx.fillStyle = leftWallGrad;
            ctx.beginPath();
            ctx.moveTo(frontLeftX, frontCeilingY);
            ctx.lineTo(backLeftX, backCeilingY);
            ctx.lineTo(backLeftX, backFloorY);
            ctx.lineTo(frontLeftX, frontFloorY);
            ctx.closePath();
            ctx.fill();

            // === DRAW RIGHT WALL ===
            const rightWallGrad = ctx.createLinearGradient(backRightX, 0, frontRightX, 0);
            rightWallGrad.addColorStop(0, '#101427');
            rightWallGrad.addColorStop(0.5, '#1a1e3a');
            rightWallGrad.addColorStop(1, '#101427');

            ctx.fillStyle = rightWallGrad;
            ctx.beginPath();
            ctx.moveTo(frontRightX, frontCeilingY);
            ctx.lineTo(backRightX, backCeilingY);
            ctx.lineTo(backRightX, backFloorY);
            ctx.lineTo(frontRightX, frontFloorY);
            ctx.closePath();
            ctx.fill();

            // === DRAW CEILING ===
            ctx.fillStyle = '#050716';
            ctx.beginPath();
            ctx.moveTo(frontLeftX, frontCeilingY);
            ctx.lineTo(frontRightX, frontCeilingY);
            ctx.lineTo(backRightX, backCeilingY);
            ctx.lineTo(backLeftX, backCeilingY);
            ctx.closePath();
            ctx.fill();

            // Ceiling grid (purple accent)
            ctx.save();
            ctx.strokeStyle = 'rgba(197, 84, 255, 0.08)';
            ctx.lineWidth = 1;
            const ceilingOffset = ceilingScroll % 80;
            const numCLines = Math.ceil((backCeilingY - frontCeilingY) / 80) + 2;
            for (let i = 0; i < numCLines; i++) {
                const y = frontCeilingY + (i * 80) + ceilingOffset - 80;
                if (y < frontCeilingY || y > backCeilingY) continue;

                const tLine = (y - frontCeilingY) / (backCeilingY - frontCeilingY);
                const leftX = lerp(frontLeftX, backLeftX, tLine);
                const rightX = lerp(frontRightX, backRightX, tLine);

                ctx.beginPath();
                ctx.moveTo(leftX, y);
                ctx.lineTo(rightX, y);
                ctx.stroke();
            }
            ctx.restore();

            // === DRAW BACK WALL ===
            const wallGrad = ctx.createLinearGradient(0, backCeilingY, 0, backFloorY);
            wallGrad.addColorStop(0, '#101427');
            wallGrad.addColorStop(1, '#050716');
            ctx.fillStyle = wallGrad;
            ctx.fillRect(backLeftX, backCeilingY, backRightX - backLeftX, backFloorY - backCeilingY);

            // === DRAW NEON LINES (same as gaming room) ===
            drawAudioRoomNeon(frontLeftX, frontRightX, backLeftX, backRightX,
                              frontCeilingY, backCeilingY, frontFloorY, backFloorY);

            // === DRAW CENTRAL DISPLAY SCREEN ===
            drawAudioRoomCentralScreen(backLeftX, backRightX, backCeilingY, backFloorY);

            // === DRAW SPEAKERS ===
            drawAudioRoomSpeakers(frontLeftX, frontRightX, backLeftX, backRightX,
                                  frontCeilingY, backCeilingY, frontFloorY, backFloorY);

            // Update "Back to Elevator" button position
            backButton.y = H - backButton.h - 20;
        }

        // ========== Audio Room Neon Lines ==========
        function drawAudioRoomNeon(frontLeftX, frontRightX, backLeftX, backRightX,
                                   frontCeilingY, backCeilingY, frontFloorY, backFloorY) {
            // --- CEILING NEON ---
            ctx.save();
            ctx.shadowColor = "rgba(120, 120, 255, 0.9)";
            ctx.shadowBlur  = 26;
            ctx.strokeStyle = "#7fddff";
            ctx.lineWidth   = 3;

            const offset = 6;

            // Left ceiling edge
            ctx.beginPath();
            ctx.moveTo(frontLeftX + offset,  frontCeilingY + offset);
            ctx.lineTo(backLeftX  + offset,  backCeilingY  + offset);
            ctx.stroke();

            // Right ceiling edge
            ctx.beginPath();
            ctx.moveTo(frontRightX - offset, frontCeilingY + offset);
            ctx.lineTo(backRightX - offset,  backCeilingY  + offset);
            ctx.stroke();
            ctx.restore();

            // --- Back floor neon ---
            ctx.save();
            ctx.shadowColor = "rgba(80, 140, 255, 0.9)";
            ctx.shadowBlur  = 22;
            ctx.strokeStyle = "#4f8dff";
            ctx.lineWidth   = 3;
            ctx.beginPath();
            ctx.moveTo(backLeftX,  backFloorY + 1);
            ctx.lineTo(backRightX, backFloorY + 1);
            ctx.stroke();
            ctx.restore();

            // --- Back wall neon frame ---
            ctx.save();
            ctx.shadowColor = "rgba(120, 180, 255, 0.9)";
            ctx.shadowBlur  = 26;
            ctx.strokeStyle = "#6fd8ff";
            ctx.lineWidth   = 3;

            const backWallOffset = 3;

            // Left vertical edge
            ctx.beginPath();
            ctx.moveTo(backLeftX + backWallOffset, backCeilingY + backWallOffset);
            ctx.lineTo(backLeftX + backWallOffset, backFloorY - backWallOffset);
            ctx.stroke();

            // Right vertical edge
            ctx.beginPath();
            ctx.moveTo(backRightX - backWallOffset, backCeilingY + backWallOffset);
            ctx.lineTo(backRightX - backWallOffset, backFloorY - backWallOffset);
            ctx.stroke();

            // Top horizontal edge
            ctx.beginPath();
            ctx.moveTo(backLeftX + backWallOffset, backCeilingY + backWallOffset);
            ctx.lineTo(backRightX - backWallOffset, backCeilingY + backWallOffset);
            ctx.stroke();
            ctx.restore();

            // --- DIAGONAL PURPLE STRIPS on side walls ---
            ctx.save();
            ctx.shadowColor = "rgba(200, 80, 255, 0.9)";
            ctx.shadowBlur  = 26;
            ctx.strokeStyle = "#c554ff";
            ctx.lineWidth   = 3;

            function lerpWallLeft(t) {
                const x = frontLeftX + (backLeftX - frontLeftX) * t;
                const y = frontCeilingY + (backFloorY - frontCeilingY) * t;
                return { x, y };
            }

            function lerpWallRight(t) {
                const x = frontRightX + (backRightX - frontRightX) * t;
                const y = frontCeilingY + (backFloorY - frontCeilingY) * t;
                return { x, y };
            }

            const tStart = 0.20;
            const tEnd   = 0.85;

            // LEFT wall diagonal
            const L0 = lerpWallLeft(tStart);
            const L1 = lerpWallLeft(tEnd);
            ctx.beginPath();
            ctx.moveTo(L0.x + 4, L0.y);
            ctx.lineTo(L1.x + 4, L1.y);
            ctx.stroke();

            // RIGHT wall diagonal
            const R0 = lerpWallRight(tStart);
            const R1 = lerpWallRight(tEnd);
            ctx.beginPath();
            ctx.moveTo(R0.x - 4, R0.y);
            ctx.lineTo(R1.x - 4, R1.y);
            ctx.stroke();

            ctx.restore();
        }

        // ========== Audio Room Central Display Screen ==========
        function drawAudioRoomCentralScreen(backLeftX, backRightX, backCeilingY, backFloorY) {
            // Large LED-style screen on the back wall, centered
            const screenWidth = (backRightX - backLeftX) * 0.50;  // 50% of back wall width
            const screenHeight = (backFloorY - backCeilingY) * 0.28;  // 28% of wall height

            const screenX = backLeftX + (backRightX - backLeftX - screenWidth) / 2;
            const screenY = backCeilingY + (backFloorY - backCeilingY) * 0.35;  // Positioned at eye level

            // Screen background (brighter with stronger glow)
            const bgGrad = ctx.createLinearGradient(screenX, screenY, screenX, screenY + screenHeight);
            bgGrad.addColorStop(0, '#0f0f1f');
            bgGrad.addColorStop(1, '#0a0a15');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(screenX, screenY, screenWidth, screenHeight);

            // Outer glow aura around screen
            ctx.save();
            const outerGlow = ctx.createRadialGradient(
                screenX + screenWidth/2, screenY + screenHeight/2, 0,
                screenX + screenWidth/2, screenY + screenHeight/2, screenWidth * 0.7
            );
            outerGlow.addColorStop(0, 'rgba(79, 212, 255, 0.2)');
            outerGlow.addColorStop(1, 'rgba(79, 212, 255, 0)');
            ctx.fillStyle = outerGlow;
            ctx.fillRect(screenX - 40, screenY - 40, screenWidth + 80, screenHeight + 80);
            ctx.restore();

            // Screen border with stronger cyan glow
            ctx.save();
            ctx.shadowColor = 'rgba(79, 212, 255, 1.0)';
            ctx.shadowBlur = 30;
            ctx.strokeStyle = '#6fddff';
            ctx.lineWidth = 5;
            ctx.strokeRect(screenX, screenY, screenWidth, screenHeight);
            ctx.restore();

            // Display song page image if loaded, otherwise show waveform
            if (songPageImageLoaded) {
                ctx.save();

                // Create clipping region for screen content
                ctx.beginPath();
                ctx.rect(screenX + 5, screenY + 5, screenWidth - 10, screenHeight - 10);
                ctx.clip();

                // Calculate image dimensions to fill screen with cover behavior
                const imageAspect = songPageImage.width / songPageImage.height;
                const screenAspect = screenWidth / screenHeight;

                let drawWidth, drawHeight, drawX, drawY;

                if (imageAspect > screenAspect) {
                    // Image is wider - fit to height
                    drawHeight = screenHeight;
                    drawWidth = drawHeight * imageAspect;
                    drawY = screenY;
                    drawX = screenX + (screenWidth - drawWidth) / 2;
                } else {
                    // Image is taller - fit to width
                    drawWidth = screenWidth;
                    drawHeight = drawWidth / imageAspect;
                    drawX = screenX;
                    drawY = screenY + (screenHeight - drawHeight) / 2;
                }

                // Draw the song page image
                ctx.drawImage(songPageImage, drawX, drawY, drawWidth, drawHeight);

                ctx.restore();
            } else {
                // Fallback: animated waveform if image not loaded
                const time = Date.now() * 0.001;
                ctx.save();
                ctx.strokeStyle = 'rgba(79, 212, 255, 0.9)';
                ctx.lineWidth = 3;
                ctx.shadowColor = 'rgba(79, 212, 255, 0.6)';
                ctx.shadowBlur = 10;

                // Simple audio waveform visualization
                const wavePoints = 30;
                ctx.beginPath();
                for (let i = 0; i <= wavePoints; i++) {
                    const x = screenX + 20 + (screenWidth - 40) * (i / wavePoints);
                    const wave1 = Math.sin(i * 0.5 + time * 2) * 15;
                    const wave2 = Math.sin(i * 0.3 - time * 1.5) * 10;
                    const y = screenY + screenHeight / 2 + wave1 + wave2;

                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
                ctx.restore();

                // Screen title text - brighter
                ctx.save();
                ctx.fillStyle = 'rgba(120, 220, 255, 1.0)';
                ctx.font = 'bold 18px monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(79, 212, 255, 0.8)';
                ctx.shadowBlur = 12;
                ctx.fillText('AUDIO SYSTEM', screenX + screenWidth / 2, screenY + 22);
                ctx.restore();
            }
        }

        // ========== Audio Room Speakers (3D Box Speakers) ==========
        function drawAudioRoomSpeakers(frontLeftX, frontRightX, backLeftX, backRightX,
                                       frontCeilingY, backCeilingY, frontFloorY, backFloorY) {

            // Helper function to draw a 3D speaker box facing the viewer
            function draw3DSpeaker(centerX, centerY, width, height, isLarge, neonColor, shadowColor) {
                const depth = width * 0.4;  // 3D depth of the speaker box

                // === Draw 3D box (cabinet) ===
                // Right side face (darker)
                ctx.fillStyle = '#1a1a1f';
                ctx.beginPath();
                ctx.moveTo(centerX + width/2, centerY - height/2);  // Top right front
                ctx.lineTo(centerX + width/2 + depth*0.6, centerY - height/2 - depth*0.3);  // Top right back
                ctx.lineTo(centerX + width/2 + depth*0.6, centerY + height/2 - depth*0.3);  // Bottom right back
                ctx.lineTo(centerX + width/2, centerY + height/2);  // Bottom right front
                ctx.closePath();
                ctx.fill();

                // Top face (medium shade)
                ctx.fillStyle = '#252530';
                ctx.beginPath();
                ctx.moveTo(centerX - width/2, centerY - height/2);  // Top left front
                ctx.lineTo(centerX - width/2 + depth*0.6, centerY - height/2 - depth*0.3);  // Top left back
                ctx.lineTo(centerX + width/2 + depth*0.6, centerY - height/2 - depth*0.3);  // Top right back
                ctx.lineTo(centerX + width/2, centerY - height/2);  // Top right front
                ctx.closePath();
                ctx.fill();

                // Front face (main visible face - lighter)
                const frontGrad = ctx.createLinearGradient(centerX - width/2, centerY, centerX + width/2, centerY);
                frontGrad.addColorStop(0, '#2a2a35');
                frontGrad.addColorStop(0.5, '#35354a');
                frontGrad.addColorStop(1, '#2a2a35');
                ctx.fillStyle = frontGrad;
                ctx.fillRect(centerX - width/2, centerY - height/2, width, height);

                // === Add speaker components on front face ===
                const padding = width * 0.12;

                if (isLarge) {
                    // Large speaker: Big woofer + small tweeter on top
                    const wooferRadius = width * 0.32;
                    const wooferCenterY = centerY + height * 0.15;

                    // Woofer (large round driver)
                    // Outer cone shadow
                    const wooferShadowGrad = ctx.createRadialGradient(
                        centerX, wooferCenterY, 0,
                        centerX, wooferCenterY, wooferRadius
                    );
                    wooferShadowGrad.addColorStop(0, '#0a0a0f');
                    wooferShadowGrad.addColorStop(0.7, '#1a1a25');
                    wooferShadowGrad.addColorStop(1, '#0a0a0f');
                    ctx.fillStyle = wooferShadowGrad;
                    ctx.beginPath();
                    ctx.arc(centerX, wooferCenterY, wooferRadius, 0, Math.PI * 2);
                    ctx.fill();

                    // Woofer cone (lighter center)
                    const coneGrad = ctx.createRadialGradient(
                        centerX - wooferRadius * 0.3, wooferCenterY - wooferRadius * 0.3, 0,
                        centerX, wooferCenterY, wooferRadius * 0.7
                    );
                    coneGrad.addColorStop(0, '#3a3a45');
                    coneGrad.addColorStop(1, '#1a1a25');
                    ctx.fillStyle = coneGrad;
                    ctx.beginPath();
                    ctx.arc(centerX, wooferCenterY, wooferRadius * 0.7, 0, Math.PI * 2);
                    ctx.fill();

                    // Dust cap (center dot)
                    ctx.fillStyle = '#0f0f18';
                    ctx.beginPath();
                    ctx.arc(centerX, wooferCenterY, wooferRadius * 0.25, 0, Math.PI * 2);
                    ctx.fill();

                    // Dust cap highlight
                    ctx.fillStyle = 'rgba(100, 100, 120, 0.3)';
                    ctx.beginPath();
                    ctx.arc(centerX - wooferRadius * 0.1, wooferCenterY - wooferRadius * 0.1, wooferRadius * 0.15, 0, Math.PI * 2);
                    ctx.fill();

                    // Tweeter (horn tweeter on top)
                    const tweeterCenterY = centerY - height * 0.25;
                    const tweeterWidth = width * 0.18;
                    const tweeterHeight = width * 0.15;

                    // Tweeter horn body
                    ctx.fillStyle = '#1a1a25';
                    ctx.beginPath();
                    ctx.ellipse(centerX, tweeterCenterY, tweeterWidth, tweeterHeight, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Tweeter horn opening (lighter)
                    ctx.fillStyle = '#2a2a35';
                    ctx.beginPath();
                    ctx.ellipse(centerX, tweeterCenterY, tweeterWidth * 0.6, tweeterHeight * 0.6, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Tweeter center
                    ctx.fillStyle = '#0a0a0f';
                    ctx.beginPath();
                    ctx.arc(centerX, tweeterCenterY, tweeterWidth * 0.25, 0, Math.PI * 2);
                    ctx.fill();

                    // Bass reflex port (bottom)
                    const portWidth = width * 0.22;
                    const portHeight = height * 0.08;
                    const portY = centerY + height * 0.38;
                    ctx.fillStyle = '#0a0a0f';
                    ctx.fillRect(centerX - portWidth/2, portY, portWidth, portHeight);

                    // Port inner shadow
                    const portGrad = ctx.createLinearGradient(centerX, portY, centerX, portY + portHeight);
                    portGrad.addColorStop(0, 'rgba(0, 0, 0, 0.5)');
                    portGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                    ctx.fillStyle = portGrad;
                    ctx.fillRect(centerX - portWidth/2, portY, portWidth, portHeight);

                } else {
                    // Small speaker: Medium woofer + tweeter
                    const wooferRadius = width * 0.28;
                    const wooferCenterY = centerY + height * 0.1;

                    // Woofer
                    const wooferShadowGrad = ctx.createRadialGradient(
                        centerX, wooferCenterY, 0,
                        centerX, wooferCenterY, wooferRadius
                    );
                    wooferShadowGrad.addColorStop(0, '#0a0a0f');
                    wooferShadowGrad.addColorStop(0.7, '#1a1a25');
                    wooferShadowGrad.addColorStop(1, '#0a0a0f');
                    ctx.fillStyle = wooferShadowGrad;
                    ctx.beginPath();
                    ctx.arc(centerX, wooferCenterY, wooferRadius, 0, Math.PI * 2);
                    ctx.fill();

                    // Cone
                    const coneGrad = ctx.createRadialGradient(
                        centerX - wooferRadius * 0.3, wooferCenterY - wooferRadius * 0.3, 0,
                        centerX, wooferCenterY, wooferRadius * 0.7
                    );
                    coneGrad.addColorStop(0, '#3a3a45');
                    coneGrad.addColorStop(1, '#1a1a25');
                    ctx.fillStyle = coneGrad;
                    ctx.beginPath();
                    ctx.arc(centerX, wooferCenterY, wooferRadius * 0.7, 0, Math.PI * 2);
                    ctx.fill();

                    // Dust cap
                    ctx.fillStyle = '#0f0f18';
                    ctx.beginPath();
                    ctx.arc(centerX, wooferCenterY, wooferRadius * 0.3, 0, Math.PI * 2);
                    ctx.fill();

                    // Tweeter (small round dome tweeter)
                    const tweeterCenterY = centerY - height * 0.28;
                    const tweeterRadius = width * 0.12;

                    ctx.fillStyle = '#1a1a25';
                    ctx.beginPath();
                    ctx.arc(centerX, tweeterCenterY, tweeterRadius, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#2a2a35';
                    ctx.beginPath();
                    ctx.arc(centerX, tweeterCenterY, tweeterRadius * 0.6, 0, Math.PI * 2);
                    ctx.fill();
                }

                // === Add corner screws ===
                const screwRadius = width * 0.015;
                const screwInset = width * 0.08;
                const screwPositions = [
                    {x: centerX - width/2 + screwInset, y: centerY - height/2 + screwInset},
                    {x: centerX + width/2 - screwInset, y: centerY - height/2 + screwInset},
                    {x: centerX - width/2 + screwInset, y: centerY + height/2 - screwInset},
                    {x: centerX + width/2 - screwInset, y: centerY + height/2 - screwInset}
                ];

                screwPositions.forEach(pos => {
                    ctx.fillStyle = '#0a0a0f';
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, screwRadius, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = '#1a1a25';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                });

                // === Neon outline around cabinet edges ===
                ctx.save();
                ctx.shadowColor = shadowColor;
                ctx.shadowBlur = 18;
                ctx.strokeStyle = neonColor;
                ctx.lineWidth = 2;

                // Front face outline
                ctx.strokeRect(centerX - width/2, centerY - height/2, width, height);

                // 3D edge lines
                ctx.beginPath();
                // Top edge
                ctx.moveTo(centerX - width/2, centerY - height/2);
                ctx.lineTo(centerX - width/2 + depth*0.6, centerY - height/2 - depth*0.3);
                // Right edge
                ctx.moveTo(centerX + width/2, centerY - height/2);
                ctx.lineTo(centerX + width/2 + depth*0.6, centerY - height/2 - depth*0.3);
                ctx.stroke();

                ctx.restore();

                // === Soft ambient glow around speaker ===
                ctx.save();
                const ambientGlow = ctx.createRadialGradient(
                    centerX, centerY, 0,
                    centerX, centerY, Math.max(width, height) * 0.8
                );
                ambientGlow.addColorStop(0, shadowColor.replace('0.9)', '0.15)'));
                ambientGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = ambientGlow;
                ctx.fillRect(centerX - width, centerY - height, width * 2, height * 2);
                ctx.restore();
            }

            // === Position speakers in the room ===

            // LEFT WALL - BOTTOM SPEAKER (Large floor-standing)
            const leftBottomX = frontLeftX + (backLeftX - frontLeftX) * 0.35;
            const leftBottomY = frontFloorY - (frontFloorY - frontCeilingY) * 0.22;
            const leftBottomWidth = 80;
            const leftBottomHeight = 140;

            draw3DSpeaker(leftBottomX, leftBottomY, leftBottomWidth, leftBottomHeight, true, '#4fd4ff', 'rgba(79, 212, 255, 0.9)');

            // Floor shadow under left bottom speaker
            ctx.save();
            const leftShadowGrad = ctx.createRadialGradient(
                leftBottomX, frontFloorY, 0,
                leftBottomX, frontFloorY, 100
            );
            leftShadowGrad.addColorStop(0, 'rgba(0, 0, 0, 0.5)');
            leftShadowGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = leftShadowGrad;
            ctx.fillRect(leftBottomX - 100, frontFloorY - 20, 200, 40);
            ctx.restore();

            // LEFT WALL - TOP SPEAKER (Small wall-mounted)
            const leftTopX = frontLeftX + (backLeftX - frontLeftX) * 0.38;
            const leftTopY = frontCeilingY + (frontFloorY - frontCeilingY) * 0.32;
            const leftTopWidth = 60;
            const leftTopHeight = 90;

            draw3DSpeaker(leftTopX, leftTopY, leftTopWidth, leftTopHeight, false, '#c554ff', 'rgba(197, 84, 255, 0.9)');

            // Mounting bracket for top speaker (small line connecting to wall)
            ctx.save();
            ctx.strokeStyle = '#2a2a35';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(leftTopX + leftTopWidth/2, leftTopY);
            ctx.lineTo(leftTopX + leftTopWidth/2 + 15, leftTopY - 8);
            ctx.stroke();
            ctx.restore();

            // RIGHT WALL - BOTTOM SPEAKER (Large floor-standing, mirrored)
            const rightBottomX = frontRightX - (frontRightX - backRightX) * 0.35;
            const rightBottomY = frontFloorY - (frontFloorY - frontCeilingY) * 0.22;

            draw3DSpeaker(rightBottomX, rightBottomY, leftBottomWidth, leftBottomHeight, true, '#4fd4ff', 'rgba(79, 212, 255, 0.9)');

            // Floor shadow under right bottom speaker
            ctx.save();
            const rightShadowGrad = ctx.createRadialGradient(
                rightBottomX, frontFloorY, 0,
                rightBottomX, frontFloorY, 100
            );
            rightShadowGrad.addColorStop(0, 'rgba(0, 0, 0, 0.5)');
            rightShadowGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = rightShadowGrad;
            ctx.fillRect(rightBottomX - 100, frontFloorY - 20, 200, 40);
            ctx.restore();

            // RIGHT WALL - TOP SPEAKER (Small wall-mounted, mirrored)
            const rightTopX = frontRightX - (frontRightX - backRightX) * 0.38;
            const rightTopY = frontCeilingY + (frontFloorY - frontCeilingY) * 0.32;

            draw3DSpeaker(rightTopX, rightTopY, leftTopWidth, leftTopHeight, false, '#c554ff', 'rgba(197, 84, 255, 0.9)');

            // Mounting bracket for top speaker (mirrored)
            ctx.save();
            ctx.strokeStyle = '#2a2a35';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(rightTopX - leftTopWidth/2, rightTopY);
            ctx.lineTo(rightTopX - leftTopWidth/2 - 15, rightTopY - 8);
            ctx.stroke();
            ctx.restore();
        }

        // ========== "Back to Elevator" 按钮绘制 Button Drawing ==========
        // Appears only in corridor scene, bottom-left corner
        // 仅在走廊场景中出现，位于左下角
        function drawBackToElevatorButton(ctx) {
            const w = backButton.w;
            const h = backButton.h;
            const x = backButton.x;
            const y = backButton.y;

            ctx.save();

            // Background - dark rounded rectangle with subtle glow
            ctx.fillStyle = "#222832";
            ctx.strokeStyle = "rgba(120, 160, 255, 0.7)";
            ctx.lineWidth = 2;
            ctx.shadowColor = "rgba(120, 160, 255, 0.4)";
            ctx.shadowBlur = 8;

            ctx.beginPath();
            ctx.roundRect(x, y, w, h, 10);
            ctx.fill();
            ctx.stroke();

            // Text - white, centered
            ctx.shadowBlur = 0;  // Reset shadow for text
            ctx.fillStyle = "white";
            ctx.font = "16px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("Back to Elevator", x + w / 2, y + h / 2);

            ctx.restore();
        }

        // ========== 全屏显示器视角 / 游戏中心 Monitor View Fullscreen / Game Hub ==========
        // When player clicks monitor, show fullscreen game hub
        // 当玩家点击显示器时，显示全屏游戏中心

        // Helper: Draw background stars for game hub
        function drawGameHubStars() {
            gameHubStars.forEach(star => {
                star.twinkle += 0.02;
                const alpha = star.alpha + Math.sin(star.twinkle) * 0.2;
                ctx.fillStyle = `rgba(200, 220, 255, ${alpha})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        // Shared game title rendering function for consistent styling
        function drawGameTitle(ctx, text, color) {
            ctx.save();
            ctx.font = "bold 28px Orbitron, system-ui";
            ctx.textAlign = "center";
            ctx.textBaseline = "top";
            ctx.fillStyle = color || "#ffcc66";
            ctx.shadowColor = color || "#ffcc66";
            ctx.shadowBlur = 12;
            ctx.fillText(text, canvas.width / 2, 40);
            ctx.restore();
        }

        // Initialize unlock mechanism
        function initGameHubUnlock(index) {
            const type = gameIcons[index].unlockType;

            switch(type) {
                case 'charge':
                    gameUnlockData = { charge: 0 };
                    break;
                case 'drag':
                    gameUnlockData = {
                        knifeX: W / 2 - 200,
                        knifeY: H / 2,
                        fruitX: W / 2 + 200,
                        fruitY: H / 2,
                        dragging: false,
                        cut: false,
                        cutAnim: 0
                    };
                    break;
                case 'slide':
                    gameUnlockData = { sliderPos: 0, dragging: false, doorAnim: 0 };
                    break;
                case 'password':
                    gameUnlockData = { input: '', cursor: 0, cursorBlink: 0 };
                    break;
                case 'rotate':
                    gameUnlockData = {
                        planetX: W / 2,
                        planetY: H / 2,
                        rotation: 0,
                        totalRotation: 0,
                        lastAngle: 0,
                        dragging: false
                    };
                    break;
            }
        }

        // Start unlock sequence
        function startGameHubUnlock(index) {
            currentUnlockIndex = index;
            gameHubState = 'unlock_' + index;
            initGameHubUnlock(index);
        }

        // Start game
        function startGameHubGame(index) {
            currentGameIndex = index;
            gameHubState = 'game_' + index;

            // Sync monitor state system
            monitorState = "game";
            const gameNames = ["lightning", "fruit", "space", "memory", "maze"];
            activeGame = gameNames[index];

            initGameHub(index);
        }

        // Initialize game
        function initGameHub(index) {
            switch(index) {
                case 0: // Lightning Reaction
                    gameData = {
                        timeLeft: 30,
                        score: 0,
                        buttons: [],
                        nextSpawn: 0,
                        activeButton: -1,
                        difficulty: 1
                    };
                    // Center the 3x2 button grid
                    const cols = 3;
                    const rows = 2;
                    const tileSize = 100;
                    const tileGapX = 180;
                    const tileGapY = 100;
                    const gridWidth = cols * tileSize + (cols - 1) * tileGapX;
                    const gridHeight = rows * tileSize + (rows - 1) * tileGapY;
                    const gridOffsetX = (canvas.width - gridWidth) / 2;
                    const gridOffsetY = (canvas.height - gridHeight) / 2 + 40;

                    for (let i = 0; i < 6; i++) {
                        const col = i % 3;
                        const row = Math.floor(i / 3);
                        gameData.buttons.push({
                            x: gridOffsetX + col * (tileSize + tileGapX) + tileSize / 2,
                            y: gridOffsetY + row * (tileSize + tileGapY) + tileSize / 2,
                            size: tileSize,
                            active: false
                        });
                    }
                    break;

                case 1: // Fruit Slicing
                    gameData = {
                        timeLeft: 45,
                        score: 0,
                        fruits: [],
                        particles: [],
                        spawnTimer: 0,
                        spawnInterval: 1200, // milliseconds
                        timeSinceStart: 0
                    };
                    break;

                case 2: // Maze
                    gameData = {
                        playerX: 1,
                        playerY: 1,
                        enemies: [
                            { x: 15, y: 1, dir: 0 },
                            { x: 1, y: 9, dir: 1 },
                            { x: 15, y: 9, dir: 2 }
                        ],
                        gameOver: false,
                        won: false
                    };
                    break;

                case 3: { // Memory Cards - use block scope for const variables
                    gameData = {
                        cards: [],
                        flipped: [],
                        matched: [],
                        moves: 0,
                        canFlip: true
                    };
                    const colors = ['#f44336', '#2196f3', '#4caf50', '#ffeb3b', '#9c27b0', '#ff9800', '#00bcd4', '#e91e63'];
                    const pairs = [...colors, ...colors];
                    pairs.sort(() => Math.random() - 0.5);

                    // Center the 4×4 grid
                    const cardCols = 4;
                    const cardRows = 4;
                    const cardSize = 100;
                    const cardGap = 20;
                    const gridW = cardCols * cardSize + (cardCols - 1) * cardGap;
                    const gridH = cardRows * cardSize + (cardRows - 1) * cardGap;
                    const startX = canvas.width / 2 - gridW / 2;
                    const startY = canvas.height / 2 - gridH / 2 + 20;

                    for (let i = 0; i < 16; i++) {
                        const col = i % 4;
                        const row = Math.floor(i / 4);
                        gameData.cards.push({
                            x: startX + col * (cardSize + cardGap) + cardSize / 2,
                            y: startY + row * (cardSize + cardGap) + cardSize / 2,
                            size: cardSize,
                            color: pairs[i],
                            index: i
                        });
                    }
                    break;
                }

                case 4: // Space Dodge
                    gameData = {
                        shipX: W / 2,
                        shipY: H - 100,
                        meteors: [],
                        score: 0,
                        lives: 3,
                        nextSpawn: 0,
                        difficulty: 1,
                        gameOver: false
                    };
                    break;
            }
        }

        // Handle lobby clicks
        function handleGameHubLobbyClick() {
            // Check game icon clicks
            gameIcons.forEach((icon, i) => {
                if (pointInCircle_hub(gameHubMouseX, gameHubMouseY, icon.x, icon.y, icon.size / 2)) {
                    if (gameUnlockStates[i]) {
                        // Already unlocked, go to game
                        startGameHubGame(i);
                    } else {
                        // Start unlock sequence
                        startGameHubUnlock(i);
                    }
                }
            });
        }

        // Draw lobby scene
        function drawGameHubLobby() {
            // Background gradient
            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, '#1a1a2e');
            grad.addColorStop(0.5, '#16213e');
            grad.addColorStop(1, '#0f3460');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            drawGameHubStars();

            // Title
            ctx.save();
            ctx.shadowColor = '#4fd4ff';
            ctx.shadowBlur = 20;
            ctx.fillStyle = '#4fd4ff';
            ctx.font = 'bold 48px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('MINI GAME HUB', centerX_hub, 80);
            ctx.restore();

            // Subtitle
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.font = '20px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Select a game to unlock and play', centerX_hub, 120);

            // Game icons
            gameIcons.forEach((icon, i) => {
                const isHovering = pointInCircle_hub(gameHubMouseX, gameHubMouseY, icon.x, icon.y, icon.size / 2);

                // Smooth hover animation
                if (isHovering) {
                    icon.hoverScale = Math.min(icon.hoverScale + 0.05, 1.2);
                    icon.glowAlpha = Math.min(icon.glowAlpha + 0.05, 0.8);
                } else {
                    icon.hoverScale = Math.max(icon.hoverScale - 0.05, 1.0);
                    icon.glowAlpha = Math.max(icon.glowAlpha - 0.05, 0.3);
                }

                const size = icon.size * icon.hoverScale;

                // Glow (increased radius)
                ctx.save();
                ctx.shadowColor = icon.color;
                ctx.shadowBlur = 40; // Increased from 30
                ctx.globalAlpha = icon.glowAlpha;
                ctx.fillStyle = icon.color;
                ctx.beginPath();
                ctx.arc(icon.x, icon.y, size / 2 + 8, 0, Math.PI * 2); // Increased from +5 to +8 (1.6×)
                ctx.fill();
                ctx.restore();

                // Icon circle
                ctx.save();
                if (gameUnlockStates[i]) {
                    ctx.fillStyle = icon.color;
                } else {
                    ctx.fillStyle = '#2a2a4a';
                }
                ctx.beginPath();
                ctx.arc(icon.x, icon.y, size / 2, 0, Math.PI * 2);
                ctx.fill();

                // Border (slightly thicker)
                ctx.strokeStyle = gameUnlockStates[i] ? '#fff' : '#555';
                ctx.lineWidth = 4; // Increased from 3 (1.33×)
                ctx.stroke();
                ctx.restore();

                // Emoji
